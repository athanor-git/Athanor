<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Athanor — Gematria & Sigil Workbench</title>
<style>
:root{--bg:#faf7f0;--card:#fff;--ink:#1a1712;--sub:#6b6357;--acc:#7a5c2e;--line:#e3ddd0;--hit:#fff3c9}
@media(prefers-color-scheme:dark){:root{--bg:#14120e;--card:#1e1b15;--ink:#ece5d8;--sub:#9a9184;--acc:#d0a85c;--line:#33302a;--hit:#4a3f1e}}

header{padding:10px 14px;border-bottom:1px solid var(--line)}

.tab{border:1px solid var(--line);background:var(--card);border-radius:8px 8px 0 0;padding:7px 14px;cursor:pointer;font-size:14px}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:820px;margin:0 auto;padding:12px}
input,select{font-size:16px;padding:9px 12px;border:1.5px solid var(--acc);border-radius:9px;background:var(--card);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.hint{color:var(--sub);font-size:13.5px}

.val{font-size:34px;font-weight:700;color:var(--acc)}

.mtch{cursor:default}.big{font-size:20px}
svg{width:100%;max-width:460px;height:auto;display:block;margin:6px auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
.exp{background:var(--hit);border-radius:8px;padding:9px 12px;font-size:13px;margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

function numAbjad(n){ if(n<=0||n>9999)return'';

// ---- Hebrew letters (tab Hebrew letters): value, final-letter (sofit) value, name
const LROWS=DB.rows('letters');
const VAL=Object.fromEntries(LROWS.flatMap(l=>l.final_glyph?[[l.glyph,l.value],[l.final_glyph,l.value]]:[[l.glyph,l.value]]));
const SOF=Object.fromEntries(LROWS.filter(l=>l.final_glyph).map(l=>[l.final_glyph,l.final_value]));
const LETTERS=LROWS.map(l=>[l.glyph,l.name,l.value]);
function letterVal(c,mode){ return (mode==='final'&&SOF[c])?SOF[c]:VAL[c]||0; }
function value(w,mode){ let s=0; for(const c of w) s+=letterVal(c,mode); return s; }
function buildKbd(id,target){
  $('#'+id).innerHTML = LETTERS.map(([g,n,v])=>`<b onclick="ins('${target}','${g}')">${g}<small>${n} ${v}</small></b>`).join('')
   + `<b onclick="ins('${target}','')" style="min-width:44px">⌫<small>del</small></b>`;
}
function ins(target,g){ const el=$('#'+target); if(g==='') el.value=el.value.slice(0,-1); else el.value+=g; el.dispatchEvent(new Event('input')); }
function tab(t){ for(const x of ['gem','rose','kam','abjad','wafq','seals']){ $('#'+x).style.display=x===t?'block':'none';
  document.querySelector('.tab[data-t="'+x+'"]').classList.toggle('on',x===t);} }
// ---- gematria
function gem(){
  const raw=$('#gin').value.trim(), mode=$('#gmode').value;
  if(!raw){ $('#gout').innerHTML=''; return; }
  let v, heb='';
  if(/^\d+$/.test(raw)){ v=parseInt(raw); }
  else { heb=raw; v=value(raw,mode); }
  let h=`<div class="card"><div class="row"><div class="val">${N(v)}</div>`;
  if(heb){ h+=`<div><div class="heb">${esc(heb)}</div><div class="hint">`+
    [...heb].map(c=>`${c}=${N(letterVal(c,mode))}`).join(' + ')+` = <b>${N(v)}</b></div></div>`; }
  h+='</div>';
  const m=G.idx[v]||[];
  if(m.length){
    h+=`<div class="hint" style="margin-top:8px">${DB.text('gem.matches',{count:N(m.length),value:N(v)})}</div><table>`;
    for(const [w,t,label,k] of m)
      h+=`<tr class="mtch"><td class="heb big">${esc(w)}</td><td>${esc(t)||'<span class="hint">—</span>'}</td><td class="hint">Col ${label}, Key ${N(k)}<br>${esc(G.colname[label]||'')}</td></tr>`;
    h+='</table>';
  } else h+='<div class="hint" style="margin-top:6px">No other table entry has this exact value.</div>';
  h+=`<div class="exp">${DB.text('gem.what')}</div></div>`;
  $('#gout').innerHTML=h;
}
// ---- Rose Cross geometry
const ROSE={};
(function(){
  const cx=200,cy=205;
  // the rings are the Sepher Yetzirah's three classes, which follow each letter's attribution (tab Key scale): the
  // 12 singles (signs) outermost, the 7 doubles (planets) in the middle, the 3 mothers (elements) innermost
  const ring=l=>{const k=DB.rev('keyscale','letter',l.id)[0]||{};return k.element?'inner':k.planet?'mid':'outer';};
  const of=r=>LROWS.filter(l=>ring(l)===r).map(l=>l.glyph);
  const outer=of('outer'), mid=of('mid'), inner=of('inner');
  outer.forEach((c,i)=>{const a=(-90+i*30)*Math.PI/180;ROSE[c]=[cx+150*Math.cos(a),cy+150*Math.sin(a)];});
  mid.forEach((c,i)=>{const a=(-90+i*360/7)*Math.PI/180;ROSE[c]=[cx+92*Math.cos(a),cy+92*Math.sin(a)];});
  inner.forEach((c,i)=>{const a=(-90+i*120)*Math.PI/180;ROSE[c]=[cx+42*Math.cos(a),cy+42*Math.sin(a)];});
})();
function drawRose(){
  const w=$('#rin').value.trim();
  let h='';
  // petals
  for(const c in ROSE){const [x,y]=ROSE[c];
    h+=`<circle cx="${x}" cy="${y}" r="15" fill="var(--card)" stroke="var(--line)"/><text x="${x}" y="${y+6}" font-size="17" text-anchor="middle" fill="var(--ink)">${c}</text>`;}
  // trace
  const pts=[...w].filter(c=>ROSE[c]).map(c=>ROSE[c]);
  if(pts.length){
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    h+=`<path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2.5"/>`;
    const s=pts[0]; h+=`<circle cx="${s[0]}" cy="${s[1]}" r="6" fill="none" stroke="var(--acc)" stroke-width="2.5"/>`;
    if(pts.length>1){const e=pts[pts.length-1],p=pts[pts.length-2];
      const dx=e[0]-p[0],dy=e[1]-p[1],L=Math.hypot(dx,dy)||1,nx=-dy/L*7,ny=dx/L*7;
      h+=`<line x1="${e[0]-nx}" y1="${e[1]-ny}" x2="${e[0]+nx}" y2="${e[1]+ny}" stroke="var(--acc)" stroke-width="2.5"/>`;}
  }
  $('#rosesvg').innerHTML=h;
}
// ---- Planetary Kamea (tab Kameas), keyed by the planet's name as Liber 777 prints it (Sol, Luna): {n, sq, row}
const KAM={};
function cellOf(sq,n,num){ for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(sq[r][c]===num)return[r,c]; return null; }
function reduce(v,max){ while(v>max) v-=max; return v||max; }
function drawKam(){
  const w=$('#kin').value.trim(), pl=$('#kplanet').value; if(!KAM[pl])return;
  const {n,sq}=KAM[pl], max=n*n, S=380, cell=S/n, ox=10, oy=10;
  let h='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    h+=`<rect x="${ox+c*cell}" y="${oy+r*cell}" width="${cell}" height="${cell}" fill="var(--card)" stroke="var(--line)"/>`+
       `<text x="${ox+c*cell+cell/2}" y="${oy+r*cell+cell/2+4}" font-size="${Math.min(13,cell/2.4)}" text-anchor="middle" fill="var(--sub)">${sq[r][c]}</text>`;
  }
  const nums=[...w].filter(c=>VAL[c]).map(c=>reduce(VAL[c],max));
  const pts=nums.map(num=>{const rc=cellOf(sq,n,num);return rc?[ox+rc[1]*cell+cell/2,oy+rc[0]*cell+cell/2]:null;}).filter(Boolean);
  if(pts.length){
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    h+=`<path d="${d}" fill="none" stroke="var(--acc)" stroke-width="3"/>`;
    const s=pts[0];h+=`<circle cx="${s[0]}" cy="${s[1]}" r="7" fill="none" stroke="var(--acc)" stroke-width="3"/>`;
    if(pts.length>1){const e=pts[pts.length-1],p=pts[pts.length-2],dx=e[0]-p[0],dy=e[1]-p[1],L=Math.hypot(dx,dy)||1;
      h+=`<line x1="${e[0]+dy/L*8}" y1="${e[1]-dx/L*8}" x2="${e[0]-dy/L*8}" y2="${e[1]+dx/L*8}" stroke="var(--acc)" stroke-width="3"/>`;}
  }
  $('#kamsvg').innerHTML=h;
  $('#kamexp').innerHTML=DB.text('gem.kamea',{max})+' '+(nums.length?'Letters reduced to: '+nums.join(', '):'');
}

// other forms (hamza forms, ة, ى); ALET = [glyph, name, value] in the abjad order
const ABJAD={}, ALET=[];
const HARAKAT=/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g;
function abjadVal(w){ let s=0; for(const c of w.replace(HARAKAT,'')) s+=ABJAD[c]||0; return s; }
function buildAKbd(){
  $('#kbd4').innerHTML = ALET.map(([g,n,v])=>`<b onclick="ins('ain','${g}')">${g}<small>${n} ${v}</small></b>`).join('')
   + `<b onclick="ins('ain','')" style="min-width:44px">⌫<small>del</small></b>`;
}
function abjad(){
  const raw=$('#ain').value.trim();
  if(!raw){ $('#aout').innerHTML=''; return; }
  let v, ar='';
  if(/^\d+$/.test(raw)){ v=parseInt(raw); } else { ar=raw; v=abjadVal(raw); }
  let h=`<div class="card"><div class="row"><div class="val">${N(v)}</div>`;
  if(ar){ const clean=ar.replace(HARAKAT,'');
    h+=`<div><div class="heb" style="direction:rtl">${esc(ar)}</div><div class="hint" style="direction:rtl">`+
    [...clean].map(c=>`${c}=${N(ABJAD[c]||0)}`).join(' + ')+` = <b>${N(v)}</b></div></div>`; }
  h+='</div>';
  if(v>0&&v<=9999) h+=`<div class="kv" style="margin-top:6px"><b>Abjad numeral form</b> (classical letter-notation): <span class="heb" style="direction:rtl">${numAbjad(v)}</span> &nbsp;·&nbsp; Eastern digits: <b style="direction:rtl">${String(v).replace(/[0-9]/g,d=>EDIG[+d])}</b></div>`;
  const m=G.idx[v]||[];
  if(m.length){
    h+=`<div class="hint" style="margin-top:8px">${DB.text('gem.abjad-matches',{count:N(m.length),value:N(v)})}</div><table>`;
    for(const [w,t,label,k] of m)
      h+=`<tr><td class="heb big">${esc(w)}</td><td>${esc(t)||'<span class="hint">—</span>'}</td><td class="hint">Col ${label}, Key ${N(k)}</td></tr>`;
    h+='</table>';
  } else h+='<div class="hint" style="margin-top:6px">No Hebrew table entry has this exact value.</div>';
  h+=`<div class="exp">${DB.text('gem.abjad')}</div></div>`;
  $('#aout').innerHTML=h;
}

}


// ---- Seven Seals of Solomon (Shams al-Maʿārif) — a common rendition (tab Seals of Solomon). The drawings stay here,
// found by the seal's ID; SEALS = [name, 'day · planet', meaning, ID] in the table's order
function sealGlyph(id){
  const S='stroke="var(--ink)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"';
  switch(id){
    case 'pentagram': return `<path d="M35,13 L51.5,64 L8.4,33 L61.6,33 L18.5,64 Z" ${S}/>`;           // pentagram
    case 'staffs': return `<path d="M23,16 V74 M35,16 V74 M47,16 V74" ${S}/>`;                        // three strokes
    case 'ladder': return `<path d="M24,16 V74 M46,16 V74 M24,29 H46 M24,42 H46 M24,55 H46 M24,68 H46" ${S}/>`; // ladder
    case 'ring': return `<circle cx="35" cy="46" r="21" ${S}/><rect x="30" y="13" width="10" height="10" ${S}/>`; // ring
    case 'hook': return `<circle cx="29" cy="30" r="9" ${S}/><path d="M38,31 Q48,56 33,74" ${S}/>`;  // waw-hook
    case 'mim': return `<circle cx="25" cy="36" r="8" ${S}/><path d="M33,40 H60 M60,40 V52" ${S}/>`; // mim-tail
    case 'chain': return `<path d="M27,15 Q43,25 27,35 Q11,45 27,55 Q43,65 27,75" ${S}/>`;             // serpentine chain
  }
  return '';
}
const SEALS=[];
function drawSeals(){
  let h=''; const cw=520/SEALS.length;
  SEALS.forEach((s,i)=>{
    const x=i*cw+cw/2-35;
    h+=`<g transform="translate(${x},12)">${sealGlyph(s[3])}<text x="35" y="98" font-size="12" text-anchor="middle" fill="var(--acc)" font-weight="700">${i+1}</text></g>`;
  });
  $('#sealsvg').innerHTML=h;
  $('#sealinfo').innerHTML='<table>'+SEALS.map((s,i)=>`<tr><td class="n">${i+1} · ${esc(s[0])}</td><td class="hint" style="white-space:nowrap">${esc(s[1])}</td><td>${esc(s[2])}</td></tr>`).join('')+'</table>';
  $('#sealexp').innerHTML=DB.text('gem.seals');
}

buildKbd('kbd','gin'); buildKbd('kbd2','rin'); buildKbd('kbd3','kin');
$('#gin').addEventListener('input',gem); $('#gmode').addEventListener('change',gem);
$('#rin').addEventListener('input',drawRose); $('#kin').addEventListener('input',()=>{});
// picking a planet (or ticking the abjad letters) redraws its square at once; Trace redraws after a new word
$('#kplanet').addEventListener('change',drawKam); $('#wplanet').addEventListener('change',drawWafq); $('#wabj').addEventListener('change',drawWafq);
drawRose();
DB.load('kameas','arabic_letters','seals_islamic').then(()=>{
  for(const k of DB.rows('kameas')){
    const p=DB.get('planets',k.id), name=p.name_777||p.name;
    KAM[name]={n:k.size,sq:DB.items(k.square).map(r=>r.trim().split(/\s+/).map(Number)),row:k};
    WPLANETS.push([name,(k.wafq_name?`${k.wafq_name} (${k.wafq_name_arabic}) · `:'')+`${p.name} ${k.size}×${k.size}`]);
  }
  for(const a of DB.rows('arabic_letters')){ ALET.push([a.glyph,a.name,a.value]); for(const c of [a.glyph,...DB.items(a.forms)])ABJAD[c]=a.value; }
  for(const s of DB.rows('seals_islamic')){ const w=DB.ref(s,'weekday'); SEALS.push([s.name,w.name+' · '+DB.ref(w,'planet').name,s.meaning||'',s.id]); }
  $('#kplanet').innerHTML=Object.keys(KAM).map(p=>`<option>${p}</option>`).join('');
  fillWPlanets(); buildWKbd(); drawSeals(); buildAKbd();
  $('#ain').addEventListener('input',abjad);
  drawKam();
}).catch(e=>{ document.querySelector('main').insertAdjacentHTML('afterbegin','<div class="card">The tables could not be loaded: '+esc(e&&e.message||e)+'</div>'); });
</script></body></html>
