// Today's review: every due card + up to the daily number of new cards (decks taken in turn, a fact at a time). The turn starts at
// a different deck each day, so every daily deck gets new cards even when the daily number is smaller than the number of decks
function reviewPlan(){
  const t=today(),decks=ST.set.daily,due=[],byDeck={};
  CARDS.forEach(c=>{if(!decks.includes(c.deck))return;const s=ST.cards[c.id];
    if(s){if(s.d<=t)due.push(c);}else(byDeck[c.deck]=byDeck[c.deck]||[]).push(c);});
  Object.values(byDeck).forEach(a=>a.sort((x,y)=>(x.dir==='r')-(y.dir==='r')||x.ii-y.ii||x.ri-y.ri));
  const order=DECKS.map(d=>d.id).filter(id=>byDeck[id]),neu=[],n=newLeft();let i=order.length?((t%order.length)+order.length)%order.length:0;
  while(neu.length<n&&order.some(id=>byDeck[id].length)){const id=order[i++%order.length];if(byDeck[id].length)neu.push(byDeck[id].shift());}
  due.sort((a,b)=>ST.cards[a.id].b-ST.cards[b.id].b||ST.cards[a.id].d-ST.cards[b.id].d||Math.random()-.5);
  return{due,neu};
}

/* ---------- building questions ---------- */
const ansOf=c=>c.dir==='f'?c.it.v:c.it.s;
const canType=c=>ansOf(c).typ!==false;
const numClose=(a,b)=>2/(1+3*Math.abs(Math.log((a+1)/(b+1))));
// Smart distractors: same relation, same category first (signs with signs, Sephiroth with Sephiroth…), never a duplicate
function distractors(card,n){
  const fwd=card.dir==='f',it=card.it,r=card.rel,ans=ansOf(card),other=fwd?it.s:it.v;   // other: the side shown in the prompt
  const ansItems=r.list?new Set(listItems(fwd?ans.t:other.t).map(norm)):null;
  const overlaps=t=>ansItems&&listItems(t).some(x=>ansItems.has(norm(x)));
  let pool=r.items.filter(o=>o!==it).map(o=>{
    const sd=fwd?o.v:o.s,oth=fwd?o.s:o.v;let sc=Math.random();
    if(sd.cat===ans.cat)sc+=2;
    if(oth.cat===other.cat)sc+=1;
    if(r.sim)sc+=r.sim(it,o,fwd);
    if(ans.num&&sd.num)sc+=numClose(+ans.t,+sd.t);
    if(other.num&&oth.num)sc+=numClose(+other.t,+oth.t);
    return{sd,oth,sc,o};
  });
  // a candidate sharing a part with the answer ("Earl" for "Earl / President") would be partly right
  const shares=(a,b)=>a.parts&&b.parts&&a.parts.some(p=>b.parts.includes(p));
  if(fwd)pool=pool.filter(x=>!overlaps(x.sd.t)&&!shares(ans,x.sd));
  else pool=pool.filter(x=>ckey(x.oth)!==ckey(other)&&!overlaps(x.oth.t)&&!shares(other,x.oth));   // would also be a right answer
  if(r.near)pool=pool.filter(x=>!(x.o&&r.near(it,x.o,fwd)));   // nearly the same fact (two almost identical descriptions)
  // avoid: values the sources give instead of the answer (Belial's legions: 80 printed, 30 or 50 in the notes; the Shem angels
  // another table files under the same decan): numbers, or canonical keys
  if(fwd&&ans.avoid&&ans.avoid.length)pool=pool.filter(x=>!ans.avoid.some(a=>typeof a==='number'?a===+x.sd.t:a===ckey(x.sd)));
  // a trump whose title names its own value ("The Priestess of the Silver Star", "Sol" of XIX The Sun) is ruled out at sight
  if(fwd)pool=pool.filter(x=>!(x.o&&x.o.leak));
  // made-up options: numbers near the answer, or {sd, sc} sides (Earth among the elements)
  if(r.synth&&fwd)r.synth(it).forEach(x=>pool.push(x&&x.sd?{sd:x.sd,sc:x.sc}:{sd:side(String(x),{num:true,cat:'num'}),sc:3.4+Math.random()}));
  pool.sort((a,b)=>b.sc-a.sc);
  const seen=new Set([ckey(ans)]),out=[],picked=[];
  for(const x of pool){const k=ckey(x.sd);if(seen.has(k))continue;
    if(r.near&&x.o&&picked.some(o=>r.near(o,x.o,fwd)))continue;   // nor two near-twins side by side
    seen.add(k);out.push(x.sd);if(x.o)picked.push(x.o);if(out.length>=n)break;}
  return out;
}
function makeCardQ(card,type){
  card=pathCard(card);   // a learning path's stage may refine how its quiz asks this card (stage.refine, see pathCard)
  if(type==='typed'&&!canType(card))type='mc';
  const r=card.rel,ans=ansOf(card);
  const isNew=!ST.cards[card.id];
  if(r.pre)r.pre(card.it);   // per-question choices (which of a spirit's two seals is shown)
  // Learn sessions: prompts without the hints that answer the subject's other questions (a path's sign and Sephiroth; a small
  // card's decan in "who rules it by day?")
  const learn=inLearn();
  let prompt;BARE=learn;
  try{prompt=card.dir==='f'?r.fq(card.it):r.rq(card.it);}finally{BARE=false;}
  const q={kind:'card',type,card,ans,row:card.row,isNew,unsched:isNew&&!learn&&!newLeft(),prompt,
    tag:deckName(card.deck)+' · '+(type==='typed'?'Typed recall':'Multiple choice')};
  if(card.dir==='r'&&r.rs)q.pSum=r.rs(card.it);   // the same question for the list of mistakes (a seal shown whole)
  if(type==='mc'){
    q.opts=shuffle([ans,...distractors(card,3)]);q.ansIdx=q.opts.indexOf(ans);
    // the value names the answer row's own planet ("Mercury" → Path 12 (Mercury)), or a trump's title names the value
    // ("Sol" → XIX The Sun): show the options without the hints / titles
    if(card.dir==='r'&&(card.it.leak||hintLeaks(card.row,card.it.v.t)))q.opts=q.opts.map(o=>o.h0?Object.assign({},o,{h:o.h0}):o);
    // hb: the option without what another question of a Learn session asks (the Sephiroth a path joins)
    if(learn)q.opts=q.opts.map(o=>o.hb?Object.assign({},o,{h:o.hb}):o);
    // image options (seals) sit in a 2 × 2 grid, cropped and labelled "seal option A…D"; a spirit with two seals shows one of them.
    // hd: the same seal whole, captioned with its spirit, shown once the question is answered (in Learn by name only: a spirit's
    // number could be the answer of another question there, e.g. the legions)
    if(q.opts.some(o=>o.img)){q.grid=true;q.opts=q.opts.map((o,i)=>{if(!o.figs)return o;const f=pick(o.figs),L='ABCDEFGH'[i],who=o.sp?(learn?o.sp.name:`${o.sp.n} ${o.sp.name}`):'';
      return Object.assign({},o,{h:sealImg(f,{cls:'os',rim:false,label:'seal option '+L}),
        hd:sealImg(f,{cls:'os',label:who?'seal of '+who:'seal'})+(who?`<small class="cap">${esc(who)}</small>`:'')});});}
  }
  return q;
}
const LEARN_MODES=new Set(['learn','learncard','learnspirit','path','digplanet']);   // path: a learning path's stage quiz
const inLearn=()=>!!(SES&&LEARN_MODES.has(SES.mode));
// The answers of the other items in the card's relation (same side as the card asks for), minus anything that is also
// this card's answer. Typing one of them names a different fact, so it must not pass as a near miss.
function siblings(card){
  if(card.sib)return card.sib;
  const r=card.rel,fwd=card.dir==='f',ans=ansOf(card),own=new Set([ans.t,...(ans.alt||[])].map(norm));
  if(r.list&&fwd)listItems(ans.t).forEach(x=>own.add(norm(x)));
  const out=[],by={};
  r.items.forEach(o=>{
    if(o===card.it)return;
    const sd=fwd?o.v:o.s,oth=fwd?o.s:o.v;
    if(ckey(sd)===ckey(ans))return;   // the same answer (e.g. two rows sharing a value)
    const ts=[sd.t,...(sd.alt||[])];if(r.list&&fwd)ts.push(...listItems(sd.t));
    ts.forEach(t=>{const n=norm(t);if(!n||own.has(n))return;out.push({t,n,oth});(by[n]=by[n]||new Set()).add(o);});
  });
  out.forEach(x=>x.only=by[x.n].size===1);   // it belongs to one item only, so feedback can name it
  return card.sib=out;
}
// Typed answers: exact for numbers and numerals; names forgive case, accents and 1-2 letters
function checkTyped(q,input){
  const card=q.card,ans=q.ans,raw=String(input||'').trim();
  if(!raw)return{ok:false};
  if(ans.num){const m=raw.replace(/\s/g,'').match(/\d+/);return{ok:!!m&&+m[0]===+ans.t,exact:true};}
  if(ans.match&&ans.match(raw))return{ok:true,matched:ans.t};
  const targets=[ans.t,...(ans.alt||[])];
  if(card.rel.list&&card.dir==='f')targets.push(...listItems(ans.t));
  const a=norm(raw);
  for(const t of targets){const b=norm(t);if(b&&a===b)return{ok:true,exact:t===ans.t,matched:t};}
  const sib=siblings(card),same=sib.find(x=>x.n===a);
  if(same)return{ok:false,sib:same};
  let best=null;
  for(const t of targets){if(!norm(t))continue;const r=tdist(raw,t);if(r.d<=r.tol&&(!best||r.d<best.d))best={d:r.d,t};}
  if(!best)return{ok:false};
  // a near miss that is at least as close to another item's answer is that other answer, not a typo
  const rival=sib.find(x=>tdist(raw,x.t).d<=best.d);
  if(rival)return{ok:false,sib:rival};
  return{ok:true,matched:best.t,dist:best.d};
}
function chooseType(card,types){
  const ct=types.filter(t=>t==='mc'||t==='typed');
  if(!ct.includes('typed')||!canType(card))return 'mc';
  if(!ct.includes('mc'))return 'typed';
  const s=ST.cards[card.id];   // new cards start with recognition; learned ones are recalled
  return s&&s.b>=2&&Math.random()<.5?'typed':'mc';
}

/* --- special questions: matching, ordering, odd one out --- */
// (nomatch: seals — the rim of each one spells its spirit's name)
const matchRels=decks=>RELS.filter(r=>decks.includes(r.deck)&&r.dirs.includes('f')&&!r.nomatch&&r.matchN>=5);
const oddRels=decks=>RELS.filter(r=>r.odd&&decks.includes(r.deck));
const orderOK=decks=>decks.includes('tree')||decks.includes('hebrew');
// odd one out needs a row with 3 columns of distinct values, plus a 4th column for the odd item
// (Colours alone has only the King and Queen scales per row, so it can never make one)
const ODDOK={};
function oddRowOK(rels,row){const v=new Set();rels.forEach(r=>{const it=r.byRow[row];if(it)v.add(norm(it.v.t));});return v.size>=3&&rels.length>=4;}
function oddOK(decks){
  const k=decks.slice().sort().join();
  if(!(k in ODDOK)){const rels=oddRels(decks);ODDOK[k]=rels.length>=4&&ROWKEYS.some(row=>oddRowOK(rels,row));}
  return ODDOK[k];
}
// what a matching value stands for: its parts (ranks), list items (777 list cells) or itself
function valParts(r,sd){
  if(sd.parts)return sd.parts.map(norm);
  return r.list?[ckey(sd),...listItems(sd.t).map(norm)]:[ckey(sd)];
}
// five pairs with distinct subjects and no shared value parts, so every right-hand item fits exactly one left-hand item.
// Nor two items the relation calls near (r.near: never offered against each other), e.g. the Dragon's Tail's temperament "Like Saturn"
// beside Saturn's "Cold, dry", which would fit the Tail as well
function pickMatch(r){
  for(let t=0;t<12;t++){
    const out=[],ss=new Set(),vp=new Set();
    for(const it of shuffle(r.matchPool.slice())){
      const sk=ckey(it.s),ps=valParts(r,it.v);
      if(ss.has(sk)||ps.some(p=>vp.has(p))||(r.near&&out.some(o=>r.near(o,it)||r.near(it,o))))continue;
      out.push(it);ss.add(sk);ps.forEach(p=>vp.add(p));
      if(out.length===5)return out;
    }
  }
  return null;
}
// left-hand labels of a matching exercise: without the trumps' titles when one of them would name its partner (XIX The Sun ↔ Sol)
const matchL=(q,it)=>q.bare&&it.s.h0?it.s.h0:it.s.h;
function makeMatch(decks){
  for(const r of shuffle(matchRels(decks))){
    const items=pickMatch(r);if(!items)continue;
    return{kind:'match',rel:r,items,bare:items.some(it=>it.leak),right:shuffle(items.map((_,i)=>i)),matched:new Set(),errors:{},selL:null,selR:null,bad:null,
      tag:deckName(r.deck)+' · Matching',prompt:`Match the pairs — <b>${esc(r.name)}</b>`};
  }
  return null;
}
function makeOrder(decks){
  const v=[];if(decks.includes('tree'))v.push('seph');if(decks.includes('hebrew'))v.push('alpha');if(!v.length)return null;
  let items,prompt,tag;
  if(pick(v)==='seph'){items=SEPH.map(s=>({key:s.key,rank:s.n,h:esc(s.name),id:`tree.num|${s.key}|f`}));
    prompt='Tap the Sephiroth in order, from the first to the tenth.';tag='Tree structure · Ordering';}
  else{const st=rnd(LET.length-5);items=LET.slice(st,st+6).map(p=>({key:p.key,rank:p.idx,h:`${he(p.glyph,'hg')} <span class="sub">${esc(p.name)}</span>`,id:`heb.path|${p.key}|f`}));
    prompt=`Put these six letters in alphabetical order (${he('א')} → ${he('ת')}).`;tag='Hebrew alphabet · Ordering';}
  let pool=shuffle(items.slice());
  while(pool.every((x,i)=>i===0||pool[i-1].rank<x.rank))pool=shuffle(items.slice());
  return{kind:'order',items,pool,placed:[],prompt,tag};
}
function makeOdd(decks,row){
  const rels=oddRels(decks);if(!rels.length)return null;
  for(let t=0;t<60;t++){
    const r0=row||pick(ROWKEYS),here=shuffle(rels.filter(r=>r.byRow[r0]));
    const three=[],tx=new Set();
    here.forEach(r=>{const it=r.byRow[r0],k=norm(it.v.t);if(three.length<3&&!tx.has(k)){tx.add(k);three.push({r,it});}});
    if(three.length<3)continue;
    // everything the row itself has in these columns, item by item, so the odd one cannot also fit
    const own=new Set(here.flatMap(r=>[r.byRow[r0].v.t,...listItems(r.byRow[r0].v.t)].map(norm)));
    const fits=t=>[t,...listItems(t)].some(x=>own.has(norm(x)));
    // the odd item comes from a column none of the three uses, so no two options share a column label
    const kind=ROW[r0].kind,cand=[];
    rels.filter(r=>!three.some(x=>x.r===r)).forEach(r=>r.items.forEach(it=>{if(it.row!==r0&&ROW[it.row]&&ROW[it.row].kind===kind&&!fits(it.v.t))cand.push({r,it});}));
    if(!cand.length)continue;
    const odd=pick(cand),opts=shuffle([...three,odd]);
    return{kind:'odd',row:r0,odd,three,opts:opts.map(x=>({h:`${x.it.v.h}<small>${esc(x.r.short||x.r.name)}</small>`})),ansIdx:opts.indexOf(odd),
      tag:'Odd one out',prompt:`Three of these belong to the same ${kind==='seph'?'Sephirah':'path'}. Which is the odd one out?`};
  }
  return null;
}

/* ---------- sessions ---------- */
let SES=null,Q=null,SCREEN='home',TICK=null;
function clearTick(){if(TICK){clearInterval(TICK);TICK=null;}}
function newSession(mode,queue,extra){
  clearTick();
  SES=Object.assign({mode,queue,i:0,answered:0,correct:0,streak:0,best:0,start:Date.now(),mistakes:[],missed:new Set(),requeues:{},
    grades:{again:0,good:0,easy:0}},extra||{});
  if(mode==='flash')renderFlash();else nextQ();
}
// sprinkle bonus matching / odd-one-out / ordering questions through a card queue
function sprinkle(queue,types,decks,every){
  const sp=[];
  if(types.includes('match')&&matchRels(decks).length)sp.push('match');
  if(types.includes('odd')&&oddOK(decks))sp.push('odd');
  if(types.includes('order')&&orderOK(decks))sp.push('order');
  if(!sp.length)return queue;
  const out=[];let j=rnd(sp.length);
  queue.forEach((q,i)=>{out.push(q);if((i+1)%every===0&&i<queue.length-1)out.push({k:sp[j++%sp.length],decks});});
  return out;
}
function startReview(){
  const p=reviewPlan(),types=ST.set.types,t=[];
  // interleave: two due cards, then one new
  const due=p.due.slice(),neu=p.neu.slice();
  while(due.length||neu.length){if(due.length)t.push(due.shift());if(due.length)t.push(due.shift());if(neu.length)t.push(neu.shift());}
  if(!t.length)return renderHome();
  const q=t.map(c=>({k:'card',id:c.id,type:chooseType(c,types)}));
  newSession('review',sprinkle(q,types,ST.set.daily,6));
}
function wpick(list,w){const tot=list.reduce((a,x)=>a+(w[x]||1),0);let r=Math.random()*tot;for(const x of list){r-=w[x]||1;if(r<=0)return x;}return list[list.length-1];}
function practiceQueue(decks,types,len){
  const t=today(),pool=CARDS.filter(c=>decks.includes(c.deck));
  if(!pool.length)return[];
  // weighted shuffle: weak and due cards come up more often, and unseen ones while today's new-card allowance lasts
  const nw=newLeft()?3:1,w=c=>{const s=ST.cards[c.id];return s?(6-s.b)+(s.d<=t?2:0):nw;};
  const order=pool.map(c=>({c,k:Math.pow(Math.random(),1/w(c))})).sort((a,b)=>b.k-a.k).map(x=>x.c);
  const feas=types.filter(ty=>ty==='mc'||ty==='typed'||(ty==='match'&&matchRels(decks).length)||(ty==='odd'&&oddOK(decks))||(ty==='order'&&orderOK(decks)));
  if(!feas.length)feas.push('mc');
  const q=[];let ci=0;
  for(let i=0;i<len;i++){
    let ty=wpick(feas,{mc:4,typed:3,match:1,odd:1,order:.6});
    if(ty==='mc'||ty==='typed'){
      const idx=ci%order.length;let c=order[idx];
      if(ty==='typed'&&!canType(c)){   // swap in the next card that can be typed
        const k=order.findIndex((x,j)=>j>idx&&canType(x));
        if(k>0){order[idx]=order[k];order[k]=c;c=order[idx];}
      }
      ci++;q.push({k:'card',id:c.id,type:ty==='typed'&&canType(c)?'typed':'mc'});
    }else q.push({k:ty,decks});
  }
  return q;
}
const NO_CARDS='No cards in the selected decks. Pick at least one deck.';
function startPractice(){

  newSession('practice',q,{decks:P.decks.slice()});

function startSpeed(){

  newSession('speed',[],{pool,end:Date.now()+60000});

    if(left<=0)finish();},100);

// Learn mode quizzes a single row, so any question whose answer is that row — or names it (its name,
// Hebrew, letter or number) — would answer itself. Only ask for the row's correspondences.
function revealsRow(c,key){
  const r=ROW[key];if(!r)return false;
  if(c.dir!=='f')return true;                       // reverse cards: "which Sephirah/path has …?" → this row
  const a=ansOf(c);
  const ids=[r.name,r.glyph,key,'Path '+key,r.kind==='seph'?SEPH_HEB[r.n]:'',r.kind==='seph'?String(r.n):'']
    .filter(Boolean).map(norm).filter(Boolean);
  const texts=[a.t,...(a.alt||[])].map(t=>String(t||''));
  return texts.some(t=>{const n=norm(t),ws=words(t).map(norm);return ids.some(id=>n===id||ws.includes(id));});
}
// A card's answer as keys (its text, accepted spellings and, in a 777 list, each item), and what its prompt shows besides the row
// itself (Learn prompts carry no hints, see BARE): the Atu in "attribution of Atu 0 The Fool?", the God-name in "gematria of אהיה Eheieh"
function ansKeys(c){const a=ansOf(c);return uniq([a.t,...(a.alt||[]),...(c.rel.list?listItems(a.t):[])].map(norm).filter(Boolean));}
function shownKeys(c){
  if(c.rel.id==='tr.attr')return uniq([c.it.s.t,...(c.it.s.alt||[])].map(norm).filter(Boolean));
  if(c.rel.id==='gm.word'&&c.it.w)return [norm(c.it.w.t)].filter(Boolean);
  return [];

// The questions for one row: one per fact (Letter → Atu and Path → Atu, or Aleph → 1 and א → 1, ask the same thing), and none whose
// prompt shows another one's answer. Cards are taken in random order, so each session keeps a different one of a clashing pair.
function learnRowPool(key){
  const kept=[],x=(p,q)=>p.some(k=>q.includes(k));
  shuffle((ROWCARDS[key]||[]).filter(c=>!revealsRow(c,key))).forEach(c=>{const A=ansKeys(c),S=shownKeys(c);
    if(!kept.some(k=>x(A,k.A)||x(A,k.S)||x(S,k.A)))kept.push({c,A,S});});

function startLearn(key){
  const cs=learnRowPool(key);

  const seen=new Set(),first=[],rest=[];
  cs.forEach(c=>{if(seen.has(c.rel.id))rest.push(c);else{first.push(c);seen.add(c.rel.id);}});
  const q=first.concat(rest).slice(0,12).map(c=>({k:'card',id:c.id,type:chooseType(c,['mc','typed'])}));
  const all=DECKS.map(d=>d.id);

// Learn a card: the same rule for a Tarot card. Only questions asked from the card's side count ("the 2 of Wands → which decan?",
// "Atu XIV → which letter?", "Aries I by day → which spirit?" (asked there as "the 2 of Wands by day"), and never one whose answer
// names the card: its number or number word with the suit, its title (Dominion, Lord of Dominion, Root of the Powers of Fire), its
// Atu numeral or trump title.
const tcForward=c=>(c.dir==='f')===(c.it.tcSide!=='v');
function revealsCard(c,key){
  const T=TC[key];if(!T)return false;
  if(c.it.tc!==key||!tcForward(c))return true;
  const a=ansOf(c);
  return namesAny([a.t,...(a.alt||[])].map(t=>String(t||'')),T.ids);
}
// The questions for one card, one per answer: should two decks ask the same thing, the one with the learner's older progress is kept
// (each fact now lives in one deck: the trump's letter, path and attribution in Paths & Thoth trumps, a decan's spirits in Goetia)
function learnCardPool(key){
  const T=TC[key];if(!T)return[];
  const pr=c=>c.deck==='trumps'?0:c.deck==='tarot'?1:2;   // Trumps first (older progress, its prompts name the Atu), Goetia last
  const cs=(TCARDS[key]||[]).filter(c=>!revealsCard(c,key)).sort((a,b)=>pr(a)-pr(b));
  const seen=new Set(),out=[];
  cs.forEach(c=>{const a=ansOf(c),ks=[a.t,...(a.alt||[])].map(norm).filter(Boolean);
    if(ks.some(k=>seen.has(k)))return;ks.forEach(k=>seen.add(k));out.push(c);});
  // a trump's Liber 777 title that names its attribution ("The Spirit of the Primal Fire", "… the Mighty Waters", "the Ruler of the
  // Balance") would answer "what is the attribution of Atu …?": the attribution is kept, the title left out
  if(T.kind==='major'&&out.some(c=>c.rel.id==='tr.attr')&&hintLeaks(atuPath(T.n),title777(T.n)))return out.filter(c=>c.rel.id!=='ta.atu.t777');

}
function startLearnCard(key){

  newSession('learncard',q,{card:key});
}
// Learn a spirit: the same rule for a Goetic spirit. Only questions asked from the spirit's side count ("Paimon → which rank?",
// "Paimon → which of these seals?"), never one whose answer is the spirit or names it: its name, variant spellings or number.
// So "whose seal is this?", "which spirit is number 9?" and "what is Paimon's number?" are left out.
function revealsSpirit(c,n){
  const sp=spiritByN(n);if(!sp)return false;
  if(c.row!=='g'+n||c.dir!=='f')return true;   // reverse cards: "which spirit …?" → this spirit
  if(c.rel.id==='go.num')return true;           // its number is one of its names
  const a=ansOf(c);   // "which seal is his?" passes: its options are seals cropped to the inner ring, so no rim spells the name
  const texts=[a.t,...(a.alt||[])].map(t=>String(t||''));
  return namesAny(texts,spIds(sp))||texts.some(t=>norm(t)===String(n)||new RegExp('(^|[^a-z])(no\\.?|number|#)\\s*'+n+'(?!\\d)','i').test(t));
}
// The spirit's own questions, one per relation, then the planet and metal of its rank(s) (asked about the rank). One per answer:
// a President's planet (Mercury) and metal ("Mercury (quicksilver)") answer each other, so only the planet is asked
function learnSpiritPool(n){
  const sp=spiritByN(n);if(!sp)return[];
  const own=(ROWCARDS['g'+n]||[]).filter(c=>!revealsSpirit(c,n));
  const rk=spRanks(sp).flatMap(r=>(ROWCARDS['k'+r]||[]).filter(c=>c.dir==='f'));
  const seen=new Set(),out=[];
  own.concat(rk).forEach(c=>{const a=ansOf(c),ks=[...ansKeys(c),...(a.parts||[]).map(norm)].filter(Boolean);
    if(c.row!=='g'+n&&ks.some(k=>seen.has(k)))return;ks.forEach(k=>seen.add(k));out.push(c);});
  return out;
}
// A question of the spirit's own whose answer (or its note) names the spirit's rank — Murmur "with a ducal crown", Beleth "as a
// great King", Orobas's "prelacies": it would answer "What rank is …?", so it is asked after that question (startLearnSpirit, requeue)
function namesOwnRank(c){
  const r=String(c&&c.row||''),sp=r[0]==='g'&&spiritByN(+r.slice(1));

function startLearnSpirit(n){

const mistakeQueue=ids=>shuffle(ids.filter(id=>CARD[id])).map(id=>({k:'card',id,type:chooseType(CARD[id],['mc','typed'])}));

function startFlash(){

function buildQ(it){
  if(it.k==='card'){const c=CARD[it.id];return c?makeCardQ(c,it.type):null;}
  if(it.k==='match')return makeMatch(it.decks);
  if(it.k==='order')return makeOrder(it.decks);
  if(it.k==='odd')return makeOdd(it.decks,it.row);
  return null;
}
function nextQ(){
  if(!SES)return goHome();
  if(SES.mode==='speed'){if(Date.now()>=SES.end)return finish();Q=makeCardQ(pick(SES.pool),'mc');return renderQ();}
  while(SES.i<SES.queue.length){const it=SES.queue[SES.i++];Q=buildQ(it)||fallbackQ(it);if(Q)return renderQ();}
  finish();
}
// A matching / ordering / odd-one-out slot that cannot be built becomes a multiple-choice card from the same decks
// (or the same row), preferring cards the learner already knows, so the session keeps its length
function fallbackQ(it){
  if(it.k==='card')return null;
  // in Learn a row, one of the session's own cards (never one answered by the row, nor one clashing with the others)
  const pool=it.row?(SES&&SES.mode==='learn'?uniq(SES.queue.filter(x=>x.k==='card').map(x=>x.id)).map(id=>CARD[id]).filter(Boolean)
    :(ROWCARDS[it.row]||[])):CARDS.filter(c=>(it.decks||[]).includes(c.deck));
  if(!pool.length)return null;
  const known=pool.filter(c=>ST.cards[c.id]);

// Puts a missed card back three questions later (s.i already points past it). In a Learn session nothing that shows its answer may
// come before it: the questions in between that would are moved to just after it (a Goetic rank's planet or metal names the rank
// "What rank is Bael?" asks for, and so does Murmur's "ducal crown", see namesOwnRank; the odd one out of a row lists the row's values)
function requeue(s,card){
  const at=Math.min(s.i+2,s.queue.length),item={k:'card',id:card.id,type:'mc'};
  const shows=x=>s.mode==='learn'?x.k==='odd'
    :s.mode==='learnspirit'&&card.rel.id==='go.rank'?x.k==='card'&&CARD[x.id]&&(String(CARD[x.id].row||'')[0]==='k'||namesOwnRank(CARD[x.id])):false;
  const mid=s.queue.slice(s.i,at);
  s.queue.splice(s.i,mid.length,...mid.filter(x=>!shows(x)),item,...mid.filter(shows));

// Book-keeping after any answer
function settle(ok,given){
  const s=SES,q=Q;
  q.done=true;q.ok=ok;q.given=given;
  s.answered++;
  if(ok){s.correct++;s.streak++;s.best=Math.max(s.best,s.streak);}else s.streak=0;
  ST.stats.bestStreak=Math.max(ST.stats.bestStreak,s.best);
  record(ok);
  if(q.kind==='card'){
    const id=q.card.id;
    if(s.first&&!(id in s.first))s.first[id]=ok;   // a learning path's stage is scored on first answers (pathScore)
    if(s.mode!=='speed'){
      grade(id,ok,{lapsed:s.missed.has(id),free:inLearn()});
      if(!ok){const n=s.requeues[id]||0;   // a miss comes back three questions later
        if(n<3){s.requeues[id]=n+1;requeue(s,q.card);}}
    }
    if(!ok){s.missed.add(id);s.mistakes.push({p:q.pSum||q.prompt,a:q.ans.hf||q.ans.h,g:given,id});}
  }else{
    // special questions only ever demote cards the learner already has
    (q.misses||[]).forEach(id=>{if(ST.cards[id]&&CARD[id]&&s.mode!=='speed'){grade(id,false);s.missed.add(id);}});
    const p=q.kind==='odd'?`${q.prompt}<br><span class="sub">The three belong to ${esc(rowLabel(q.row))}.</span>`:q.prompt;
    if(!ok)s.mistakes.push({p,a:q.answerHtml||'',g:given,ids:q.misses&&q.misses.length?q.misses:(q.related||[])});
  }

  if(s.mode==='speed'){renderQ();const me=s;setTimeout(()=>{if(SES===me&&SCREEN==='q')nextQ();},ok?350:900);return;}
  renderQ();
}
function answerMC(i){
  const q=Q;if(!q||q.done||!q.opts||i<0||i>=q.opts.length)return;
  q.pick=i;
  if(q.kind==='odd'){
    const o=q.odd;
    q.answerHtml=`${o.it.v.h} — ${esc(o.r.short||o.r.name)} of <b>${esc(rowLabel(o.it.row))}</b>`;
    q.explain=`<div class="line">The other three belong to <b>${esc(rowLabel(q.row))}</b>; ${o.it.v.h} is the ${esc((o.r.short||o.r.name).toLowerCase())} of <b>${esc(rowLabel(o.it.row))}</b>.</div>`;
    q.related=[o,...q.three].map(x=>cardIdF(x.r,x.it));   // offered again by "Review mistakes"

function answerTyped(skip){
  const q=Q;if(!q||q.done)return;
  const inp=$('#ans'),v=skip?'':(inp?inp.value:'');
  if(!skip&&!v.trim()){if(inp)inp.focus();return;}
  q.typed=v;q.res=skip?{ok:false}:checkTyped(q,v);
  settle(q.res.ok,skip?'(skipped)':esc(v));

function matchTap(sd,i){
  const q=Q;if(!q||q.kind!=='match'||q.done||q.bad||q.matched.has(i))return;
  if(sd==='L')q.selL=q.selL===i?null:i;else q.selR=q.selR===i?null:i;
  if(q.selL!=null&&q.selR!=null){
    if(q.selL===q.selR)q.matched.add(q.selL);
    else{q.errors[q.selL]=(q.errors[q.selL]||0)+1;q.bad=[q.selL,q.selR];
      // the session may have ended (End tapped) or moved on during the pause: then leave the screen alone
      setTimeout(()=>{if(Q===q&&SES&&SCREEN==='q'){q.bad=null;renderQ();}},650);}
    q.selL=q.selR=null;
    if(q.matched.size===q.items.length){
      const wrong=Object.keys(q.errors).map(Number);
      q.misses=wrong.map(k=>cardIdF(q.rel,q.items[k]));
      q.answerHtml=q.items.map((it,i)=>`${wrong.includes(i)?'<span class="mx">✗</span> ':''}${matchL(q,it)} → ${it.v.h}`).join('<br>');

    }

function orderTap(from,i){
  const q=Q;if(!q||q.kind!=='order'||q.done)return;
  if(from==='pool')q.placed.push(q.pool.splice(i,1)[0]);else q.pool.push(q.placed.splice(i,1)[0]);
  renderQ();

// Marks the longest run of items already in the right relative order (longest increasing subsequence of ranks):
// one item placed too early then counts as one mistake, not as every item after it
function orderMarks(ranks){
  const n=ranks.length,len=Array(n).fill(1),prev=Array(n).fill(-1),marks=Array(n).fill(false);
  if(!n)return marks;
  for(let i=0;i<n;i++)for(let j=0;j<i;j++)if(ranks[j]<ranks[i]&&len[j]+1>len[i]){len[i]=len[j]+1;prev[i]=j;}
  let e=0;for(let i=1;i<n;i++)if(len[i]>len[e])e=i;
  for(let i=e;i>=0;i=prev[i])marks[i]=true;
  return marks;
}
function checkOrder(){
  const q=Q;if(!q||q.kind!=='order'||q.done||q.pool.length)return;
  const right=q.items.slice().sort((a,b)=>a.rank-b.rank);
  q.marks=orderMarks(q.placed.map(x=>x.rank));
  q.misses=q.placed.filter((x,i)=>!q.marks[i]).map(x=>x.id);
  q.answerHtml=right.map(x=>x.h).join(' · ');
  settle(q.marks.every(Boolean),q.placed.map(x=>x.h).join(' · '));
}

/* ---------- rendering: questions & feedback ---------- */
function showHomeBtn(on){$('#homeBtn').classList.toggle('hidden',!on);}
const MODE_LABEL={review:"Today's review",practice:'Practice',speed:'Speed round',learn:'Learn',learncard:'Learn',learnspirit:'Learn',path:'Learn',digplanet:'Learn',mistakes:'Mistakes',flash:'Flashcards'};
const spiritLabel=n=>{const sp=spiritByN(n);return sp?`${sp.n} ${spPrim(sp.name)}`:'';};

function renderQ(){

  SCREEN='q';showHomeBtn(true);
  const speed=s.mode==='speed',total=s.queue.length;
  let h=topBar(s,speed?`score <b>${s.correct}</b>`:`${s.i} / ${total}`);
  h+=speed?`<div class="timer"><i id="tbar" style="width:${Math.max(0,(s.end-Date.now())/600)}%"></i></div>`
          :`<div class="bar"><i style="width:${pct(s.i-(q.done?0:1),total)}%"></i></div>`;
  h+=`<div class="card"><div class="tag">${esc(q.tag)}${q.isNew&&!speed?' · new'+(q.unsched?' · not scheduled (daily limit reached)':''):''}</div><div class="prompt">${q.prompt}</div>${bodyHtml(q)}${q.done&&!speed?feedbackHtml(q):''}</div>`;
  if(!q.done&&!speed&&q.opts)h+=`<div class="kh">Keys 1–${q.opts.length} choose · Enter = next</div>`;
  $('#app').innerHTML=h;
  if(fresh)window.scrollTo(0,0);
  if(!q.done&&q.type==='typed'){const i=$('#ans');if(i){try{i.focus({preventScroll:true});}catch(e){i.focus();}}}
  // after an answer, bring the feedback and its Next button into view (keeping the feedback's first line on screen)
  if(q.done&&!speed){const fb=$('.fb'),nx=$('.fb+.btns');
    if(fb&&nx){const ft=fb.getBoundingClientRect().top,over=nx.getBoundingClientRect().bottom+12-window.innerHeight;
      if(over>0)window.scrollBy({top:Math.min(over,Math.max(0,ft-8)),behavior:'smooth'});}}
}
function bodyHtml(q){
  if(q.kind==='match')return matchHtml(q);
  if(q.kind==='order')return orderHtml(q);
  if(q.type==='typed'){
    const num=q.ans.num,list=q.card.rel.list&&q.card.dir==='f';
    if(q.done)return `<input class="ans" value="${esc(q.typed||'')}" disabled aria-label="Your answer">`;
    return `<input id="ans" class="ans" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Your answer" ${num?'inputmode="numeric" ':''}placeholder="${num?'Type a number':'Type your answer'}" onkeydown="if(event.key==='Enter'){event.preventDefault();event.stopPropagation();if(!event.repeat)answerTyped();}">`
      +(list?`<div class="sub" style="margin-top:6px">Any one item of the list is accepted.</div>`:'')
      +`<div class="btns"><button class="btn" onclick="answerTyped()">Check</button><button class="btn ghost" onclick="answerTyped(true)">Show answer</button></div>`;
  }
  // multiple choice (cards and odd one out)
  const opts=q.opts.map((o,i)=>{
    const cls=!q.done?'':i===q.ansIdx?'ok':i===q.pick?'no':'dim';
    return `<button class="opt ${cls}" onclick="answerMC(${i})"${q.done?' disabled':''}><span class="k">${i+1}</span><span class="ot">${q.done&&o.hd?o.hd:o.h}</span></button>`;}).join('');
  return q.grid?`<div class="optgrid" role="group" aria-label="${q.done?'the seals, shown whole, with their spirits':`${q.opts.length} seal images to choose from, cropped to the inner ring`}">${opts}</div>`:opts;
}
function matchHtml(q){
  const btn=(sd,i,html)=>{const done=q.matched.has(i),sel=sd==='L'?q.selL:q.selR,bad=q.bad&&q.bad[sd==='L'?0:1]===i;
    return `<button class="mi ${done?'done':bad?'bad':sel===i?'sel':''}" onclick="matchTap('${sd}',${i})"${done||q.done?' disabled':''}>${html}</button>`;};
  return `<div class="match"><div class="col">${q.items.map((it,i)=>btn('L',i,matchL(q,it))).join('')}</div>`
    +`<div class="col">${q.right.map(i=>btn('R',i,q.items[i].v.h)).join('')}</div></div>`
    +(q.done?'':`<div class="sub" style="margin-top:8px">Tap one on each side to pair them.</div>`);
}
function orderHtml(q){
  const placed=q.placed.map((x,i)=>`<button class="tile ${q.done?(q.marks[i]?'ok':'no'):''}" onclick="orderTap('placed',${i})"${q.done?' disabled':''}><span class="n">${i+1}</span>${x.h}</button>`).join('')
    ||'<span class="sub">Tap the items below in order…</span>';
  const pool=q.pool.map((x,i)=>`<button class="tile" onclick="orderTap('pool',${i})">${x.h}</button>`).join('');
  return `<div class="tray">${placed}</div><div class="row">${pool}</div>`
    +(q.done?'':`<div class="btns"><button class="btn" onclick="checkOrder()"${q.pool.length?' disabled':''}>Check order</button></div>`);
}
// After an answer: the verdict, the answer and any note, then Next, then (outside Learn) a short study card of the row, card or
// spirit. A Learn session asks about one subject throughout, so there the feedback shows only the fact just asked: no study card
// (it lists the answers to the rest of the quiz), the answer's short form (the fuller one may name a neighbouring fact, e.g. the
// Sephirah beside a card's colour) and no Thoth / Golden Dawn notes (they name the trump and its attribution)
function feedbackHtml(q){
  const learn=inLearn();
  let h=`<div class="fb ${q.ok?'ok':'no'}"><div class="verdict">${q.ok?'Correct':'Not quite'}</div>`;
  if(q.kind==='card'){
    if(q.type==='typed'&&q.res){
      const m=q.res;
      if(q.ok&&(m.dist||(m.matched&&norm(m.matched)!==norm(q.ans.t))))
        h+=`<div class="line">Accepted “${esc(q.typed)}”${m.matched&&norm(m.matched)!==norm(q.typed)?` as “${esc(m.matched)}”`:''}${m.dist?` (${m.dist} letter${m.dist>1?'s':''} off)`:''}.</div>`;
      else if(!q.ok&&q.typed){
        // the typed text is (or looks at least as much like) another item's answer
        const sb=m.sib,whose=sb&&sb.only?` (the answer for ${sb.oth.h0||sb.oth.h})`:'';
        h+=`<div class="line">You wrote “${esc(q.typed)}”`+(!sb?'.':sb.n===norm(q.typed)?` — that is a different answer${whose}.`:` — that looks more like “${esc(sb.t)}”${whose}.`)+`</div>`;
      }
    }
    const a=q.ans,ansH=learn?(a.hl||a.hb||a.h):(a.hf||a.h);
    if(!q.ok||q.type==='typed')h+=`<div class="line">Answer: ${ansH}</div>`;
    // a wrong seal: say whose it was (the options are now shown whole, with their spirits' names)
    if(!q.ok&&q.grid&&q.pick!=null&&q.opts[q.pick]&&q.opts[q.pick].sp){const o=q.opts[q.pick].sp;h+=`<div class="line">You picked the seal of <b>${learn?'':o.n+' '}${esc(o.name)}</b>.</div>`;}
    // (noteL: a Learn-safe explanation, see digRels; a learning path's stage may give its own: pathExplain)
    const it=q.card.it,ex=pathExplain(q.card),nf=learn&&it.noteL?it.noteL:it.note,note=ex!=null?String(ex):nf&&!(learn&&nf.spoils)?nf():'';
    if(note)h+=`<div class="note">${note}</div>`;
  }else{
    if(q.explain)h+=q.explain;
    if(q.kind==='match')h+=`<div class="line">${q.answerHtml}</div>`+(q.ok?'':`<div class="sub"><span class="mx">✗</span> marks the pairs you missed the first time.</div>`);
    if(q.kind==='order'&&!q.ok)h+=`<div class="line">Correct order: ${q.answerHtml}</div>`;
  }
  h+='</div>';
  // Next right under the feedback, so a long answer or study card never pushes it below the fold
  h+=`<div class="btns"><button class="btn" onclick="nextQ()">Next</button></div><div class="kh">Enter = next</div>`;
  if(q.row&&!learn)h+=studyCard(q.row,false,q.kind==='card'?q.card.rel.col:null);
  return h;
}

/* ---------- study cards: the core correspondences of one row ---------- */
// (COL_LBL: the gods' and symbols' columns under their short labels, see prepTables)
function studyCard(row,full,focus){
  if(!row)return '';
  if(row[0]==='t')return tarotCard(row.slice(1),full);
  if(row[0]==='g')return spiritCard(+row.slice(1),full);
  if(row[0]==='k')return rankCard(row.slice(1));
  if(row[0]==='d')return digStudy(row,full);   // dignities: 'dp-<planet>', 'ds-<sign>', 'dk' (the reading key)
  const r=ROW[row];if(!r)return '';
  const kv=[],add=(k,v)=>{if(v)kv.push(`<dt>${k}</dt><dd>${v}</dd>`);};
  const colr=lab=>{const t=cell(lab,row);return t?swatch(hexes(lab,row))+esc(t):'';};
  const tl=s=>ST.set.translit&&s?` <span class="tl">${esc(s)}</span>`:'';   // honours "Show transliterations"
  const hier=(lab,eng,fix)=>{const raw=COL[lab]&&COL[lab].cells&&COL[lab].cells[row];if(!raw)return '';
    const p=splitHeb(clean(raw)),e=eng?cell(eng,row):'',hb=fix||p.heb;
    return (hb?he(hb):'')+(hb?tl(p.lat):esc(p.lat))+(e?` <span class="sub">· ${esc(e)}</span>`:'');};
  let head,note='',rowNote='';
  if(r.kind==='seph'){
    const g=GOD_NAMES[r.n];
    head=`<div class="badge" style="background:var(--hit)">${r.n}</div><div><div class="ttl">${esc(r.name)} ${he(SEPH_HEB[r.n])}</div><div class="sub">${esc(r.meaning)} · ${esc(symOf(r.sphere))}${esc(r.sphere)}</div></div>`;
    add('God-name',he(g[0])+tl(g[1]));
    add('Archangel',hier('XCIX'));
    add('Choir',hier('C','CI'));
    if(full)add('Heaven',hier('VI','VII'));
    if(r.n===6||r.n===8)note=ARCH_NOTE;
  }else{
    const a=attrOf(row),[num,title]=trumpOf(row),t=TRUMPS[row],alt=sys()==='gd'?`${t[0]} ${t[1]}`:`${t[2]} ${t[3]}`;
    head=`<div class="badge" style="background:var(--hit)">${he(r.glyph)}</div><div><div class="ttl">Path ${row} · ${esc(r.name)}</div><div class="sub">“${esc(r.meaning)}” · value ${r.value} · ${esc(connOf(row))}</div></div>`;
    add('Attribution',esc(symOf(attrParts(a)[0]))+esc(a)+(a!==r.attr777?` <span class="sub">(Liber 777: ${esc(r.attr777)})</span>`:''));
    add('Atu',`<b>${num}</b> ${esc(title)}`+(alt!==`${num} ${title}`?` <span class="sub">(${sys()==='gd'?'Thoth':'Golden Dawn'}: ${esc(alt)})</span>`:''));
    note=swapNote(row);
    // Thoth rows 15/28: the trump's sign differs from the sign 777 drew these columns up for
    if(a!==r.attr777)rowNote=`The colours, gods and symbols listed here are Liber 777's row ${row}, drawn up for <b>${esc(r.attr777)}</b>; the Thoth trump on this path carries ${esc(a)}.`;
  }
  add('King scale',colr('XV'));add('Queen scale',colr('XVI'));
  const cols=full?Object.keys(COL_LBL):['XIX'];
  if(focus&&COL_LBL[focus]&&!cols.includes(focus))cols.push(focus);
  cols.forEach(c=>add(COL_LBL[c],esc(cell(c,row))));
  return `<div class="study"><div class="hd">${head}</div><dl class="kv">${kv.join('')}</dl>`
    +(rowNote?`<div class="sub" style="margin-top:8px">${rowNote}</div>`:'')+(full&&note?`<div class="note">${note}</div>`:'')+`</div>`;
}
// A spirit's study card. Compact (after a question): seal badge, rank, decan, legions, Shem angel, office.
// full (Learn a spirit): the seal large in its rank's pen colour, the 1904 names, rank text, legions, appearance, office,
// decan by day / night, pen suggestion and Shem angel.
function spiritCard(n,full){
  const s=spiritByN(n);if(!s)return '';
  const d=(G.decans||[]).find(x=>`${x.sign} ${x.decan}`===s.decan),dn=s.dayNight==='Day'?'day':'night';
  const kv=[],add=(k,v)=>{if(v)kv.push(`<dt>${k}</dt><dd>${v}</dd>`);};
  const ranks=spRanks(s),figs=sealFigs(s),vars=spIds(s).slice(1);
  const rk=ranks.map(x=>G.ranks&&G.ranks[x]?`<b>${esc(x)}</b> <span class="sub">· ${esc(rankPM(G.ranks[x]))}</span>`:esc(x)).join('<br>');
  // the Shem angel of the spirit's own number (goetia.json), which is not the pair Book T gives its decan (see the Tarot card)
  const bt=DECAN.find(x=>`${x.sign} ${x.rn}`===s.decan);
  const shem=s.shem?esc(s.shem)+` <span class="sub">(paired by number with spirit ${n})</span>`
    +(full&&bt&&bt.shem?`<br><span class="sub">Book T and Liber 777, which begin the angels at Leo I, give ${esc(s.decan)} the angels ${esc(bt.shem)}.</span>`:''):'';
  const leg=String(s.legions||'').match(/^\s*(\d+)\s*([\s\S]*)$/);
  const legH=leg?`<b>${leg[1]}</b>`+(full&&leg[2].trim()?` <span class="sub">${esc(leg[2].trim())}</span>`:''):esc(s.legions);
  // the other spirit of the same decan (by night for a day spirit and the other way round)
  const mate=d?spiritByN(s.dayNight==='Day'?d.night:d.day):null;
  const dec=`${esc(s.decan)} by ${dn}`+(d?` <span class="sub">· ${esc(d.degrees)} · ${esc(d.card)} (${esc(d.title)})</span>`:'')
    +(full&&mate?`<br><span class="sub">by ${dn==='day'?'night':'day'}: ${mate.n} ${esc(spPrim(mate.name))}</span>`:'');
  if(!full){
    add('Rank',rk);add('Decan',dec);add('Legions',legH);add('Shem angel',shem);add('Office',esc(brief(s.office,160)));
    const badge=figs.length?sealImg(figs[0],{label:'seal of '+spPrim(s.name)}):n;
    return `<div class="study"><div class="hd"><div class="badge" style="background:var(--hit)">${badge}</div><div><div class="ttl">${n} · ${esc(s.name)}</div><div class="sub">${esc(s.rank)} · ${dn==='day'?'Day':'Night'} spirit of ${esc(s.decan)}</div></div></div><dl class="kv">${kv.join('')}</dl></div>`;
  }
  const pen=penOf(ranks[0]),ink=pen&&pen.hex||'var(--acc)',paper=pen&&pen.hex?paperFor(pen.hex):'var(--hit)';
  const seals=figs.length?`<div class="paper" style="background:${paper}">${figs.map(f=>sealImg(f,{cls:figs.length>1?'':'one',col:ink,label:`seal of ${spPrim(s.name)}, fig. ${f}`})).join('')}</div>`:'';
  add('Rank',rk+(s.rankText?`<br><span class="sub">“${esc(s.rankText)}”</span>`:''));
  add('Legions',legH);
  add('Appearance',esc(s.appearance)||'<span class="sub">No form is described.</span>');
  add('Office',esc(s.office));
  add('Decan',dec);
  add('Shem angel',shem);
  const pens=ranks.map(r=>{const k=G.ranks&&G.ranks[r],p=penOf(r);if(!k||!p)return '';
    const sw=hx=>hx&&HEX6.test(hx)?`<span class="pen" style="background:${hx}"></span>`:'';   // only a checked #rrggbb goes into the style
    const other=(o,lab)=>{if(!o||!o.code)return '';const hx=G.pens&&G.pens[o.code]&&G.pens[o.code].hex;return ` <span class="sub">· ${lab}: </span>${sw(hx)}<span class="sub">${esc(o.label||o.code)}</span>`;};
    return (ranks.length>1?`<span class="sub">${esc(r)}:</span> `:'')+sw(p.hex)+esc(p.label)+other(k.alt,'alt.')+other(k.gd,'Golden Dawn colour');}).filter(Boolean).join('<br>');
  add('Pen',pens);
  add('Seal',figs.length?`fig. ${figs.join(' &amp; ')} <span class="sub">(1904 plates)${figs.length>1?' · two seals: either one counts':''}</span>`:'');
  return `<div class="study">${seals}<div class="hd"><div class="badge" style="background:var(--hit)">${n}</div><div><div class="ttl">${esc(spPrim(s.name))}</div>`
    +`<div class="sub">${vars.length?'also '+esc(vars.join(', '))+' · ':''}${dn==='day'?'Day':'Night'} spirit of ${esc(s.decan)}</div></div></div><dl class="kv">${kv.join('')}</dl>`
    +(pen&&pen.hex?`<div class="sub" style="margin-top:8px">The seal is drawn in the pen suggested for a ${esc(ranks[0])}'s seal (${esc(rankPM(G.ranks[ranks[0]]).split(' · ')[1]||'')}), ${paper==='#16140f'?'as on black paper':'on pale paper: this pen is too dark to show on black'}.</div>`:'')+`</div>`;
}
function rankCard(rank){
  const k=G&&G.ranks&&G.ranks[rank];if(!k)return '';
  const sp=G.spirits.filter(s=>s.rank.split('/').map(x=>x.trim()).includes(rank));
  return `<div class="study"><div class="hd"><div class="badge" style="background:var(--hit)">${esc(symOf(rank==='King'?'Sol':rank==='Marquis'?'Luna':k.planet))||'·'}</div><div><div class="ttl">${esc(rank)}</div><div class="sub">${esc(rankPM(k))}</div></div></div>`
    +`<dl class="kv"><dt>Spirits (${sp.length})</dt><dd>${sp.map(s=>esc(s.n+' '+s.name.replace(/\s*\(.*\)$/,''))).join(', ')}</dd></dl></div>`;
}

/* ---------- study card of a Tarot card ---------- */
// The learner's own card photos (Scan tool, Store kind "cards"): the newest scan of each card
let SCANS=null;
function loadScans(force){
  if(SCANS&&!force)return SCANS;
  SCANS={};
  // the deck chosen under "My cards" (Tarot Deck / Spread) comes first; other decks fill the gaps
  const cur=(window.Decks&&Decks.current())||'Thoth',same=r=>String((r.data&&r.data.deck)||'Thoth').toLowerCase()===String(cur).toLowerCase();
  try{if(window.Store&&typeof Store.list==='function')(Store.list('cards')||[]).slice().sort((a,b)=>same(b)-same(a)).forEach(r=>{
    const k=r&&r.data&&r.data.card,u=r&&r.imageUrl;
    if(k&&TC[k]&&!SCANS[k]&&typeof u==='string'&&/^(data:image\/|https?:|blob:|\/)/i.test(u))SCANS[k]=u;});}catch(e){}
  return SCANS;
}
const scanOf=k=>loadScans()[k]||'';
function tSeph(c){const s=SEPH[c.seph-1];if(!s)return '';
  return `${c.seph} <b>${esc(s.name)}</b> ${he(SEPH_HEB[c.seph])} <span class="sub">· ${c.kind==='court'?`the four ${esc(c.rank.pl)}`:`in ${esc(c.suit.world)}, the world of ${esc(c.suit.el)}`}</span>`;}
function tColour(c){const {t,hx}=suitColour(c);return t?swatch(hx)+esc(t)+` <span class="sub">(${c.suit.scaleN} Scale)</span>`:'';}
function tarotCard(key,full){
  const c=TC[key];if(!c)return '';
  const kv=[],add=(k,v)=>{if(v)kv.push(`<dt>${k}</dt><dd>${v}</dd>`);};
  const sg=s=>esc(symOf(s))+esc(s);
  const colr=(lab,row)=>{const t=cell(lab,row);return t?swatch(hexes(lab,row))+esc(t):'';};
  const spir=n=>{const sp=spiritByN(n);return sp?`${sealIc(sp)}<b>${sp.n} ${esc(spPrim(sp.name))}</b> <span class="sub">${esc(sp.rank)}</span>`:'';};
  let badge='',sub='',note='',extra='';
  if(c.kind==='major'){
    const p=atuPath(c.n),P=ROW[p]||{},row=ATU_ROW[c.n],a=(ROW[row]||{}).attr777||'',t7=title777(c.n);
    badge=he(P.glyph||'');sub=`${esc(P.name||'')} · ${esc(symOf(attrParts(a)[0]))}${esc(a)}`;
    add('Title',`<b>${esc(c.title)}</b>`+(c.gd?` <span class="sub">(Golden Dawn: ${esc(c.gd)})</span>`:''));
    add('Letter',`${esc(P.name||'')} ${he(P.glyph||'')} · path ${p} <span class="sub">${esc(connOf(p))}</span>`
      +(P.meaning?`<br><span class="sub">“${esc(P.meaning)}” · value ${P.value}</span>`:''));
    add('Attribution',esc(symOf(attrParts(a)[0]))+esc(a));
    if(t7)add('Liber 777',`“${esc(t7)}” <span class="sub">(col. CLXXX)</span>`);
    add('King scale',colr('XV',row));add('Queen scale',colr('XVI',row));
    if(full){add('Emperor scale',colr('XVII',row));add('Empress scale',colr('XVIII',row));}
    note=swapNote(p);
    if(p!==row)extra=`The colours and the Liber 777 title are those of row ${row} (${esc(a)}), which belongs to this card; its letter is ${esc(P.name||'')} (path ${p}).`;
  }else if(c.kind==='minor'){
    const d=c.dec,P=PL_SOL[d.ruler]||d.ruler;
    badge=`<b>${c.n}</b>`;sub=`${esc(symOf(P))}${esc(d.ruler)} in ${sg(d.sign)} · ${esc(d.sign)} ${d.rn}`;
    add('Title',`<b>${esc(c.title)}</b> <span class="sub">· Book T: Lord of ${esc(c.bookT)}</span>`);
    add('Decan',`${esc(d.sign)} ${d.rn} <span class="sub">· ${d.deg} ${esc(symOf(d.sign).trim())}</span>`);
    add('Planet',`${esc(symOf(P))}${esc(d.ruler)} in ${sg(d.sign)}`);
    add('Sephirah',tSeph(c));
    add('Colour',tColour(c));
    if(d.court)add('Court card',`${esc(d.court.name)} <span class="sub">(${esc(d.court.span.t)})</span>`);
    if(G&&Array.isArray(G.spirits))add('Goetia',`<span class="sub">by day</span> ${spir(d.day)}<br><span class="sub">by night</span> ${spir(d.night)}`);
    if(d.shem)add('Shem angels',esc(d.shem)+` <span class="sub">(Book T and Liber 777, beginning at Leo I`
      +(full&&d.shemG?`; ${esc(d.shemG)} in the Nightside workbook numbering, from Aries I; the Goetia pairs each spirit with the angel of its own number`:'')+`)</span>`);
  }else if(c.kind==='ace'){
    badge='<b>A</b>';sub=esc(c.title);
    add('Title',esc(c.title));add('Element',esc(c.suit.el));add('Sephirah',tSeph(c));add('World',esc(c.suit.world));add('Colour',tColour(c));
    const hl=TCOURTS.find(r=>r.el===c.suit.el);
    if(hl)add('Letter',`${esc(hl.hl)} ${he(hl.he)} <span class="sub">of ${he('יהוה')} · the letter of the ${esc(c.suit.n)}</span>`);
    const pr=TC[c.suit.k+'-princess'];
    if(pr&&pr.quad)add('Throne',`the ${esc(pr.name)} <span class="sub">· quadrant of ${pr.quad.map(sg).join(', ')} about the North Pole</span>`);
  }else{
    const rk=c.rank;badge=he(rk.he);sub=`${esc(rk.el)} of ${esc(c.suit.el)}`+(c.span?` · ${esc(c.span.t)}`:'');
    add('Element',`<b>${esc(rk.el)} of ${esc(c.suit.el)}</b>`);
    add('Letter',`${esc(rk.hl)} ${he(rk.he)} <span class="sub">of ${he('יהוה')}</span>`);
    add('Sephirah',tSeph(c));
    if(c.span){add('Rules',`20° ${sg(c.span.a)} – 20° ${sg(c.span.b)}`);
      add('Small cards',c.decans.map(d=>`${d.n} of ${esc(d.suit.n)} <span class="sub">(${esc(d.sign)} ${d.rn})</span>`).join(' · '));}
    if(c.quad){add('Quadrant',`${c.quad.map(sg).join(', ')} <span class="sub">· about the North Pole</span>`);add('Throne of',`the Ace of ${esc(c.suit.n)}`);}
    if(full&&c.t777)add('Liber 777',`${esc(c.t777)} <span class="sub">(col. ${c.suit.col})</span>`);
  }
  // the learner's scan: a small 2:3 picture beside the title (on the study page, tap it to see it large under the header)
  const img=scanOf(key);
  const head=(img?(full?`<button class="scanbtn" onclick="toggleScan(this)" aria-expanded="false" aria-label="Your scan of the ${esc(c.name)}: show it large"><img class="thumb" src="${esc(img)}" alt=""></button>`
      :`<img class="thumb" src="${esc(img)}" alt="">`):`<div class="badge" style="background:var(--hit)">${badge}</div>`)
    +`<div><div class="ttl">${esc(c.label)}</div><div class="sub">${sub}</div></div>`;
  return `<div class="study"><div class="hd">${head}</div>`+(img&&full?`<img class="scanimg hidden" src="${esc(img)}" alt="Your scan of the ${esc(c.name)}" onclick="toggleScan(this.parentNode.querySelector('.scanbtn'))">`:'')
    +`<dl class="kv">${kv.join('')}</dl>`+(extra?`<div class="sub" style="margin-top:8px">${extra}</div>`:'')+(full&&note?`<div class="note">${note}</div>`:'')+`</div>`;
}
function toggleScan(b){
  const st=b&&b.closest('.study'),im=st&&st.querySelector('.scanimg');if(!im)return;
  b.setAttribute('aria-expanded',String(!im.classList.toggle('hidden')));
}

function finish(){
  clearTick();const s=SES;if(!s)return goHome();
  s.endT=Date.now();
  if(s.mode==='speed'&&s.correct>ST.stats.speedBest){ST.stats.speedBest=s.correct;s.newBest=true;}
  if(s.mode==='path')pathRecord(s);
  saveState();renderSummary();
  Q=null;   // nothing may answer or redraw the finished question (e.g. a pending matching timeout)
}
function again(){
  const m=SES&&SES.mode,row=SES&&SES.row;
  if(m==='review'){const p=reviewPlan();return p.due.length+p.neu.length?startReview():goHome();}
  if(m==='speed')return startSpeed();
  if(m==='flash')return startFlash();
  if(m==='learn')return startLearn(row);
  if(m==='learncard')return startLearnCard(SES.card);
  if(m==='learnspirit')return startLearnSpirit(SES.spirit);
  if(m==='path')return startPathStage(SES.path,SES.stage);
  if(m==='digplanet')return startLearnPlanet(SES.planet);
  if(m==='mistakes'){const ids=SES.ids||[];return ids.length?newSession('mistakes',mistakeQueue(ids),{ids}):goHome();}
  startPractice();
}
function renderSummary(){
  const s=SES;SCREEN='sum';showHomeBtn(true);
  let h=`<div class="card"><div class="sec">${esc(modeLabel(s))} · summary</div>`;
  if(s.mode==='speed')h+=`<div class="score">${s.correct}</div><div class="sub" style="text-align:center">${s.newBest?'New best score!':'Best so far: '+ST.stats.speedBest}</div>`;
  if(s.mode==='flash')h+=`<div class="sub">Again ${s.grades.again} · Good ${s.grades.good} · Easy ${s.grades.easy}</div>`;
  h+=`<div class="kpis" style="margin-top:10px">${kpi('accuracy',s.answered?pct(s.correct,s.answered)+'%':'—')}${kpi('answered',s.answered)}${kpi('time',fmtTime((s.endT||Date.now())-s.start))}${kpi('best streak',s.best)}</div></div>`;
  if(s.mode==='path')h+=pathResultHtml(s);
  if(s.mistakes.length){
    h+=`<div class="card"><div class="sec">Mistakes (${s.mistakes.length})</div>`
      +s.mistakes.map(m=>`<div class="mist"><div>${m.p}</div><div class="ok">✓ ${m.a}</div>${m.g?`<div class="no">✗ ${m.g}</div>`:''}</div>`).join('')+`</div>`;
  }else if(s.answered)h+=`<div class="note">No mistakes. Well done.</div>`;
  const canRev=s.mistakes.some(m=>m.id||(m.ids&&m.ids.length));
  // Learn sessions lead back to their study page
  const back=s.mode==='learn'&&ROW[s.row]?`<button class="btn ghost" onclick="openLearn('${s.row}')">Back to the row</button>`
    :s.mode==='learncard'&&TC[s.card]?`<button class="btn ghost" onclick="openCard('${s.card}')">Back to the card</button>`
    :s.mode==='learnspirit'&&spiritByN(s.spirit)?`<button class="btn ghost" onclick="openSpirit(${s.spirit})">Back to the spirit</button>`
    :s.mode==='path'&&PATH[s.path]&&PATH[s.path].stages[s.stage-1]?`<button class="btn ghost" onclick="openPathStage('${s.path}',${s.stage})">Back to the lesson</button>`
    :s.mode==='digplanet'&&dgPlanet(s.planet)?`<button class="btn ghost" onclick="openPlanet('${s.planet}')">Back to the planet</button>`:'';
  // a passed stage leads on to the next one
  const P=s.mode==='path'?PATH[s.path]:null;
  const nextSt=P&&P.stages[s.stage]&&pathUnlocked(P,s.stage+1)&&(s.score||0)>=P.pass?`<button class="btn" onclick="openPathStage('${P.id}',${s.stage+1})">Stage ${s.stage+1} ›</button>`:'';
  h+=`<div class="btns">${nextSt}${canRev?'<button class="btn" onclick="startMistakes()">Review mistakes</button>':''}`
    +`<button class="btn ghost" onclick="again()">Go again</button>${back}<button class="btn ghost" onclick="goHome()">Home</button></div>`;
  $('#app').innerHTML=h;window.scrollTo(0,0);
}

/* ---------- flashcards ---------- */
function renderFlash(){
  const s=SES;if(!s)return goHome();
  SCREEN='flash';showHomeBtn(true);
  if(s.i>=s.queue.length)return finish();
  const c=CARD[s.queue[s.i]];if(!c){s.i++;return renderFlash();}
  if(c.rel.pre&&!s.flipped)c.rel.pre(c.it);   // e.g. which of a spirit's two seals is shown (kept while the card is flipped)
  const ans=ansOf(c),st=ST.cards[c.id],t=today(),sched=!!st||newLeft()>0;
  // button labels follow the same rule as grade(): the wait until the card is next due
  const days=g=>{if(!sched)return 'not scheduled';
    const n=schedule(st||null,g!=='again',{easy:g==='easy',lapsed:s.missed.has(c.id)},t).d-t;return n<=0?'today':n===1?'1 day':n+' days';};
  let h=topBar(s,`${s.i+1} / ${s.queue.length}`)+`<div class="bar"><i style="width:${pct(s.i,s.queue.length)}%"></i></div>`;
  h+=`<div class="card fc" onclick="flipCard()"><div class="tag">${esc(deckName(c.deck))}${st?'':' · new card'}</div>`
    +`<div class="prompt">${c.dir==='f'?c.rel.fq(c.it):c.rel.rq(c.it)}</div>`
    +(s.flipped?`<div class="back">${ans.hf||ans.h}</div>`:`<div class="sub" style="margin-top:16px">Tap to reveal</div>`)+`</div>`;
  if(s.flipped){
    const note=c.it.note?c.it.note():'';
    if(note)h+=`<div class="note">${note}</div>`;
    h+=`<div class="btns"><button class="btn warn" onclick="gradeFlash('again')">Again · ${days('again')}</button>`
      +`<button class="btn" onclick="gradeFlash('good')">Good · ${days('good')}</button><button class="btn ghost" onclick="gradeFlash('easy')">Easy · ${days('easy')}</button></div>`
      +`<div class="kh">1 Again · 2 Good · 3 Easy</div>`+studyCard(c.row,false,c.rel.col);
  }else h+=`<div class="kh">Space or Enter = reveal</div>`;
  $('#app').innerHTML=h;
}
function flipCard(){if(SES&&SCREEN==='flash'&&!SES.flipped){SES.flipped=true;renderFlash();}}
function gradeFlash(g){
  const s=SES;if(!s||SCREEN!=='flash'||!s.flipped)return;
  const id=s.queue[s.i],ok=g!=='again',c=CARD[id];
  grade(id,ok,{easy:g==='easy',lapsed:ok&&s.missed.has(id)});record(ok);
  s.answered++;s.grades[g]++;
  if(ok){s.correct++;s.streak++;s.best=Math.max(s.best,s.streak);}
  else{s.streak=0;s.missed.add(id);
    if(c)s.mistakes.push({p:c.dir==='f'?c.rel.fq(c.it):c.rel.rq(c.it),a:ansOf(c).hf||ansOf(c).h,g:'',id});
    // back three cards later, as in the quiz modes
    const n=s.requeues[id]||0;if(n<2){s.requeues[id]=n+1;s.queue.splice(Math.min(s.i+3,s.queue.length),0,id);}}
  ST.stats.bestStreak=Math.max(ST.stats.bestStreak,s.best);
  saveState();s.i++;s.flipped=false;renderFlash();window.scrollTo(0,0);
}

/* ---------- home ---------- */
function goHome(){clearTick();SES=null;Q=null;renderHome();}
function renderHome(){
  SCREEN='home';showHomeBtn(false);
  const p=reviewPlan(),due=p.due.length,neu=p.neu.length,tot=due+neu,t=today();
  const seen=CARDS.filter(c=>ST.cards[c.id]).length,mast=CARDS.filter(c=>{const s=ST.cards[c.id];return s&&s.b>=3;}).length;
  let later='';
  if(!tot){let min=Infinity;CARDS.forEach(c=>{const s=ST.cards[c.id];if(s&&ST.set.daily.includes(c.deck)&&s.d>t)min=Math.min(min,s.d);});
    if(min<Infinity)later=min-t===1?' Next cards are due tomorrow.':` Next cards are due in ${min-t} days.`;}
  // (quiz items are "questions" on these screens: "card" is a Tarot card)
  let h=`<div class="kpis">${kpi('day streak',dayStreak())}${kpi('questions mastered',`${mast}<span class="sub"> / ${CARDS.length}</span>`)}${kpi('accuracy',ST.stats.total?pct(ST.stats.correct,ST.stats.total)+'%':'—')}</div>`;
  if(!ST.stats.total)h+=`<div class="note">Start with <b>Today's review</b>. It brings in ${ST.set.newPerDay} new questions a day, a few from each deck in turn, and asks each one again just before you would forget it. Every answer is followed by a short study card for that Sephirah, path, Tarot card or spirit.</div>`;
  h+=`<div class="home">
   <button class="big primary wide" onclick="startReview()"${tot?'':' disabled'}><span class="ic">✓</span><span><b>Today's review</b><span class="sub">${tot?`${due} due · ${neu} new`:liveDecks(ST.set.daily).length?'All caught up.'+later:'No decks chosen for the daily review (see Settings).'}</span></span></button>
   <button class="big" onclick="renderSetup('practice')"><span class="ic">✎</span><span><b>Practice</b><span class="sub">Choose decks, question types and length</span></span></button>
   <button class="big" onclick="renderSetup('speed')"><span class="ic">60</span><span><b>Speed round</b><span class="sub">60 seconds · best ${ST.stats.speedBest}</span></span></button>
   <button class="big" onclick="renderSetup('flash')"><span class="ic">⇄</span><span><b>Flashcards</b><span class="sub">Flip, then grade yourself</span></span></button>
   <button class="big" onclick="renderLearnHub()"><span class="ic">${he('ש')}</span><span><b>Learn</b><span class="sub">Study one ${esc(learnWhat())} at a time, then quiz it</span></span></button>
   <button class="big" onclick="renderProgress()"><span class="ic">▥</span><span><b>Progress</b><span class="sub">${seen} of ${CARDS.length} questions seen · mastery map</span></span></button>
   <button class="big" onclick="renderSettings()"><span class="ic">⚙\uFE0E</span><span><b>Settings</b><span class="sub">${ST.set.newPerDay} new a day · ${ST.set.system==='gd'?'Golden Dawn':'Thoth'} attribution</span></span></button>
  </div>`;
  $('#app').innerHTML=h;window.scrollTo(0,0);
}

/* ---------- practice / speed / flashcard setup ---------- */
let SETUP='practice';
function renderSetup(mode,msg){
  if(SCREEN!=='setup')setTimeout(()=>window.scrollTo(0,0),0);

  // an empty selection is allowed while choosing; Start stays disabled until there is something to ask
  const need=!liveDecks(P.decks).length?'Pick at least one deck.':mode==='practice'&&!P.types.length?'Pick at least one question type.':'';

    <div class="row" style="margin-top:4px"><button class="btn ghost sm" onclick="allDecks(true)">All decks</button><button class="btn ghost sm" onclick="allDecks(false)">Clear</button></div></div>`;
  if(mode==='practice')h+=`<div class="card"><div class="sec">Question types</div><div class="chips">${TYPES.map(([id,n])=>`<button class="chip ${P.types.includes(id)?'on':''}" onclick="togglePType('${id}')">${n}</button>`).join('')}</div>
    <div class="sub">Ordering needs the Hebrew or Tree deck; odd one out needs Gods or Symbols.</div></div>`;
  if(mode!=='speed')h+=`<div class="card"><div class="sec">Length</div><div class="seg">${[10,20,40].map(n=>`<button class="${P.len===n?'on':''}" onclick="setPLen(${n})">${n}</button>`).join('')}</div></div>`;
  if(mode==='speed')h+=`<div class="note">Multiple choice, as many as you can in 60 seconds. Best so far: <b>${ST.stats.speedBest}</b>. Speed rounds do not change your review schedule.</div>`;
  if(mode==='flash')h+=`<div class="note">Due cards come first, then today's new cards, then your weakest. <b>Again · Good · Easy</b> feed the same schedule as the daily review.</div>`;

}
function togglePDeck(id){const a=ST.practice.decks,i=a.indexOf(id);if(i>=0)a.splice(i,1);else a.push(id);saveState();renderSetup(SETUP);}
function allDecks(on){ST.practice.decks=on?DECKS.filter(d=>deckCards(d.id).length).map(d=>d.id):[];saveState();renderSetup(SETUP);}
function togglePType(id){const a=ST.practice.types,i=a.indexOf(id);if(i>=0)a.splice(i,1);else a.push(id);saveState();renderSetup(SETUP);}
function setPLen(n){ST.practice.len=n;saveState();renderSetup(SETUP);}
function startSetup(){
  if(!liveDecks(ST.practice.decks).length)return renderSetup(SETUP);

}

/* ---------- Learn hub: study one subject at a time, then quiz only that subject ----------
   Each entry: {id, ic() → icon html, name, what (for the home button), sub (text, or a function giving it), open(), ok() → available?,
   stat() → mastery 0…1, or statT() → a status text}.
   A section adds its own entry with LEARN.push({…}) — e.g. "Learn a spirit" for the Goetia; the hub and the home button follow.
   Learning paths get theirs from registerPath (see "Learning paths: a registry"). */
const LEARN=[
  {id:'row',ic:()=>he('ש'),name:'Learn a row',what:'Tree row',sub:'Tree of Life · one Sephirah or path',
    open:()=>renderLearnPick(),ok:()=>ROWKEYS.length>0,stat:()=>ROWKEYS.reduce((a,k)=>a+rowMastery(k),0)/ROWKEYS.length},
  {id:'card',ic:()=>'78',name:'Learn a card',what:'Tarot card',sub:'Tarot · one of the 78 Thoth cards',
    open:()=>renderCardPick(),ok:()=>TC_ORDER.length>0&&deckCards('tarot').length>0,stat:()=>TC_ORDER.reduce((a,k)=>a+cardMastery(k),0)/(TC_ORDER.length||1)}];

function learnWhat(){const w=learnOn().map(e=>e.what).filter(Boolean);return w.length<2?(w[0]||'thing'):w.slice(0,-1).join(', ')+' or '+w[w.length-1];}

// (shown on the Learn pages and the stages of the learning paths only: their answers are scheduled whatever is left, see grade)

/* ---------- learn a spirit (Goetia) ---------- */

function filterSpirits(v){

}

/* ---------- dignities: study cards (a planet, a sign, the reading key) ---------- */
function digStudy(row,full){
  if(!DG)return '';
  if(row==='dk')return digKeyCard();
  if(row.startsWith('dp-')){const p=dgPlanet(row.slice(3));return p?digPlanetCard(p,full):'';}
  if(row.startsWith('ds-')){const s=DGS[row.slice(3)];return s?digSignCard(s):'';}
  return '';
}
// the planet in each of the twelve signs: R ruler, E exalted, D detriment, F fall (green strengthens, red weakens)
function pisRow(p){
  return `<div class="pisrow" role="list" aria-label="${esc(p.planet)} in each sign">${SIGNS.map(s=>{const d=digIn(p.planet,s);
    return `<span role="listitem" class="${d.length?(digStrong(d)?'dst':'dwk'):''}" title="${esc(p.planet)} in ${esc(s)}: ${esc(digLabel(d))}" aria-label="${esc(s)}: ${esc(digLabel(d))}">${dgG(DGS[s].glyph)}<small>${d.map(x=>DABBR[x]).join('')||'·'}</small></span>`;}).join('')}</div>`
    +`<div class="sub">R ruler · E exalted · D detriment · F fall · “·” peregrine</div>`;
}
function digPlanetCard(p,full){
  const kv=[],add=(k,v)=>{if(v)kv.push(`<dt>${k}</dt><dd>${v}</dd>`);};
  const L=a=>Array.isArray(a)&&a.length?esc(a.join(', ')):'';
  add('Rules',esc(dgQL(p,'rules')));add('Exalted in',esc(dgQL(p,'exaltedIn')));add('Detriment',esc(dgQL(p,'detrimentIn')));add('Fall',esc(dgQL(p,'fallIn')));
  add('Nature',[p.nature,p.temperament,p.sect].filter(Boolean).map(esc).join(' · '));
  add('Principle',esc(p.principle||''));
  if(full){
    add('Dignified',L(p.dignified));add('Ill-dignified',L(p.ill));
    const Lt=letP(p.letter);
    add('Sephira',esc(p.sephira||''));add('Letter',Lt?`${esc(Lt.n)} ${he(Lt.g)}`:esc(p.letter||''));add('Kamea',esc(p.kamea||''));
    add('King-scale colour',p.colourName&&HEX6.test(p.hex||'')?swatch([p.hex])+esc(p.colourName)+` <span class="sub">${esc(p.hex)}</span>`:'');
    add('Metal',esc(p.metal||''));add('Archangel',esc(p.archangel||''));
    add('Day',esc(p.day||''));add('Cycle',esc(p.cycle||''));add('Body',esc(p.body||''));add('Age of life',esc(p.age||''));add('Trades',L(p.trades));
    if(p.element)add('Elemental Atu',`${dgAtuH(p)} · ${esc(p.element)} <span class="sub">(Crowley's outer-planet pairing)</span>`);
  }
  const sub=[p.card?dgAtuH(p):'',p.also?esc(p.also):'',p.atuNote?esc(p.atuNote):'',p.kind==='outer'?'modern: no dignities in this scheme':''].filter(Boolean).join(' · ');
  const grid=full&&p.kind!=='outer'?pisRow(p):'';
  return `<div class="study"><div class="hd"><div class="badge" style="background:var(--hit);font-size:24px">${dgG(p.glyph)}</div><div><div class="ttl">${esc(p.planet)}</div><div class="sub">${sub}</div></div></div>`
    +grid+`<dl class="kv"${grid?' style="margin-top:10px"':''}>${kv.join('')}</dl>`+(full&&p.kind==='outer'?`<div class="sub" style="margin-top:8px">${esc(dgRules().modern)}</div>`:'')+`</div>`;
}
function digSignCard(s){
  const kv=[],add=(k,v)=>{if(v)kv.push(`<dt>${k}</dt><dd>${v}</dd>`);};
  add('Ruler',dgPn(s.ruler));add('Exalted',s.exalted?dgPn(s.exalted):'<span class="sub">none in this scheme</span>');
  add('Detriment',dgPn(s.detriment));add('Fall',s.fall?dgPn(s.fall):'<span class="sub">none in this scheme</span>');add('Opposite',dgSg(s.opposite));

}
function digKeyCard(){
  const K=DG.readingKey||{};

/* ---------- Learn a planet ----------
   Like Learn a spirit: only questions asked from the planet's side ("Saturn → which signs does it rule?", "Which Atu is the planet
   Saturn?"), never one whose answer is the planet or names it (Atu XIX Sun). One question per fact, and none whose answer names another
   one's: Jupiter's keyword "Fortune" and its Atu X Fortune, the Sun's keyword "Vitality" and its body "…, vitality" (digPick) */
const planetSideOK=c=>{const ps=c.it.pside;return ps==='s'||ps==='x'?c.dir==='f':ps==='v'?c.dir==='r':false;};
const ansTexts=c=>{const a=ansOf(c);return [a.t,...(a.alt||[])].map(t=>String(t||''));};
function learnPlanetCands(id){
  const p=dgPlanet(id);if(!p)return[];
  const ids=[p.planet,p.also,PL_SOL[p.planet]].filter(Boolean);
  return (ROWCARDS['dp-'+id]||[]).filter(c=>!c.rel.noLP&&planetSideOK(c)&&!namesAny(ansTexts(c),ids));
}
// keeps cards in order, skipping one that asks a fact already taken (fx), or whose answer or question names another one's answer
// (or the other way round): "Is “Fortune” a dignified keyword of Jupiter?" shows the answer of "Which Atu is the planet Jupiter?"
function digPick(cands,max,factsOnly){
  const out=[],fx=new Set(),seen=[];
  const idsOf=c=>{const a=ansOf(c);return uniq([a.t,...(a.alt||[]),...(a.parts||[])].map(String)).filter(x=>norm(x).length>=3);};
  const stem=c=>{let p='';try{p=c.dir==='f'?c.rel.fq(c.it):c.rel.rq(c.it);}catch(e){}return String(p).replace(/<[^>]*>/g,' ');};
  for(const c of cands){
    const f=c.it.fx||[c.rel.id+'|'+c.it.key];if(f.some(x=>fx.has(x)))continue;
    const me={t:ansTexts(c),ids:idsOf(c),q:stem(c)};
    if(!factsOnly&&seen.some(o=>namesAny(me.t,o.ids)||namesAny(o.t,me.ids)||namesAny([me.q],o.ids)||namesAny([o.q],me.ids)))continue;
    out.push(c);f.forEach(x=>fx.add(x));seen.push(me);if(max&&out.length>=max)break;
  }
  return out;
}
const planetPool=id=>LPOOL['p'+id]||(LPOOL['p'+id]=digPick(learnPlanetCands(id)));
const planetMastery=id=>boxMastery(planetPool(id));
function startLearnPlanet(id){
  if(!dgPlanet(id))return renderPlanetPick();
  // one question per relation first (so the quiz covers the sheet's sections), then the rest
  const seen=new Set(),first=[],rest=[];
  shuffle(learnPlanetCands(id)).forEach(c=>{if(seen.has(c.rel.id))rest.push(c);else{seen.add(c.rel.id);first.push(c);}});
  const q=shuffle(digPick(first.concat(rest),12)).map(c=>({k:'card',id:c.id,type:chooseType(c,['mc','typed'])}));
  newSession('digplanet',q,{planet:id});
}
const PGROUPS=DB.rows('planet_kinds').map(k=>[k.id,k.name]);   // the kinds of body and their headings (tab Planet kinds)

/* =====================================================================
   Learning paths: a registry
   ---------------------------------------------------------------------
   A learning path is a row of stages; each stage is a lesson page and a short quiz drawn only from that lesson. A stage unlocks
   when the one before scored the pass mark (80%) on first answers, or while "Unlock all stages" is on. Every registered path gets,
   with nothing more to write: a wide button in the Learn hub (while its requires() is true), its page (stage list, progress bar,
   best score per stage, the "Unlock all" switch), the lesson pages (‹ › and the ← → keys between them), the stage quiz and its
   result (score, pass or not, what to review, the next stage), Back and Android Back one level at a time, a card on the Progress
   page, and the URL ?path=<id> (&stage=<stage id or number>). Stage quizzes are ordinary Learn quizzes: relation cards asked by
   the question engine (makeCardQ: distractors, never-offer-together rules, Learn-safe prompts and feedback), scored on first
   answers; every answer is graded into the spaced-repetition schedule ("l777quiz.v2") like any other (outside today's allowance of
   new questions, as in every Learn quiz). A path's progress is kept in localStorage 'l777quiz.path.<id>': {v:1, st:{<stage id>:
   {best: %, last: 'YYYY-MM-DD', n: quizzes taken}}, all: unlock all}; Settings → "Reset progress…" clears it with the schedule.

   QuizPaths.registerPath(def) → the path, or null when def is unusable (the reason goes to the console). The same id registered
   again replaces the path. def:
     id         'goetia': a letter, then letters, digits, _ or - (32 at most)
     title      'Learn the Goetia': the heading of the path page; the hub button reads "<title> — a guided path" (or def.hubTitle)
     short      'Goetia': "Learn · Goetia, stage 2" above a stage quiz, "Goetia · guided path" on Progress (default: title)
     icon       html of the hub icon (one glyph), or ()=>html
     blurb      plain text; the hub button says "<blurb> · 9 stages, each a lesson then a quiz · 2 of 9 stages passed"
     intro      html or ()=>html; the path page opens "<intro>: 9 stages, each a short lesson …" (default "A guided path")
     requires   ()=>bool: the path's data is loaded (while false the path is hidden everywhere, and its URL opens the hub)
     stages     [stage, …] in order, at least one
     pass       pass mark in % (default 80)          retryHint  text under a failed stage (default "The lesson holds every answer.")
     clash      the path's rule for questions never asked in the same quiz (see Leak guards; default QuizPaths.guards.leak)
     route      a URL flag that opens the path as well (the dignities path: ?dignities)
   stage:
     id         stable within its path ('ranks'): the best score is saved under it, so never reuse an id for other content
     title      'Ranks and their planets'            sub  one line under the title (optional)
     lesson     ()=>html (or html): the lesson; QuizPaths.lesson.table / sec / p / ol write it in the house style
     items      ()=>[spec, …]: the questions the stage quiz may ask. A spec is
                  {rel:'go.rank', filter:(it,card)=>bool, dir:'f'|'r'}   every card of one relation, optionally only some of its
                                                                         items or one direction: one group (QuizPaths.sel(id,filter,dir))
                  [spec, …]                                              one group of whatever the specs name
                  a card id 'go.rank|9|f', or a card object              loose cards: grouped by their relation
                The quiz takes a question from each group in turn (each group shuffled), so it covers the lesson evenly
     size       questions per quiz (default 10)      types  ['mc','typed'] (the default; typed only where the answer can be typed)
     balance    true: take the questions by kind of answer instead (a drill whose answers are mostly the same, e.g. "peregrine")
     clash      this stage's rule (overrides the path's; false: facts only)
     explain    (it,card)=>html: the explanation after each answer of this stage; null or undefined: the item's own (below)
     refine     {'<relation id>': {fq, rq, near, sim, …}}: how this stage's quiz asks that relation's cards (its prompt, never-offered
                pairs, distractor likeness), e.g. the learner's scan in the prompt; the cards keep their ids, answers, facts and schedule

   Leak guards: a question must never give another one's answer away. In a stage quiz, as in every Learn quiz, prompts are built
   with QuizPaths.bare() true (the relations leave out their hints), and the feedback shows only the fact just asked: the answer's
   hl form (else hb, else h), the item's noteL (else its note, unless that note function carries spoils:true) and no study card.
   Within one quiz:
     facts   it.fx = ['rul:Aries', …]: the facts an item states. Two questions sharing a fact are never in the same quiz. Default
             ['<relation id>|<item key>']: a fact is never asked both ways round. Give fx wherever two relations state one fact from
             different sides ("Which planet rules Aries?" and "Which signs does Mars rule?" both state 'rul:Aries')
     clash   (cardA, cardB)=>true keeps two questions out of the same quiz. Ready-made, reading the prompts as a Learn quiz shows them:
               QuizPaths.guards.leak   (default) about one subject (same it.row, it.tc or subject side), one answer names a
                                       different answer (Jupiter's Atu "X Fortune" / his keywords "Fortune, …"; Bael's decan
                                       "Aries I by day" / "is Bael a day or a night spirit?"); or, about anything, each question
                                       shows the other's answer (the two sides of one fact, asked by two relations)
               QuizPaths.guards.names  stricter (Learn a planet's rule): any answer or prompt naming another question's answer
             false: facts only (the dignities path, whose items all carry fx)
   Never offered together (options, matching) is declared on the relation and its sides, as in the decks (see rel(), distractors()):
     near:(a,b,fwd)=>bool  two items never offered against each other, nor side by side (fwd: the question asks for it.v; undefined in a
                         matching, where both apply); sim:(a,b,fwd)=>number: likeness of a
     distractor (higher: likelier); synth:it=>[number | {sd: side, sc: score}]: made-up options; side.parts: never an option sharing
     a part with the answer ("Earl" beside "Marquis / Earl"); side.avoid: numbers or canonical keys never offered for this answer;
     side.ck: two sides with the same ck are one answer; it.leak true: the subject's title names its value (never a distractor;
     reverse options shown in their h0 form).

   New questions: QuizPaths.addRelations(build). build(ctx) runs at the end of every rebuild of the cards (start-up, and whenever
   Settings rebuild them), so it must build the same relations every time from the loaded data. It calls ctx.rel({…}) once per
   relation, as the decks above do:
     id        unique ('dv.well'); its cards are '<id>|<item key>|f' and '…|r'
     deck      an existing deck ('divination', 'goetia', 'dignities', 'tarot', 'trumps'…): the cards join that deck's Practice, daily
               review and mastery, so what a path teaches comes back for review. A relation with an unknown deck or a taken id,
               or without fq / rq for its dirs, is left out (console error); a builder that throws adds nothing
     name      'Card ↔ well dignified' (shown under "What to review")
     fq(it)    prompt html asking for it.v (forward); rq(it) asking for it.s (reverse); dirs ['f','r'] (default), ['f'] or ['r']
     items     [{key, s, v, row, fx, note, noteL, leak, tc, tcSide, review}]. s and v are sides: ctx.side(text, {h, h0, hb, hl, hf,
               cat, typ, alt, num, match, parts, ck, avoid}) (see side()). Items without text on both sides are dropped; a reverse
               card exists only where one item has the value. note / noteL: ()=>html (noteL: the Learn-safe one). row ('t'+card key,
               'g'+spirit number, 'dp-'+planet id, 'ds-'+sign, a 777 row) shows that study card after answers outside Learn;
               tc + tcSide ('s' or 'v': the card's side) also put the question into Learn a card, under that page's rule
               (revealsCard); review: its label under "What to review" (default: the relation's name); dirs: this item's own
               directions, a subset of the relation's ([] none: it is only ever an option), and it is left out of matchings
     near, sim, synth, pre, rs, list, nomatch, noLP, short: as on the relations above
   ctx carries the builders of the existing relations, so new questions look and behave like the old: rel, side, T (transliterations
   on), bare(); 777 rows: rowS, letS, sephS, attrS, trS, numS, glyphS, pathNumS; Tarot: tcS(card) (a card as a side), tsim (similar
