<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Athanor — Study &amp; Quiz</title>
<style>
:root{--bg:#faf7f0;--card:#fff;--ink:#1a1712;--sub:#6b6357;--acc:#7a5c2e;--line:#e3ddd0;--hit:#fff3c9;--ok:#3d7a4a;--no:#a83a2c;--okbg:#e6f1e7;--nobg:#f7e2de;--onacc:#fff;--onno:#fff}
/* --onacc / --onno: text on filled accent / warning buttons (dark text on the light dark-mode accents keeps ~8:1 contrast) */
@media(prefers-color-scheme:dark){:root{--bg:#14120e;--card:#1e1b15;--ink:#ece5d8;--sub:#9a9184;--acc:#d0a85c;--line:#33302a;--hit:#4a3f1e;--ok:#7fbf8c;--no:#e6796f;--okbg:#1d2e20;--nobg:#3a201b;--onacc:#14120e;--onno:#14120e}}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
h1{font-size:16px;margin:0;flex:1;min-width:0}h1 small{color:var(--sub);font-weight:400}
main{max-width:680px;margin:0 auto;padding:12px 12px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sub{color:var(--sub);font-size:13px}
.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);font-weight:700;margin:2px 0 8px}
.note{background:var(--hit);border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0;line-height:1.45}
.hidden{display:none!important}
button{font:inherit}
.btn{border:1px solid var(--acc);background:var(--acc);color:var(--onacc);border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer;min-height:44px}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.warn{background:var(--no);border-color:var(--no);color:var(--onno)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1 1 auto}
/* home */
.home{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
@media(min-width:540px){.home{grid-template-columns:1fr 1fr}}
.home .wide{grid-column:1/-1}
.big{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;min-height:74px}
.big:disabled{opacity:.55;cursor:default}
.big .ic{width:46px;height:46px;border-radius:12px;background:var(--hit);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex:0 0 auto}
.big b{display:block;font-size:17px;margin-bottom:2px}
.big.primary{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.big.primary .ic{background:var(--acc);color:var(--onacc)}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{flex:1 1 90px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
/* chips & segmented */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:8px 12px;font-size:14px;cursor:pointer;min-height:38px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:9px 16px;cursor:pointer;min-height:40px;font-size:15px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--acc);color:var(--onacc)}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.set:first-of-type{border-top:none}
select{font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-height:40px}
/* switch */
.sw{position:relative;width:44px;height:26px;flex:0 0 auto}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:13px;transition:.15s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.sw input:checked+span{background:var(--acc)}.sw input:checked+span:before{transform:translateX(18px)}
/* question */
.qtop{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--sub);margin:4px 0 6px}
.qtop .grow{flex:1}
.qtop .streak{font-weight:700;color:var(--acc)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);font-weight:700}
.prompt{font-size:19px;line-height:1.4;margin:6px 0 12px}
.prompt b{color:var(--acc)}
.he{font-family:"Noto Sans Hebrew","Noto Serif Hebrew","SBL Hebrew","Ezra SIL","Times New Roman",serif;unicode-bidi:isolate;font-weight:400}
.hg{font-size:1.6em;line-height:1}
.glyph{display:block;text-align:center;font-size:72px;line-height:1.15;margin:8px 0 4px;color:var(--ink)}
.word{display:block;text-align:center;margin:8px 0 2px}
.word .he{font-size:44px;line-height:1.3}
.word .tl{display:block;font-size:14px}
.tl{color:var(--sub);font-style:italic}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:11px 14px;margin:8px 0;cursor:pointer;min-height:54px;font-size:16px;line-height:1.35}
.opt:not(:disabled):hover{border-color:var(--acc)}
.opt:disabled{cursor:default}
.opt .k{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--sub);flex:0 0 auto}
.opt .ot{flex:1;min-width:0}
.opt .ot small{display:block;color:var(--sub);font-size:12px}
.opt.ok,.mi.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no,.mi.no{border-color:var(--no);background:var(--nobg)}
.opt.dim{opacity:.6}
input.ans{width:100%;font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:50px}
input.ans:focus{outline:2px solid var(--acc);outline-offset:1px}
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;border:1px solid var(--line)}
.fb.ok{border-color:var(--ok);background:var(--okbg)}
.fb.no{border-color:var(--no);background:var(--nobg)}
.fb .verdict{font-weight:700;font-size:17px}
.fb.ok .verdict{color:var(--ok)}.fb.no .verdict{color:var(--no)}
.fb .line{margin:4px 0;font-size:15px;line-height:1.45}
.kh{font-size:12px;color:var(--sub);text-align:center;margin-top:8px}
@media(hover:none){.kh{display:none}}
/* swatches */
.swt{display:inline-block;width:18px;height:18px;border-radius:5px;border:1px solid rgba(128,128,128,.6);vertical-align:-4px;margin-right:7px;flex:0 0 auto}
.swt.lg{width:64px;height:64px;border-radius:14px;display:block;margin:8px auto}
/* study card */
.study{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);margin-top:10px}
.study .hd{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.study .badge{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:0 0 auto;border:1px solid rgba(128,128,128,.5)}
.study .badge .he{font-size:28px}
.study .ttl{font-weight:700;font-size:17px}
.kv{display:grid;grid-template-columns:minmax(84px,auto) 1fr;gap:5px 12px;font-size:14px;margin:0;line-height:1.4}
.kv dt{color:var(--sub)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
/* matching */
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mi{border:1px solid var(--line);border-radius:10px;padding:10px;min-height:54px;background:var(--card);color:var(--ink);cursor:pointer;text-align:left;font-size:15px;line-height:1.3}
.mi.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.mi.done{border-color:var(--ok);background:var(--okbg);cursor:default;opacity:.8}
.mi.bad{border-color:var(--no);background:var(--nobg)}
/* ordering */
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:8px;border:1px dashed var(--line);border-radius:10px;margin:8px 0}
.tile{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;min-height:46px;cursor:pointer;font-size:15px;display:flex;align-items:center;gap:6px}
.tile .n{font-size:12px;color:var(--sub);font-weight:700}
.tile.ok{border-color:var(--ok);background:var(--okbg)}.tile.no{border-color:var(--no);background:var(--nobg)}
/* flashcards */
.fc{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.fc .prompt{margin:0}
.fc .back{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);width:100%;font-size:18px}
/* progress */
.mrow{display:grid;grid-template-columns:minmax(110px,1.2fr) 2fr auto;gap:10px;align-items:center;padding:6px 0;font-size:14px;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:none}
.mbar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;display:flex}
.mbar i{display:block;height:100%;background:var(--acc)}
.mbar i.l{opacity:.35}
.chart{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:6px}
.chart .d{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.chart .b{width:100%;max-width:26px;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.chart .b.none{background:var(--line)}
.chart .lb{font-size:10px;color:var(--sub);margin-top:3px;white-space:nowrap}
.tree{display:block;width:100%;max-width:360px;margin:0 auto}
.tree .hot{cursor:pointer}
.legend{display:flex;justify-content:center;gap:10px;font-size:12px;color:var(--sub);margin-top:6px;align-items:center}
.legend i{display:inline-block;width:40px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--line),var(--acc))}
/* learn a row */
.rowgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin:6px 0 10px}
.rb{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 4px;cursor:pointer;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;position:relative;overflow:hidden}
.rb b{font-size:15px}.rb .he{font-size:22px;line-height:1.1}
.rb .mm{position:absolute;left:0;bottom:0;height:4px;background:var(--acc)}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* study pages: back link, and ‹ › to the neighbours (finger-sized) */
.snav{display:flex;align-items:center;gap:8px;margin-top:8px}
.snav .grow{flex:1}
.btn.navb{min-height:44px;min-width:44px;padding:6px 10px;font-size:14px;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mist{border-top:1px solid var(--line);padding:9px 0;font-size:14px;line-height:1.4}
.mist:first-of-type{border-top:none}
.mist .glyph{font-size:30px;display:inline;margin:0 4px}
.mist .word{display:inline}.mist .word .he{font-size:22px}
.mist .swt.lg{display:inline-block;width:22px;height:22px;margin:0 6px 0 0;vertical-align:-5px}
.mist .ok{color:var(--ok)}.mist .no{color:var(--no)}
.mist small{margin-left:.4em;color:var(--sub);font-size:12px}
.mx{color:var(--no);font-weight:700}
.timer{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 10px}
.timer i{display:block;height:100%;background:var(--acc)}
.score{font-size:40px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
/* learn a card (Tarot) */
.cardgrid{grid-template-columns:repeat(auto-fill,minmax(68px,1fr))}
.rb small{display:block;font-size:11px;color:var(--sub);line-height:1.2;text-align:center;margin-top:1px;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word;max-width:100%}
/* the learner's scans: in a picker with any scans every tile gets the same 2:3 slot (empty when that card has none) */
.rb .tslot{display:block;width:40px;aspect-ratio:2/3;border-radius:4px;overflow:hidden;margin:0 auto 4px;background:var(--line);flex:0 0 auto}
.rb .tslot img{display:block;width:100%;height:100%;object-fit:cover}
/* suit stripe on the minor and court tiles, so the suit shows mid-scroll */
.rb.su-wands{box-shadow:inset 0 3px 0 #c0503a}.rb.su-cups{box-shadow:inset 0 3px 0 #3f78b5}
.rb.su-swords{box-shadow:inset 0 3px 0 #c9a227}.rb.su-disks{box-shadow:inset 0 3px 0 #4f8a4a}
.study .thumb{width:48px;height:72px;object-fit:cover;border-radius:6px;flex:0 0 auto;border:1px solid var(--line)}
.scanbtn{border:0;padding:0;background:none;cursor:zoom-in;flex:0 0 auto;border-radius:6px}
.scanbtn .thumb{width:64px;height:96px;display:block}
.scanimg{display:block;max-width:100%;max-height:70vh;margin:4px auto 10px;border-radius:10px;border:1px solid var(--line);cursor:zoom-out}
/* pickers: a sticky jump bar (Tarot) and single-row chips that scroll sideways */
.pbar{position:sticky;top:0;z-index:2;background:var(--card);margin:8px -16px 0;padding:6px 16px;border-bottom:1px solid var(--line)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0;padding-bottom:2px;scrollbar-width:thin}
.chips.scroll .chip{flex:0 0 auto}
.tsec{scroll-margin-top:64px}
.search{width:100%;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:44px;margin-top:8px}
.seal{display:inline-block;width:22px;height:22px;vertical-align:-6px;margin-right:4px;background:var(--acc)}
.kv dd .seal{width:20px;height:20px;vertical-align:-5px}
/* Goetic seals (ink PNGs drawn through a CSS mask); in questions (.os options, .sealq) sealImg crops the rim, whose letters spell the spirit's name */
.sl{display:inline-block;background:var(--acc);vertical-align:middle;flex:0 0 auto}
.sl.os{width:112px;height:112px}
.sealq{display:block;width:190px;height:190px;margin:12px auto 2px}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.optgrid .opt{margin:0;justify-content:center;position:relative;padding:14px 8px 10px;min-height:0}
.optgrid .opt .k{position:absolute;left:8px;top:8px}
.optgrid .opt .ot{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
.optgrid .opt.dim{opacity:.85}
.optgrid .cap{display:block;font-size:13px;line-height:1.25;margin-top:4px;text-align:center}
.sealfb{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;vertical-align:middle}
.sealfb .sl{width:72px;height:72px}
.fb .sl.os{width:56px;height:56px;display:inline-block;margin:2px 6px 2px 0}
.mist .sl.os,.mist .sealq,.mist .sealfb .sl{width:72px;height:72px;display:inline-block;margin:2px 6px 2px 0}
.mist .cap{font-size:13px;color:var(--sub)}
.paper{display:flex;justify-content:center;gap:12px;border-radius:14px;padding:14px;margin:0 0 10px;border:1px solid rgba(128,128,128,.35)}
/* two seals share the paper's width (they must not run past its border on a phone) */
.paper .sl{flex:1 1 0;min-width:0;max-width:170px;height:auto;aspect-ratio:1}
.paper .sl.one{flex:none;width:min(190px,60vw);height:min(190px,60vw);max-width:none}
.rb.spt{min-height:104px;padding:8px 3px 9px;justify-content:flex-start}
.spt .sl{width:40px;height:40px;margin-bottom:3px}
.spt b{font-size:14px}
.spt small.nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.spt small.rk{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.mrow{width:100%;background:none;border:0;border-top:1px solid var(--line);color:inherit;font:inherit;font-size:14px;text-align:left;cursor:pointer}
button.mrow:first-of-type{border-top:none}
.study .badge .sl{width:40px;height:40px}
.big .ic .sl.hubic{width:32px;height:32px}
.pen{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(128,128,128,.6);vertical-align:-2px;margin-right:5px}
/* learning paths (the dignities and the registered ones): lessons (tables scroll inside the card on a narrow phone, never the page),
   the path page and its stages; the planet picker */
.mi small{display:block;color:var(--sub);font-size:12px}
.tscroll{overflow-x:auto;margin:6px 0 4px;-webkit-overflow-scrolling:touch}
.dtab{width:100%;border-collapse:collapse;font-size:13px;line-height:1.35}
.dtab th,.dtab td{border-top:1px solid var(--line);padding:6px 5px;text-align:left;vertical-align:top}
.dtab th{color:var(--sub);font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;border-top:none}
.lp{font-size:14px;line-height:1.5;margin:8px 0}
.lol{font-size:14px;line-height:1.5;margin:6px 0;padding-left:22px}
.lad{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 10px;align-items:center;font-size:14px;margin:10px 0}
.lad .l{text-align:right}.lad .m{text-align:center;padding:4px 10px;border-radius:8px;background:var(--hit)}
.pisg{border-collapse:collapse;font-size:12px;margin:4px auto}
.pisg th,.pisg td{text-align:center;padding:4px 1px;min-width:21px;border:1px solid var(--line);font-weight:700}
.pisg thead th{font-weight:400}
.dst{background:var(--okbg);color:var(--ok)}.dwk{background:var(--nobg);color:var(--no)}
span.dst,span.dwk{border-radius:6px;padding:1px 6px;font-weight:700}
.pisrow{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin:8px 0 2px}
.pisrow span{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:6px;padding:3px 0;font-size:14px;line-height:1.15;min-width:0}
.pisrow small{font-size:10px;font-weight:700}
.dstage{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0 0;cursor:pointer;min-height:64px;font:inherit}
.dstage:disabled{opacity:.5;cursor:default}
.dstage .dn{width:34px;height:34px;border-radius:50%;background:var(--hit);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.dstage.pass .dn{background:var(--acc);color:var(--onacc)}
.dstage .dt{flex:1;min-width:0}.dstage .dt b{display:block;font-size:15px}.dstage .dt .sub{display:block}
.dstage .ds{display:block;font-size:12px;color:var(--acc);margin-top:2px;font-weight:700}.dstage .ds.lock{color:var(--sub);font-weight:400}
.dprog{display:flex;align-items:center;gap:10px;margin:12px 0 4px}.dprog .bar{flex:1;height:8px}
.rb .dgt{font-size:24px;line-height:1.1}
</style></head><body>
<header><h1>ATHANOR · STUDY &amp; QUIZ <small>· spaced repetition for the correspondences</small></h1>
<button id="homeBtn" class="btn ghost sm hidden" onclick="goHome()">Home</button></header>
<main id="app"><div class="card">Loading the tables…</div></main>
<script src="../../data/db/core.js"></script>
<script src="../lib/db.js"></script>
<script src="../lib/store.js"></script>
<script src="../lib/divination.js"></script>
<script src="../lib/decks.js"></script>
<script>
'use strict';
/* =====================================================================
   Athanor — Study & Quiz
   Decks of facts are generated at start-up from ../../data/777.json,
   ../../data/goetia.json and ../../data/dignities.json, and from the content tables (data/db, through
   ../lib/db.js: the core tables of data/db/core.js, and the quiz's own tables loaded at start-up, QTABLES).
   Each fact (a relation item) yields one or two cards (forward / reverse). Cards are scheduled with a Leitner
   system (boxes 0-5) stored in localStorage under "l777quiz.v2".
   ===================================================================== */

/* ---------- small utilities ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function splitHeb(s){const m=String(s||'').match(/^((?:[\u0590-\u05FF]+\s*)+)(.*)$/);return m?{heb:m[1].trim(),lat:m[2].trim()}:{heb:'',lat:String(s||'').trim()};}
// Normalise typed answers: case-, accent- and punctuation-insensitive; a leading article is ignored
function norm(s){return String(s||'').toLowerCase().replace(/æ/g,'ae').replace(/œ/g,'oe').normalize('NFD').replace(/[\u0300-\u036F]/g,'')
  .replace(/^\s*(the|a|an)\s+/,'').replace(/[^a-z0-9]/g,'');}
function lev(a,b){if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){const cur=[i];for(let j=1;j<=b.length;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}

const tolerance=len=>len<=4?0:len<=8?1:2;
const ROMAN={I:1,V:5,X:10,L:50,C:100};
function roman(s){let n=0;for(let i=0;i<s.length;i++){const v=ROMAN[s[i]]||0,w=ROMAN[s[i+1]]||0;n+=v<w?-v:v;}return n;}
// Numbers inside an answer ("Path 11", "XVIII The Moon") must match exactly; only the words get a spelling tolerance.
// In target texts Roman numerals are upper case; in what the learner types any case counts.
const isNumTok=(w,target)=>/^\d+$/.test(w)||(target?/^[IVXLC]+$/:/^[ivxlc]+$/i).test(w);
const numVal=w=>/^\d+$/.test(w)?+w:roman(w.toUpperCase());

// {d: edit distance between the typed text and a target, tol: allowed distance}; d is Infinity when the numbers differ
function tdist(input,target){
  const tw=words(target),tn=tw.filter(w=>isNumTok(w,true));
  if(!tn.length){const b=norm(target);return{d:lev(norm(input),b),tol:tolerance(b.length)};}
  const iw=words(input),inn=iw.filter(w=>isNumTok(w,false));
  if(inn.map(numVal).join()!==tn.map(numVal).join())return{d:Infinity,tol:0};
  const a=norm(iw.filter(w=>!isNumTok(w,false)).join(' ')),b=norm(tw.filter(w=>!isNumTok(w,true)).join(' '));
  return{d:lev(a,b),tol:b?tolerance(b.length):0};
}

function sanitize(o){
  const out=defaults(); if(!o||typeof o!=='object'||o.v!==2)return out;
  const isNum=x=>typeof x==='number'&&isFinite(x), deckIds=DECKS.map(d=>d.id), typeIds=TYPES.map(t=>t[0]);
  const arr=(a,ok,def)=>Array.isArray(a)?uniq(a.filter(x=>ok.includes(x))):def;
  if(o.cards&&typeof o.cards==='object')for(const k in o.cards){const c=o.cards[k];
    if(c&&isNum(c.b)&&isNum(c.d))out.cards[k]={b:Math.max(0,Math.min(5,Math.round(c.b))),d:Math.round(c.d),n:isNum(c.n)?c.n:0,k:isNum(c.k)?c.k:0};}
  if(o.newDay&&isNum(o.newDay.d)&&isNum(o.newDay.n))out.newDay={d:o.newDay.d,n:o.newDay.n};
  const s=o.stats||{};
  ['total','correct','speedBest','bestStreak'].forEach(k=>{if(isNum(s[k]))out.stats[k]=s[k];});
  if(s.days&&typeof s.days==='object')for(const k in s.days){const v=s.days[k];if(Array.isArray(v)&&isNum(v[0])&&isNum(v[1]))out.stats.days[k]=[v[0],v[1]];}
  const t=o.set||{};
  if(isNum(t.newPerDay))out.set.newPerDay=Math.max(0,Math.min(100,Math.round(t.newPerDay)));
  out.set.daily=arr(t.daily,deckIds,out.set.daily);   // may be empty: the learner can switch the daily review off deck by deck
  // a deck added since the last visit (e.g. Tarot) joins the daily review only when every deck the learner knew was in it
  const known=Array.isArray(t.known)?t.known.filter(x=>deckIds.includes(x)):DECKS_V1;
  const added=deckIds.filter(id=>!known.includes(id));
  if(added.length&&Array.isArray(t.daily)&&known.every(id=>out.set.daily.includes(id)))out.set.daily=uniq([...out.set.daily,...added]);
  out.set.known=deckIds.slice();
  out.set.types=arr(t.types,typeIds,out.set.types);
  if(!out.set.types.includes('mc')&&!out.set.types.includes('typed'))out.set.types.push('mc');
  if(typeof t.translit==='boolean')out.set.translit=t.translit;
  if(typeof t.finals==='boolean')out.set.finals=t.finals;
  if(t.system==='gd'||t.system==='thoth')out.set.system=t.system;

  if([10,20,40].includes(p.len))out.practice.len=p.len;
  return out;
}

// Clean a 777 cell for display; '' when empty, too long or broken across rows in the digitised table
function clean(s){
  if(s==null)return '';
  s=String(s);
  if(/^[\s”"″〃]*$/.test(s))return '';                                               // empty, or a bare ditto mark
  if((s.match(/\[\[/g)||[]).length!==(s.match(/\]\]/g)||[]).length)return '';       // spills into a neighbouring row
  s=s.replace(/\[\[[\s\S]*?\]\]/g,' ');                                              // editorial additions
  if((s.match(/\(/g)||[]).length!==(s.match(/\)/g)||[]).length)return '';
  // single brackets belong to the source: keep the words, drop the brackets
  // ("Isis [as Virgin]" → "Isis (as Virgin)", "[Athena] Ganymede" → "Athena, Ganymede", "Jupiter, [Pluto]" → "Jupiter, Pluto")
  if((s.match(/\[/g)||[]).length===(s.match(/\]/g)||[]).length)
    s=s.replace(/\[([^\[\]]+)\]\s+(?=[A-Z])/g,'$1, ').replace(/([A-Za-zÀ-ɏ.]) \[([^\[\]]+)\]/g,'$1 ($2)');
  s=s.replace(/[\[\]]/g,'').replace(/[\u{1F701}-\u{1F704}]/gu,c=>ALCH[c]||c).replace(/\bof △/g,'of Fire').replace(/\bof ▽/g,'of Water')
    .replace(/♄ian\b/g,'Saturnian');   // "(also ♄ian Perfumes)", col. XLII row 26
  s=s.replace(/^\s*\*\s*/,'').replace(/\*+\s*$/,'').replace(/\*/g,'').replace(/[”″〃]/g,'')
    .replace(/([œæŒÆ]) (?=[a-z])/g,'$1').replace(/([a-z])- ([a-z])/g,'$1$2').replace(/\bof([A-Z])/g,'of $1').replace(/& c\./g,'&c.')
    .replace(/\s+/g,' ').replace(/\s+([,.;:)])/g,'$1').replace(/\(\s+/g,'(').replace(/,(\s*,)+/g,',').replace(/\(\)/g,'')
    .trim().replace(/^[,;]\s*/,'');
  if(/[,;&–-]$/.test(s)||/\b(of|the|and|or|all|by|a|an|to)$/i.test(s))return '';   // cut off mid-phrase
  if(/\.$/.test(s)&&!/&c\.$/.test(s))s=s.slice(0,-1);
  return s.length>70?'':s;
}

  const c=COL[su.minc],raw=String((c&&c.cells&&c.cells[String(n)])||'');   // row n = card n (row 1 = Ace), as in Liber 777
  const s=raw.replace(/\[[^\]]*\]/g,'').replace(/\*/g,'').replace(/^[^A-Za-z]*(?:in\b)?[^A-Za-z]*/,'').replace(/^The Lord of\s+/i,'').replace(/\s+/g,' ').trim();
  return /^[A-Z][A-Za-z ]+$/.test(s)?s:'';
}
// the court's titles in 777 cols. LXXI–LXXIV, without the zodiac span that follows them
function court777(c){
  // the court's row in 777: the row of its element (tab Key scale), e.g. the Knight's Fire 31
  const CK=Object.fromEntries(DB.rows('court_ranks').map(r=>[r.id,DB.rev('keyscale','element',r.element)[0].id])),col=COL[c.suit.col];
  // cut the dominion first: split on sentences, "… round N. Pole" would leave a stray "Pole"
  const raw=String((col&&col.cells&&col.cells[CK[c.rank.k]])||'').replace(/\s*(Rules\b|\d+°)[\s\S]*$/,'');
  return raw.split(/\.\s+/).map(x=>x.trim().replace(/\.$/,'')).filter(x=>x&&!/^(Rules|\d+°)/.test(x)).join('. ');
}
