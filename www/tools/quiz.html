const PATHS=[],PATH={},PSTATE={};   // registered paths in order; by id; their saved progress (read on first use)
let PCUR=null;                      // the path of the page on screen (STUDY: the stage number of a lesson page)
const PATH_ID=/^[A-Za-z][A-Za-z0-9_-]{0,31}$/,STAGE_ID=/^[A-Za-z0-9_.-]{1,40}$/;
const pathOn=P=>{try{return !!(P&&P.requires());}catch(e){return false;}};
const pathVal=(v,d)=>{try{v=typeof v==='function'?v():v;}catch(e){v=null;}return v==null||v===''?d:v;};   // a value, or a function giving it
const stagesN=N=>`${N} stage${N===1?'':'s'}`;
function registerPath(def){
  const no=m=>{console.error('registerPath: '+m);return null;};
  if(!def||typeof def!=='object')return no('no definition');
  const id=String(def.id||'');if(!PATH_ID.test(id))return no(`bad id "${id}"`);
  if(!def.title)return no(id+': no title');
  if(!Array.isArray(def.stages)||!def.stages.length)return no(id+': no stages');
  const seen=new Set(),stages=[];
  for(const s of def.stages){
    const sid=String(s&&s.id||'');
    if(!STAGE_ID.test(sid)||seen.has(sid))return no(`${id}: bad or repeated stage id "${sid}"`);
    if(!s.title||typeof s.items!=='function'||!['function','string'].includes(typeof s.lesson))return no(`${id}/${sid}: a stage needs a title, a lesson and items()`);
    seen.add(sid);stages.push(Object.assign({},s,{id:sid,size:Math.max(1,Math.min(40,Math.round(+s.size)||10))}));
  }
  const P=Object.assign({},def,{id,stages,short:def.short||def.title,hubTitle:def.hubTitle||def.title+' — a guided path',
    pass:Math.max(1,Math.min(100,Math.round(+def.pass)||80)),requires:typeof def.requires==='function'?def.requires:()=>true});
  const again=!!PATH[id];PATH[id]=P;delete PSTATE[id];
  if(again)PATHS[PATHS.findIndex(x=>x.id===id)]=P;
  else{PATHS.push(P);
    // its button in the Learn hub, after the other entries (read from PATH at each drawing: a path registered again shows its new form)
    LEARN.push({id:'path-'+id,cls:'wide',ic:()=>String(pathVal(PATH[id].icon,'')),get name(){return PATH[id].hubTitle;},
      sub:()=>`${pathVal(PATH[id].blurb,PATH[id].short)} · ${stagesN(PATH[id].stages.length)}, each a lesson then a quiz`,
      open:()=>openPath(id),ok:()=>pathOn(PATH[id]),statT:()=>`${pathDone(PATH[id])} of ${stagesN(PATH[id].stages.length)} passed`});}
  return P;
}

/* --- saved progress --- */
const pathKey=P=>'l777quiz.path.'+P.id;
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
// a saved state checked field by field (null when absent or not ours); sid(key) → the stage id a saved key stands for, or null
function pathParse(raw,sid){
  let o=null;try{o=JSON.parse(raw||'null');}catch(e){o=null;}
  if(!o||typeof o!=='object'||o.v!==1)return null;
  const out={v:1,st:{},all:o.all===true},num=x=>typeof x==='number'&&isFinite(x);
  if(o.st&&typeof o.st==='object')for(const k in o.st){const x=o.st[k],id=sid(k);
    if(id&&x&&num(x.best))out.st[id]={best:Math.max(0,Math.min(100,Math.round(x.best))),last:typeof x.last==='string'?x.last.slice(0,10):'',n:num(x.n)?x.n:0};}
  return out;
}
// legacyKey: an older key of the same path, its stages numbered 1, 2, 3… (the dignities path before the registry: 'l777quiz.digpath').
// It is still read: its scores are merged in (the better one counts), and its "unlock all" until the path has a key of its own
function pathLoad(P){
  const cur=pathParse(lsGet(pathKey(P)),k=>STAGE_ID.test(k)?k:null),S=cur||{v:1,st:{},all:false};
  const old=P.legacyKey?pathParse(lsGet(P.legacyKey),k=>/^\d{1,2}$/.test(k)&&P.stages[+k-1]?P.stages[+k-1].id:null):null;
  if(old){
    if(!cur)S.all=old.all;
    for(const id in old.st){const a=S.st[id],b=old.st[id];
      S.st[id]=a?{best:Math.max(a.best,b.best),last:a.last>b.last?a.last:b.last,n:Math.max(a.n,b.n)}:b;}
  }

}
const pathState=P=>PSTATE[P.id]||(PSTATE[P.id]=pathLoad(P));
function pathSave(P){try{localStorage.setItem(pathKey(P),JSON.stringify(pathState(P)));}catch(e){}}

const pathRec=(P,k)=>{const st=P.stages[k-1];return st&&pathState(P).st[st.id]||null;};
const pathPassed=(P,k)=>{const o=pathRec(P,k);return !!o&&o.best>=P.pass;};
const pathUnlocked=(P,k)=>k<=1||pathState(P).all||pathPassed(P,k-1);

function setPathAll(pid,on){const P=PATH[pid];if(!P)return;pathState(P).all=!!on;pathSave(P);openPath(pid);}

/* --- the stage quiz --- */
const factsOf=c=>c.it.fx||[c.rel.id+'|'+c.it.key];
// What a question shows and asks, for the guards: its prompt as a Learn quiz shows it (tags stripped), its answer's texts, the names
// that stand for its answer (3+ letters) and its canonical key. Kept per card (the cards are new objects after every rebuild)
const QINFO=new WeakMap();
function qinfo(c){
  let o=QINFO.get(c);if(o)return o;
  const a=ansOf(c);let p='';BARE=true;
  try{p=c.dir==='f'?c.rel.fq(c.it):c.rel.rq(c.it);}catch(e){p='';}finally{BARE=false;}
  o={k:ckey(a),t:[a.t,...(a.alt||[])].map(String),ids:uniq([a.t,...(a.alt||[]),...(a.parts||[])].map(String)).filter(x=>norm(x).length>=3),
    q:String(p).replace(/<[^>]*>/g,' ').replace(/&(?:#\d+|[a-z]+);/gi,' ')};
  QINFO.set(c,o);return o;
}
// two questions about one subject: the same study row, Tarot card or subject side (Jupiter's Atu and Jupiter's keywords)
const sameSubj=(a,b)=>!!(a.it.row&&a.it.row===b.it.row)||!!(a.it.tc&&a.it.tc===b.it.tc)||ckey(a.it.s)===ckey(b.it.s);
const GUARDS={
  // (an answer naming another counts within one subject only: "Aries I by day" gives away that Bael is a day spirit, not Paimon)
  leak:(a,b)=>{const A=qinfo(a),B=qinfo(b);
    return (A.k!==B.k&&sameSubj(a,b)&&(namesAny(A.t,B.ids)||namesAny(B.t,A.ids)))||(namesAny([A.q],B.ids)&&namesAny([B.q],A.ids));},
  names:(a,b)=>{const A=qinfo(a),B=qinfo(b);return namesAny(A.t,B.ids)||namesAny(B.t,A.ids)||namesAny([A.q],B.ids)||namesAny([B.q],A.ids);}};
// the stage's questions as groups of cards (see items above); a spec that names no card gives none, and items() that throws gives no groups
function stageGroups(st){
  const isSel=x=>!!x&&typeof x==='object'&&!Array.isArray(x)&&typeof x.rel==='string';
  const one=x=>typeof x==='string'?CARD[x]||null:x&&x.id&&CARD[x.id]===x?x:null;
  const expand=x=>Array.isArray(x)?x.flatMap(expand)
    :isSel(x)?CARDS.filter(c=>c.rel.id===x.rel&&(!x.dir||c.dir===x.dir)&&(!x.filter||x.filter(c.it,c))):[one(x)].filter(Boolean);
  try{
    const groups=[],loose={};
    (st.items()||[]).forEach(x=>{if(Array.isArray(x)||isSel(x))groups.push(uniq(expand(x)));
      else{const c=one(x);if(c)(loose[c.rel.id]=loose[c.rel.id]||[]).push(c);}});
    return groups.concat(Object.values(loose)).map(g=>shuffle(g.slice()));
  }catch(e){console.error(`learning path stage "${st.id}":`,e);return[];}
}
// A stage's quiz: its groups taken in turn (each shuffled; with balance, the kinds of answer), never two questions that share a
// fact (fx) or that the clash rule keeps apart, then shuffled
function pathQueue(P,k){
  const st=P.stages[k-1];if(!st)return[];
  let groups=stageGroups(st);
  if(st.balance){const by={};groups.flat().forEach(c=>{const a=ckey(ansOf(c));(by[a]=by[a]||[]).push(c);});groups=Object.values(by);}
  groups=shuffle(groups.filter(g=>g.length));
  const rule=st.clash!==undefined?st.clash:P.clash!==undefined?P.clash:GUARDS.leak;
  const clash=typeof rule==='function'?(a,b)=>{try{return !!rule(a,b);}catch(e){return true;}}:null;
  const N=st.size,out=[],fx=new Set();let gi=0;

    const g=groups[gi++%groups.length];if(!g.length)continue;
    const c=g.shift(),f=factsOf(c);if(f.some(x=>fx.has(x)))continue;
    if(clash&&out.some(o=>clash(c,o)))continue;

function startPathStage(pid,k){
  k=+k;const P=PATH[pid],st=P&&P.stages[k-1];if(!st||!pathOn(P))return openPath(pid);
  if(!pathUnlocked(P,k))return openPath(pid,k);
  const cs=pathQueue(P,k);if(!cs.length)return openPathStage(pid,k);
  const types=Array.isArray(st.types)&&st.types.length?st.types:['mc','typed'];
  newSession('path',cs.map(c=>({k:'card',id:c.id,type:chooseType(c,types)})),{path:pid,stage:k,qids:cs.map(c=>c.id),first:{}});

// the share of the stage's questions answered right the first time (a question put back after a miss does not count again)
function pathScore(s){const n=(s.qids||[]).length;return n?pct(s.qids.filter(id=>s.first&&s.first[id]===true).length,n):0;}

}
// after each answer: the stage's own explanation, when it gives one (see explain above)
function pathExplain(c){
  const s=SES,P=s&&s.mode==='path'&&PATH[s.path],st=P&&P.stages[s.stage-1];

}
// before each question of a stage quiz: the card as the stage asks it. stage.refine[relation id] = {fq, rq, near, sim, …} replaces
// those fields of the relation for this question only; the card keeps its id, answer, facts and schedule (see refine above)
function pathCard(c){
  const s=SES,P=s&&s.mode==='path'&&PATH[s.path],st=P&&P.stages[s.stage-1],o=st&&st.refine&&c&&c.rel&&st.refine[c.rel.id];

function pathResultHtml(s){
  const P=PATH[s.path],k=s.stage,st=P&&P.stages[k-1];if(!st)return '';
  const qs=s.qids||[],sc=s.score!=null?s.score:pathScore(s),n=qs.length,right=qs.filter(id=>s.first&&s.first[id]===true).length,pass=sc>=P.pass,nx=P.stages[k];

  const o=pathRec(P,k),best=o?o.best:sc;
  return `<div class="card"><div class="sec">Stage ${k} · ${esc(st.title)}</div><div class="score">${sc}%</div>`
    +`<div class="sub" style="text-align:center">${right} of ${n} right the first time · pass mark ${P.pass}% · best ${best}%</div>`
    +`<div class="note">${pass?(nx?`Passed. Stage ${k+1}, <b>${esc(nx.title)}</b>, is open.`:'Passed — that completes the path.')

/* --- the path page and the lesson pages --- */
function openPath(pid,focus){

  const rows=P.stages.map((st,i)=>{const k=i+1,o=S.st[st.id],un=pathUnlocked(P,k),pass=pathPassed(P,k);
    const stat=!un?`Score ${P.pass}% in stage ${k-1} to unlock`:o?`Best ${o.best}%${o.last?' · '+o.last:''}${pass?' · passed':''}`:'Not taken yet';
    return `<button class="dstage${pass?' pass':''}" id="dst-${k}" onclick="openPathStage('${P.id}',${k})"${un?'':' disabled'} aria-label="Stage ${k}: ${esc(st.title)}. ${esc(stat)}">`
      +`<span class="dn">${pass?'✓':k}</span><span class="dt"><b>${k} · ${esc(st.title)}</b>${st.sub?`<span class="sub">${esc(st.sub)}</span>`:''}<span class="ds${un?'':' lock'}">${esc(stat)}</span></span></button>`;}).join('');
  $('#app').innerHTML=`<div class="card"><div class="row">${hubBack}<div class="sec" style="flex:1;margin:0">${esc(P.title)}</div></div>

    <div class="dprog"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${N}" aria-valuenow="${done}" aria-label="Stages passed"><i style="width:${pct(done,N)}%"></i></div><span class="sub">${done} of ${N} passed</span></div>

function openPathStage(pid,k){

    <div class="btns"><button class="btn" onclick="startPathStage('${P.id}',${k})"${n?'':' disabled'}>Start the stage quiz</button><button class="btn ghost" onclick="openPath('${P.id}',${k})">The path</button></div>
    <div class="sub" style="margin-top:8px">${n} questions drawn only from this lesson. Score ${P.pass}% to ${k<N?`unlock stage ${k+1}`:'complete the path'}.${o?` Best so far: ${o.best}% (${esc(o.last)}).`:''} ${allowanceNote()}</div></div>`;
  window.scrollTo(0,0);

// Progress page: one card per path (best score per stage; a stage opens its lesson, a locked one the path)
function pathsProgress(){

    const rows=P.stages.map((st,i)=>{const k=i+1,o=S.st[st.id],b=o?o.best:0,un=pathUnlocked(P,k);

/* --- lessons in the house style (QuizPaths.lesson): a table that scrolls inside the card on a narrow phone (never the page), a

/* --- relations added by the path modules (addRelations), and the modules' start (onReady) --- */
const XRELS=[],XNEAR=[],READYQ=[];let PHASE=0,XDIRTY=false;   // PHASE 0: loading · 1: running the onReady callbacks · 2: open
function addRelations(fn){

// addNear(relation id, fn(a, b, fwd) → true): two items of an existing relation that a module knows to be near-twins, never offered

function nearOn(r,fn){const n0=r.near;r.near=(a,b,f)=>{if(n0&&n0(a,b,f))return true;try{return !!fn(a,b,f);}catch(e){return false;}};}

// runs at the end of buildRels: each module's relations, checked as described above; then the modules' near-twins (addNear)
function buildXRels(){

}
function addXRels(){
  if(!XRELS.length)return;

  XRELS.forEach(fn=>{

    try{fn(ctx);}catch(e){console.error('addRelations:',e);RELS.length=n0;return;}
    RELS.splice(n0).forEach(r=>{
      const why=!r.id||ids.has(r.id)?'its id is missing or taken':!decks.has(r.deck)?`there is no deck "${r.deck}"`
        :r.dirs.some(d=>typeof r[d==='r'?'rq':'fq']!=='function')?'no fq / rq for its dirs':'';

function callReady(fn){
  try{const r=fn(window.QuizPaths);return r&&typeof r.then==='function'?Promise.resolve(r).catch(e=>console.error('QuizPaths.onReady:',e)):null;}

registerPath({id:'dignities',title:'Learn the dignities',short:'Dignities',icon:'♄︎',blurb:'Planetary dignities',route:'dignities',

    // balance: questions taken in turn from each kind of answer (most pairs are peregrine; the drill should not be)

/* ---------- the lessons (built from dignities.json; the teaching aids are checked against it where they state a fact) ---------- */
const ltabP=CL=>CL.map(p=>`${dgG(p.glyph)}&nbsp;${esc(p.planet)}`).join(' → ');
function lesPlanets(){
  const CL=DGCL,grp=f=>{const g={},o=[];CL.forEach(p=>{const v=p[f];if(!v)return;if(!g[v]){g[v]=[];o.push(v);}g[v].push(p.planet);});return o.map(v=>`<b>${esc(v)}</b>: ${esc(g[v].join(', '))}`).join(' · ');};
  const mo=DGP.Moon,su=DGP.Sun,pi=DGS.Pisces;
  return lp(`The sheet lists the seven classical planets in the <b>Chaldean order</b>, the traditional order of the spheres, slowest first: ${ltabP(CL)}.`)
    +dtab(['Planet · Atu','Nature · temperament','Sect · principle'],CL.map(p=>[`${dgPl(p)}<br><span class="sub">${dgAtuH(p)}</span>`,`${esc(p.nature)}<br><span class="sub">${esc(p.temperament)}</span>`,`${esc(p.sect)}<br><span class="sub">${esc(p.principle)}</span>`]))
    +lsec('Three ways to group them')
    +lp(`<b>Nature</b> — ${grp('nature')}.`)+lp(`<b>Sect / gender</b> — ${grp('sect')}.`)+lp(`<b>Temperament</b> — ${grp('temperament')}.`)
    +lsec('Their Atus')
    +lp(`Each planet is a Thoth Atu, the trump of its Hebrew double letter.`+(mo&&su&&pi&&mo.card&&pi.card?` Mind the titles: ${dgAtuH(pi)} is the sign ${esc(pi.sign)} — the planet Moon's card is ${dgAtuH(mo)}; ${dgAtuH(su)} is the Sun's own card.`:''));
}
function lesRulers(){
  const Lf=[3,2,1,0,11,10],Rt=[4,5,6,7,8,9],R=dgRules();
  const lad=Lf.map((li,i)=>{const a=DGS[SIGNS[li]],b=DGS[SIGNS[Rt[i]]];
    return `<span class="l">${dgSg(a.sign)}</span><span class="m">${a.ruler===b.ruler?dgPn(a.ruler):dgPn(a.ruler)+' · '+dgPn(b.ruler)}</span><span>${dgSg(b.sign)}</span>`;}).join('');
  return lp(`A planet's <b>domicile</b> is the sign it rules. ${dgKeyL('Domicile')}`)
    +`<div class="lad" role="list" aria-label="The rulers, from the lights outward">${lad}</div>`
    +lp(`Read it from the top. The two lights hold the signs of high summer: the Moon Cancer, the Sun Leo. Going out from them one sign at a time on either side, the other five follow in the order of their spheres going out from the Moon — Mercury, Venus, Mars, Jupiter, Saturn (the Chaldean order read upward) — each taking one sign on each side. So Saturn, the farthest, ends with Capricorn and Aquarius, the two signs opposite the lights.`)
    +lsec('The twelve zodiacal Atus and their rulers')
    +dtab(['Zodiacal Atu','Sign','Ruler'],SIGNS.map(s=>{const o=DGS[s];return[`${dgAtuH(o)}<br><span class="sub">“${esc(o.note)}”</span>`,dgSg(s),dgPn(o.ruler)];}))
    +lp(`<span class="sub">The reading notes are written from each sign's ruler and exaltation (stage 3). ${esc(R.modern)}</span>`);
}
function lesExalt(){
  const R=dgRules(),EX=DGPL.filter(p=>p.exaltation),none=SIGNS.filter(s=>!DGS[s].exalted),nodes=DGPL.filter(p=>p.kind==='node'&&p.exaltation);
  return lp(`${dgKeyL('Exaltation')} Each of the seven has one sign of exaltation, and so has each of the two lunar nodes.`)
    +dtab(['Planet','Exalted in (Atu)'],EX.map(p=>[dgPl(p),esc(dgQL(p,'exaltedIn'))]))
    +lsec('Signs without an exaltation')
    +lp(`${none.map(dgSg).join(', ')}. ${esc(R.noEx)}`)
    +(DGS.Leo&&!DGS.Leo.exalted?lp(`<span class="sub">Leo's reading note: “${esc(DGS.Leo.note)}”</span>`):'')
    +(nodes.length?lsec('The nodes')+lp(`${esc(R.nodes)} ${nodes.map(p=>`${dgPl(p)} in ${dgSg(p.exaltation)}`).join('; ')} — opposite signs.`):'')
    +(DGS.Virgo?lp(`${dgSg('Virgo')}: “${esc(DGS.Virgo.note)}”.`):'');
}
function lesDet(){
  const R=dgRules();
  const pairs=SIGNS.slice(0,6).map(a=>{const A=DGS[a],B=DGS[A.opposite];if(!B)return null;
    return[`${dgSg(a)}<br><span class="sub">ruled by ${esc(A.ruler)}</span>`,`${dgSg(B.sign)}<br><span class="sub">ruled by ${esc(B.ruler)}</span>`,`${dgPn(B.ruler)} in ${esc(a)}<br>${dgPn(A.ruler)} in ${esc(B.sign)}`];}).filter(Boolean);
  const one=DGCL.filter(p=>(p.domicile||[]).length===1).map(p=>p.planet);
  return lp(`<b>${esc(R.det)}.</b> ${dgKeyL('Detriment')}`)
    +lp(`Opposite signs lie six signs apart. Wherever a planet rules, the sign across the zodiac is its detriment.`)
    +dtab(['Sign','Opposite','In detriment'],pairs)
    +lsec('Planet → detriment')
    +dtab(['Planet','Rules','Detriment in (Atu)'],DGCL.map(p=>[dgPl(p),esc((p.domicile||[]).join(', ')),esc(dgQL(p,'detrimentIn'))]))
    +lp(`Because the rulers mirror each other across the zodiac (the ladder of stage 2), each planet's detriment is its own pair of signs read across: Saturn, which rules the two signs opposite the lights, is in detriment in the lights' signs, ${esc((DGP.Saturn&&DGP.Saturn.detriment||[]).join(' and '))}; ${esc(listAnd(one))}, with one sign each, have one detriment each.`);
}

function lesPis(){

    +`<div class="sub">R ruler (domicile) · E exaltation · D detriment · F fall · empty: peregrine. Green strengthens, red weakens.</div>`

/* ---------- progress ---------- */

function treeSvg(){

  LET.forEach(p=>{const a=S(p.ends[0]),b=S(p.ends[1]),m=rowMastery(p.key),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    s+=`<g class="hot" onclick="openLearn('${p.key}')"><title>Path ${p.key} · ${esc(p.name)}: ${Math.round(m*100)}%</title>`
      // wide invisible line: a finger-sized tap target on a phone (the spheres are drawn on top and keep their own taps)
      +`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="transparent" stroke-width="28" pointer-events="stroke"/>`
      +`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--line)" stroke-width="13" stroke-linecap="round"/>`
      +`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--acc)" stroke-opacity="${c(m)}" stroke-width="8" stroke-linecap="round"/>`

      +`<text x="${mx}" y="${my+4.5}" text-anchor="middle" font-size="13" fill="var(--ink)" lang="he">${esc(p.glyph)}</text></g>`;});
  SEPH.forEach(q=>{const m=rowMastery(q.key),ink=m>.55?'var(--card)':'var(--ink)';

      +`<circle cx="${q.x}" cy="${q.y}" r="26" fill="var(--card)" stroke="var(--acc)" stroke-width="2"/>`
      +`<circle cx="${q.x}" cy="${q.y}" r="26" fill="var(--acc)" fill-opacity="${m.toFixed(2)}"/>`
      +`<text x="${q.x}" y="${q.y+2}" text-anchor="middle" font-size="16" font-weight="700" fill="${ink}">${q.n}</text>`
      +`<text x="${q.x}" y="${q.y+15}" text-anchor="middle" font-size="9.5" fill="${ink}">${esc(q.name)}</text></g>`;});

function renderProgress(){

  const t=today(),D14=[];let n14=0,c14=0;
  for(let d=t-13;d<=t;d++){const v=ST.stats.days[d]||[0,0];n14+=v[0];c14+=v[1];D14.push({d,v});}
  const bars=D14.map(({d,v})=>{const acc=v[0]?v[1]/v[0]:null;
    return `<div class="d" title="${dayLabel(d)}: ${v[0]?`${v[1]} of ${v[0]} right`:'no answers'}"><div class="b${acc==null?' none':''}" style="height:${acc==null?2:Math.max(4,Math.round(acc*88))}px"></div><span class="lb">${d===t?'today':(t-d)%2===0?dayLabel(d):''}</span></div>`;}).join('');
  const decks=DECKS.map(d=>{const m=mastery(deckCards(d.id));if(!m.n)return '';
    return `<div class="mrow"><span>${esc(d.name)}</span><span class="mbar" title="${m.mc} of ${m.n} questions in box 3 or higher"><i style="width:${(m.m*100).toFixed(1)}%"></i><i class="l" style="width:${(m.l*100).toFixed(1)}%"></i></span><span class="sub">${pctLabel(m.m)}</span></div>`;}).join('');
  $('#app').innerHTML=`<div class="kpis">${kpi('day streak',dayStreak())}${kpi('answered',ST.stats.total)}${kpi('accuracy',ST.stats.total?pct(ST.stats.correct,ST.stats.total)+'%':'—')}${kpi('best streak',ST.stats.bestStreak)}${kpi('speed best',ST.stats.speedBest)}</div>
    <div class="card"><div class="sec">Deck mastery</div>${decks}<div class="sub" style="margin-top:6px">Solid bar: questions in box 3 or higher (reviewed successfully at least three times). Pale bar: questions being learned. (The Tarot and Goetia bars further down measure something else: the average box of each card's or spirit's Learn questions.)</div></div>
    <div class="card"><div class="sec">Last 14 days · accuracy</div><div class="chart">${bars}</div><div class="sub" style="margin-top:6px">${n14?`${pct(c14,n14)}% of ${n14} answers`:'No answers yet in the last two weeks.'}</div></div>
    <div class="card"><div class="sec">Tree of Life · mastery map</div>${treeSvg()}<div class="legend"><span>not studied</span><i></i><span>mastered</span></div><div class="sub" style="text-align:center;margin-top:4px">Tap a sphere or a path to study it.</div></div>`
    +tarotProgress()+goetiaProgress()+pathsProgress();
  window.scrollTo(0,0);
}

/* ---------- settings ---------- */
function renderSettings(msg){
  const entering=SCREEN!=='settings';
  SCREEN='settings';showHomeBtn(true);const S=ST.set;
  if(entering)setTimeout(()=>window.scrollTo(0,0),0);
  const swi=(on,fn)=>`<label class="sw"><input type="checkbox"${on?' checked':''} onchange="${fn}(this.checked)"><span></span></label>`;
  $('#app').innerHTML=(msg?`<div class="note">${msg}</div>`:'')+`<div class="card"><div class="sec">Daily review</div>
    <div class="set"><span>New questions per day</span><select onchange="setNew(+this.value)" aria-label="New questions per day">${[0,5,10,15,20,30,50].map(n=>`<option value="${n}"${n===S.newPerDay?' selected':''}>${n}</option>`).join('')}</select></div>
    <div class="sub" style="margin-top:-4px;padding-bottom:6px">Shared by Practice, Today's review and Flashcards: a new question joins your schedule only while today's allowance lasts. After that it can still be practised and is scheduled on a later day. Learn quizzes and the learning paths schedule every question they ask. The daily review starts with a different deck each day.</div>
    <div class="set" style="display:block"><div>Decks in the daily review</div><div class="chips">${DECKS.map(d=>{const n=deckCards(d.id).length,on=S.daily.includes(d.id);if(d.opt&&!n)return '';
      return `<button class="chip ${on?'on':''}" onclick="toggleDaily('${d.id}')"${n||on?'':' disabled'}>${esc(d.name)}</button>`;}).join('')}</div>
      ${liveDecks(S.daily).length?'':'<div class="sub">No decks selected: Today\'s review will be empty.</div>'}</div>
    <div class="set" style="display:block"><div>Question types</div><div class="chips">${TYPES.map(([id,n])=>`<button class="chip ${S.types.includes(id)?'on':''}" onclick="toggleType('${id}')">${n}</button>`).join('')}</div>
      <div class="sub">Used by the daily review. Matching, ordering and odd one out appear as bonus questions every few cards.</div></div></div>
   <div class="card"><div class="sec">Content</div>
    <div class="set"><span>Show transliterations<br><span class="sub">Hebrew names with their Latin spelling</span></span>${swi(S.translit,'setTranslit')}</div>
    <div class="set"><span>Include final letters<br><span class="sub">Bonus Hebrew cards: ${FINALS.map(f=>he(f[0])+' '+f[2]).join(', ')}</span></span>${swi(S.finals,'setFinals')}</div>
    <div class="set" style="display:block"><div>Attribution of Hé and Tzaddi</div>
      <div class="seg" style="margin-top:8px"><button class="${S.system==='thoth'?'on':''}" onclick="setSystem('thoth')">Thoth (Crowley)</button><button class="${S.system==='gd'?'on':''}" onclick="setSystem('gd')">Golden Dawn</button></div>
      <div class="sub" style="margin-top:6px">Thoth: Hé = XVII The Star (Aquarius), Tzaddi = IV The Emperor (Aries), Lust XI, Adjustment VIII. Golden Dawn and the Liber 777 tables: Hé = IV The Emperor (Aries), Tzaddi = XVII The Star (Aquarius).</div></div></div>
   <div class="card"><div class="sec">Reset</div><div id="resetBox"><button class="btn warn" onclick="askReset()">Reset progress…</button>
    <div class="sub" style="margin-top:6px">Clears every card's schedule, your statistics and the learning paths' scores and unlocked stages. Settings are kept.</div></div></div>`;
}
function setNew(n){ST.set.newPerDay=n;saveState();}
function toggleDaily(id){const a=ST.set.daily,i=a.indexOf(id);if(i>=0)a.splice(i,1);else a.push(id);saveState();renderSettings();}
// the daily review is built from cards, so it keeps multiple choice or typed recall; say so instead of silently refusing
function toggleType(id){const a=ST.set.types,i=a.indexOf(id);let msg='';
  if(i>=0){a.splice(i,1);if(!a.includes('mc')&&!a.includes('typed')){a.push(id);msg='The daily review needs multiple choice or typed recall.';}}
  else a.push(id);
  saveState();renderSettings(msg);}
function setTranslit(on){ST.set.translit=on;saveState();rebuild();}
function setFinals(on){ST.set.finals=on;saveState();rebuild();}
function setSystem(v){ST.set.system=v;saveState();rebuild();renderSettings();}
function askReset(){$('#resetBox').innerHTML=`<div>Erase all progress? This cannot be undone.</div><div class="btns"><button class="btn warn" onclick="doReset()">Yes, erase</button><button class="btn ghost" onclick="renderSettings()">Cancel</button></div>`;}
function doReset(){const d=defaults();ST.cards={};ST.newDay=d.newDay;ST.stats=d.stats;saveState();
  // and the learning paths' scores and unlocks: every path's key (also a path not loaded this time) and the dignities path's old key
  try{Object.keys(localStorage).filter(k=>k.startsWith('l777quiz.path.')).concat(PATHS.map(P=>P.legacyKey).filter(Boolean),'l777quiz.digpath')
    .forEach(k=>localStorage.removeItem(k));}catch(e){}
  for(const id in PSTATE)delete PSTATE[id];
  renderSettings('Progress cleared.');}

/* ---------- keyboard: 1-4 choose, Enter next, Space flips flashcards ---------- */
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.repeat)return;   // a held key must not answer and then skip the feedback straight away
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;
  if(e.key==='Enter'&&tag==='BUTTON')return;   // let the focused button act on its own
  if(SCREEN==='q'&&Q){
    if(!Q.done){
      if(Q.opts&&/^[1-9]$/.test(e.key)){const i=+e.key-1;if(i<Q.opts.length){e.preventDefault();answerMC(i);}}
      else if(e.key==='Enter'&&Q.kind==='order'&&!Q.pool.length){e.preventDefault();checkOrder();}
    }else if(e.key==='Enter'&&SES&&SES.mode!=='speed'){e.preventDefault();nextQ();}
  }else if(SCREEN==='flash'&&SES){
    if(!SES.flipped&&(e.key===' '||e.key==='Enter')){e.preventDefault();flipCard();}
    else if(SES.flipped&&['1','2','3'].includes(e.key)){e.preventDefault();gradeFlash(['again','good','easy'][+e.key-1]);}
  }else if(['learnrow','learncard','learnspirit','digplanet','pathstage'].includes(SCREEN)&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){
    // ‹ › on a row's, a card's, a spirit's or a planet's study page, and between the lessons of a learning path
    const b=document.querySelector(`[data-nav="${e.key==='ArrowLeft'?'prev':'next'}"]`);if(b){e.preventDefault();b.click();}
  }
});

/* ---------- Android Back: the shell asks this page first (window.onBack → true: handled here) ----------
   One level up at a time: a running quiz ends on its summary (or, before the first answer, returns to where it started); a summary
   of a Learn quiz returns to its study page; a study page to its picker; a picker to the Learn hub; any other screen to Home.
   Only Home lets the shell go back to the previous tool. */
function leaveSession(){
  const s=SES;if(!s)return goHome();
  clearTick();SES=null;Q=null;
  if(s.mode==='learn'&&ROW[s.row])return openLearn(s.row);
  if(s.mode==='learncard'&&TC[s.card])return openCard(s.card);
  if(s.mode==='learnspirit'&&spiritByN(s.spirit))return openSpirit(s.spirit);
  if(s.mode==='path'&&PATH[s.path]&&PATH[s.path].stages[s.stage-1])return openPathStage(s.path,s.stage);
  if(s.mode==='digplanet'&&dgPlanet(s.planet))return openPlanet(s.planet);
  if(s.mode==='practice'||s.mode==='speed'||s.mode==='flash')return renderSetup(s.mode);
  goHome();
}
window.onBack=()=>{
  switch(SCREEN){
    case 'home':return false;
    case 'q':case 'flash':if(SES&&SES.answered)finish();else leaveSession();return true;
    case 'sum':leaveSession();return true;
    case 'learnrow':renderLearnPick(STUDY);return true;   // the picker scrolls to the subject just studied
    case 'learncard':renderCardPick(STUDY);return true;
    case 'learnspirit':renderSpiritPick(STUDY);return true;
    case 'pathstage':openPath(PCUR,STUDY);return true;   // a lesson: back to its path, scrolled to the stage
    case 'digplanet':renderPlanetPick(STUDY);return true;
    case 'learn':case 'learncards':case 'learnspirits':case 'path':case 'digplanets':renderLearnHub();return true;
    default:goHome();return true;
  }
};

/* ---------- boot ---------- */
function route(){
  let qs=null;try{qs=new URLSearchParams(location.search);}catch(e){}
  const row=qs&&qs.get('row'),card=qs&&qs.get('card'),spirit=qs&&qs.get('spirit'),planet=qs&&qs.get('planet');
  // ?row=15 opens "Learn a row" (e.g. parent.openTool('quiz','row=15')); ?card=wands-2 or ?card=atu-14 opens "Learn a card";
  // ?spirit=9 opens "Learn a spirit"; ?planet=saturn "Learn a planet"; ?path=dignities a learning path (&stage=2 or &stage=rulers:
  // that stage's lesson, while it is unlocked); a path's route flag (?dignities) the path; ?learn opens the hub
  const pid=qs&&qs.get('path'),stg=qs&&qs.get('stage'),flag=qs&&PATHS.find(P=>P.route&&qs.has(P.route)&&pathOn(P));
  if(row&&ROW[row])openLearn(row);else if(card&&TC[card])openCard(card);
  else if(spirit&&/^\d+$/.test(spirit)&&spiritByN(+spirit))openSpirit(+spirit);
  else if(planet&&DG&&dgPlanet(planet))openPlanet(planet);
  else if(pid&&PATH[pid]&&pathOn(PATH[pid])){const P=PATH[pid],k=!stg?0:/^\d+$/.test(stg)?+stg:P.stages.findIndex(s=>s.id===stg)+1;
    if(P.stages[k-1])openPathStage(pid,k);else openPath(pid);}
  else if(flag)openPath(flag.id);
  // a path that is hidden (its data did not load) or unknown: the hub, where the others are
  else if(qs&&(qs.has('learn')||pid||PATHS.some(P=>P.route&&qs.has(P.route))))renderLearnHub();else renderHome();
}
const getJSON=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u+' ('+r.status+')');return r.json();});
// the learning-path modules below this script register in QuizPaths.onReady: start-up waits for them to be parsed
const domReady=new Promise(r=>{if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>r(),{once:true});else r();});
// divination meanings (incl. the user's own document) must be loaded before the cards are built
// dignities.json is optional too: without it the Dignities deck and its Learn entries are hidden (prepDig)
// the quiz's own content tables (QTABLES), and those of the path modules (PTABLES: optional, see there)
Promise.all([getJSON('../../data/777.json'),getJSON('../../data/goetia.json').catch(()=>null),
  window.Div?Div.ready.catch(()=>null):null,getJSON('../../data/dignities.json').catch(()=>null),domReady,
  DB.load(QTABLES),Promise.all(PTABLES.map(t=>DB.load(t).catch(e=>console.warn(e.message))))]).then(([d,g,,dg])=>{
  D=d;G=g;DG=dg;prepDig();prep();rebuild();
  return runReady();   // the path modules: their paths and relations (a promise while one of them still loads data)
}).then(()=>route()).catch(e=>{$('#app').innerHTML=`<div class="card">Could not load the tables: ${esc(e&&e.message||e)}</div>`;});
</script>
