}
// word overlap of two texts (Jaccard, words of 3+ letters): near-identical descriptions are never offered against each other
const wset=t=>new Set(words(t).map(norm).filter(w=>w.length>2));
function jacc(a,b){const A=wset(a),B=wset(b);let n=0;A.forEach(w=>{if(B.has(w))n++;});return n/((A.size+B.size-n)||1);}

function buildRels(){
  RELS=[];RB={};
  const T=ST.set.translit;
  const tl=s=>T?` <span class="tl">${esc(s)}</span>`:'';
  const glyphBig=g=>`<span class="glyph">${he(g)}</span>`;
  const numS=(n,cat)=>side(String(n),{num:true,cat:cat||'num'});
  const letS=p=>side(p.name,{h:`${esc(p.name)} ${he(p.glyph)}`,cat:'letter',alt:LETTER_ALT[p.name]||[]});
  const glyphS=g=>side(g,{h:he(g,'hg'),cat:'glyph',typ:false});
  const pathNumS=p=>side(p.key,{num:true,cat:'pnum',h:`Path <b>${p.key}</b>`});
  const sephS=s=>side(s.name,{h:`<b>${esc(s.name)}</b> ${he(SEPH_HEB[s.n])}`,cat:'seph',alt:SEPH_ALT[s.name]||[]});
  const attrS=a=>{const ps=attrParts(a);return side(a,{h:esc(symOf(ps[0]))+esc(a),cat:acat(ps[0]),alt:[...ps,...ps.flatMap(x=>ATTR_ALT[x]||[])]});};
  // h0: the numeral alone, for questions whose answer the title would give away ("XIX The Sun" → Sol)
  const trS=key=>{const [num,title]=trumpOf(key);return side(`${num} ${title}`,{h:`<b>${num}</b> ${esc(title)}`,h0:`<b>${num}</b>`,cat:'trump',alt:[title,num,String(roman(num))]});};
  // Tarot card keys for the items of path relations: which trump stands on the path (by the current attribution)
  const atuTag=(key,where)=>{const n=pathAtu(key);return n<0?{}:{tc:'atu-'+n,tcSide:where};};
  // a 777 row as the subject of a question; o.hint===false leaves out the "(sign)" hint
  const rowS=(key,o)=>{const r=ROW[key];
    if(r.kind==='seph'){const h=`<b>${esc(r.name)}</b> <span class="sub">(${r.n})</span>`;return side(r.name,{h,h0:h,cat:'seph',alt:SEPH_ALT[r.name]||[]});}
    // the columns follow the 777 row; under Thoth, rows 15/28 carry the other sign's trump, so the hint says it is 777's
    const h0=`Path <b>${key}</b> · ${esc(r.name)} ${he(r.glyph)}`,hint=(attrOf(key)!==r.attr777?'777: ':'')+r.attr777;
    return side(key,{h:o&&o.hint===false?h0:`${h0} <span class="sub">(${esc(hint)})</span>`,h0,cat:'path',alt:[r.name,'Path '+key,...(LETTER_ALT[r.name]||[])]});};
  // the Thoth / Golden Dawn notes name the trump and the attribution of the row: in a Learn session they would answer its other
  // questions, so they are marked (spoils) and shown there only on the study page
  const sw=key=>Object.assign(()=>swapNote(key),{spoils:true});
  Object.assign(RB,{rowS,letS,sephS,attrS,trS,numS,glyphS,pathNumS});   // (for addRelations)

  /* 1 · Hebrew alphabet */
  const alike=(a,b)=>LOOKALIKE.some(g=>g.includes(a.s.t)&&g.includes(b.s.t))?2.5:0;   // confusable glyphs make better distractors
  rel({id:'heb.glyph',deck:'hebrew',name:'Glyph ↔ letter name',sim:alike,
    fq:it=>`Which letter is this?${glyphBig(it.s.t)}`,rq:it=>`Which glyph is <b>${esc(it.v.t)}</b>?`,
    items:LET.map(p=>({key:p.key,row:p.key,s:glyphS(p.glyph),v:side(p.name,{cat:'lname',alt:LETTER_ALT[p.name]||[]})}))});
  rel({id:'heb.mean',deck:'hebrew',name:'Letter ↔ meaning',
    fq:it=>`What does the letter ${it.s.h} mean?`,rq:it=>`Which letter's name means “${esc(it.v.t)}”?`,
    items:LET.map(p=>({key:p.key,row:p.key,s:letS(p),v:side(p.meaning,{cat:'meaning',alt:MEAN_ALT[p.meaning]||[]})}))});
  rel({id:'heb.value',deck:'hebrew',name:'Letter ↔ number',
    fq:it=>`Numerical value of ${it.s.h}?`,rq:it=>`Which letter has the value <b>${it.v.t}</b>?`,
    items:LET.map(p=>({key:p.key,row:p.key,s:letS(p),v:numS(p.value)}))});
  rel({id:'heb.path',deck:'hebrew',name:'Letter ↔ path number',
    fq:it=>`Which path of the Tree is ${it.s.h}?`,rq:it=>`Which letter is on path <b>${it.v.t}</b>?`,
    items:LET.map(p=>({key:p.key,row:p.key,s:letS(p),v:numS(p.key,'pnum')}))});
  if(ST.set.finals){
    const fnote=f=>`Final ${esc(f[1])} ${he(f[0])} = <b>${f[2]}</b> when finals are counted large; the ordinary ${he(f[4])} = ${LETTER_VAL[+f[3]-11]}.`;
    rel({id:'heb.final',deck:'hebrew',name:'Final form ↔ value',
      fq:it=>`Value of this final form (finals counted large)?${glyphBig(it.s.t)}`,rq:it=>`Which final form counts <b>${it.v.t}</b>?`,
      items:FINALS.map(f=>({key:'f'+f[3],row:f[3],s:glyphS(f[0]),v:numS(f[2]),note:()=>fnote(f)}))});
    rel({id:'heb.finalname',deck:'hebrew',name:'Final form ↔ letter',
      fq:it=>`This is the final form of which letter?${glyphBig(it.s.t)}`,rq:it=>`What is the final form of <b>${esc(it.v.t)}</b>?`,
      items:FINALS.map(f=>({key:'f'+f[3],row:f[3],s:glyphS(f[0]),v:side(f[1],{cat:'lname',alt:LETTER_ALT[f[1]]||[]}),note:()=>fnote(f)}))});
  }

  /* 2 · Tree structure */
  rel({id:'tree.num',deck:'tree',name:'Number ↔ Sephirah',
    fq:it=>`Which Sephirah is number <b>${it.s.t}</b>?`,rq:it=>`What number is ${it.v.h}?`,
    items:SEPH.map(s=>({key:s.key,row:s.key,s:numS(s.n,'snum'),v:sephS(s)}))});
  rel({id:'tree.mean',deck:'tree',name:'Sephirah ↔ meaning',
    fq:it=>`What does ${it.s.h} mean?`,rq:it=>`Which Sephirah is “${esc(it.v.t)}”?`,
    items:SEPH.map(s=>({key:s.key,row:s.key,s:sephS(s),v:side(s.meaning,{cat:'meaning',alt:SEPH_MEAN_ALT[s.n]||[]})}))});
  // "Zodiac / Sphere of Fixed Stars" is shown as "Zodiac / Fixed Stars": the one option saying "Sphere" would answer "planet or sphere?"
  rel({id:'tree.sphere',deck:'tree',name:'Sephirah ↔ planet / sphere',
    fq:it=>`Planet or sphere of ${it.s.h}?`,rq:it=>`Which Sephirah is the sphere of <b>${esc(it.v.t)}</b>?`,
    items:SEPH.map(s=>{const t=String(s.sphere).replace(/\bSphere of (the )?/gi,'').replace(/\s+/g,' ').trim();
      return{key:s.key,row:s.key,s:sephS(s),v:side(t,{h:esc(symOf(t))+esc(t),cat:'sphere',alt:uniq([...(SPHERE_ALT[s.n]||[]),...(t!==s.sphere?[s.sphere]:[])])})};})});
  rel({id:'tree.conn',deck:'tree',name:'Path ↔ the Sephiroth it joins',
    fq:it=>`Path <b>${it.row}</b> (${esc(ROW[it.row].name)} ${he(ROW[it.row].glyph)}) joins which two Sephiroth?`,
    rq:it=>`Which path joins <b>${esc(it.v.a)}</b> and <b>${esc(it.v.b)}</b>?`,
    items:LET.map(p=>{const a=sephName(p.ends[0]),b=sephName(p.ends[1]);
      return{key:p.key,row:p.key,s:side(p.key,{num:true,cat:'pnum',h:`Path <b>${p.key}</b> · ${esc(p.name)} ${he(p.glyph)}`}),
        v:side(`${a} – ${b}`,{cat:'conn',a,b,match:x=>bothNames(x,a,b)})};})});

  /* 3 · Paths & Thoth trumps */
  rel({id:'tr.letter',deck:'trumps',name:'Letter ↔ Atu',
    fq:it=>`Which Atu of the Tarot is attributed to ${it.s.h}?`,rq:it=>`Atu ${it.v.h} belongs to which letter?`,
    items:LET.map(p=>Object.assign({key:sysKey(p.key,SWAP_PATHS),row:p.key,s:letS(p),v:trS(p.key),note:sw(p.key)},atuTag(p.key,'v')))});
  rel({id:'tr.path',deck:'trumps',name:'Path ↔ Atu',
    fq:it=>`Which Atu is on path <b>${it.row}</b>${BARE?'':` <span class="sub">(${esc(connOf(it.row))})</span>`}?`,rq:it=>`Atu ${it.v.h} sits on which path?`,
    // hb: the path without the Sephiroth it joins, for Learn a card (there they answer "which two Sephiroth does the path of Atu … join?")
    items:LET.map(p=>Object.assign({key:sysKey(p.key,SWAP_PATHS),row:p.key,s:side(p.key,{num:true,cat:'pnum',h:`Path <b>${p.key}</b> <span class="sub">${esc(connOf(p.key))}</span>`,hb:`Path <b>${p.key}</b>`}),v:trS(p.key),note:sw(p.key)},atuTag(p.key,'v')))});
  // only three attributions are elements (Air, Water, Fire / Spirit): Earth pads the options, so that no sign or planet is left
  // among them as the odd one out (Spirit only when the answer does not carry it)
  const elemSynth=it=>it.v.cat!=='element'?[]:['Earth','Spirit'].filter(e=>!attrParts(it.v.t).includes(e)).map((e,i)=>({sd:attrS(e),sc:2.9-i*.1}));
  // leak: the trump's title names its own attribution (XIX The Sun → Sol): ask with the numeral alone
  rel({id:'tr.attr',deck:'trumps',name:'Atu ↔ astrological attribution',synth:elemSynth,
    fq:it=>`What is the attribution of Atu ${it.leak?it.s.h0:it.s.h}?`,rq:it=>`Which Atu carries <b>${it.v.h}</b>?`,
    items:LET.map(p=>{const s=trS(p.key),v=attrS(attrOf(p.key));
      return Object.assign({key:sysKey(p.key,SWAP_PATHS),row:p.key,s,v,leak:namesAny([v.t,...v.alt],[trumpOf(p.key)[1]]),note:sw(p.key)},atuTag(p.key,'s'));})});

  /* 4 · Astrology on the Tree */
  const AT=[]; LET.forEach(p=>attrParts(attrOf(p.key)).forEach(a=>AT.push({a,p})));
  rel({id:'as.letter',deck:'astro',name:'Sign / planet / element ↔ letter',
    fq:it=>`Which Hebrew letter is attributed to <b>${it.s.h}</b>?`,rq:it=>`What is the attribution of ${it.v.h}?`,
    items:AT.map(({a,p})=>({key:sysKey(a,SWAP_ATTRS),row:p.key,s:attrS(a),v:letS(p),note:sw(p.key)}))});
  rel({id:'as.path',deck:'astro',name:'Sign / planet / element ↔ path',
    fq:it=>`Which path of the Tree carries <b>${it.s.h}</b>?`,rq:it=>`What is the attribution of path <b>${it.v.t}</b>?`,
    items:AT.map(({a,p})=>({key:sysKey(a,SWAP_ATTRS),row:p.key,s:attrS(a),v:pathNumS(p),note:sw(p.key)}))});
  const CLASS=Object.fromEntries(DB.rows('letter_classes').map(c=>[c.attribution,c.name]));   // (tab Letter classes)
  rel({id:'as.class',deck:'astro',name:'Letter → Mother / Double / Single',dirs:['f'],
    fq:it=>`Is ${it.s.h} a Mother, Double or Single letter?`,
    items:LET.map(p=>{const c=CLASS[acat(attrParts(p.attr777)[0])];return{key:p.key,row:p.key,s:letS(p),v:side(c,{cat:'class',alt:[c.split(' ')[0]]})};})});

  /* 5 · Divine names & hierarchies (Sephiroth) */
  // Hebrew name sides. With transliterations hidden the learner never sees the Latin spelling, so they are not typable.
  // showEng: put the English (e.g. choir "Holy Living Creatures") in the question/options; hf always carries it for feedback.
  const hier=(lab,n,eng,showEng)=>{const raw=COL[lab]&&COL[lab].cells&&COL[lab].cells[n];if(!raw)return null;const {heb,lat}=splitHeb(clean(raw));if(!heb||!lat)return null;
    const e=eng?cell(eng,n):'',es=e?` <span class="sub">· ${esc(e)}</span>`:'';
    return side(lat,{h:he(heb)+tl(lat)+(showEng?es:''),hf:he(heb)+tl(lat)+es,cat:lab,typ:T,alt:[...(NAME_ALT[lat]||[]),...(e?[e]:[])],heb});};
  rel({id:'dn.god',deck:'names',name:'Sephirah ↔ God-name',
    fq:it=>`God-name of ${it.s.h}?`,rq:it=>`${it.v.h} is the God-name of which Sephirah?`,
    items:SEPH.map(s=>{const g=GOD_NAMES[s.n];return{key:s.key,row:s.key,s:sephS(s),v:side(g[1],{h:he(g[0])+tl(g[1]),cat:'god',alt:g[2],typ:T})};})});
  // (it names the Sun and Mercury, the spheres of Tiphareth and Hod: in Learn a row it is shown on the study page instead)
  const archNote=Object.assign(()=>ARCH_NOTE,{spoils:true});
  rel({id:'dn.arch',deck:'names',name:'Sephirah ↔ archangel',
    fq:it=>`Archangel of ${it.s.h}?`,rq:it=>`${it.v.h} is the archangel of which Sephirah?`,
    items:SEPH.map(s=>({key:s.key,row:s.key,s:sephS(s),v:hier('XCIX',s.key),note:s.n===6||s.n===8?archNote:undefined}))});
  rel({id:'dn.choir',deck:'names',name:'Sephirah ↔ angelic choir',
    fq:it=>`Angelic choir of ${it.s.h}?`,rq:it=>`${it.v.h} — the choir of which Sephirah?`,
    items:SEPH.map(s=>({key:s.key,row:s.key,s:sephS(s),v:hier('C',s.key,'CI',true)}))});
  // the English ("Sphere of Mars") is kept out of the question: it would reduce this to Sephirah ↔ planet
  rel({id:'dn.heaven',deck:'names',name:'Sephirah ↔ heaven of Assiah',
    fq:it=>`Heaven of Assiah (mundane chakra) of ${it.s.h}?`,rq:it=>`${it.v.h} — the heaven of which Sephirah?`,
    items:SEPH.map(s=>{const v=hier('VI',s.key,'VII',false);
      return{key:s.key,row:s.key,s:sephS(s),v};})});

  /* 6 · Colour scales */
  [['XV','King'],['XVI','Queen']].forEach(([lab,scale])=>{
    [['seph',SEPH.map(s=>s.key),'Sephirah','Sephiroth'],['path',LET.map(p=>p.key),'path','paths']].forEach(([grp,keys,noun,nouns])=>{
      rel({id:`col.${scale.toLowerCase()}.${grp}`,deck:'colours',name:`${scale} Scale — ${nouns}`,short:`${scale} Scale`,odd:true,col:lab,
        fq:it=>`${scale} Scale colour of ${BARE?it.s.h0:it.s.h}? <span class="sub">(col. ${lab})</span>`,
        rq:it=>`Which ${noun} has the ${scale} Scale colour <b>${esc(it.v.t)}</b>?${swatch(it.v.hx,'lg')}`,
        items:keys.map(k=>{const t=cell(lab,k),hx=hexes(lab,k);return t?{key:k,row:k,s:rowS(k),v:side(t,{h:swatch(hx)+esc(t),hx,cat:'colour'})}:null;})});
    });
  });

  /* 7 · Gods and 8 · Symbols — straight from the 777 columns (COL_RELS) */
  COL_RELS.forEach(([deck,lab,name,short])=>{
    // no "(Mercury)" hint beside the path where it would answer the question: the Roman gods are the planets' own names, the Greek
    // gods their gods (Hermes, Zeus, Helios; Castor and Pollux, Ganymede, Poseidon), and the animals the signs' own emblems (Ram, Bull, Goat)
    const hint=!['XXXV','XXXIV','XXXVIII'].includes(lab);
    rel({id:'c.'+lab,deck,name,short,odd:true,list:true,col:lab,
      fq:it=>`${name} of ${BARE||hintLeaks(it.row,it.v.t)?it.s.h0:it.s.h}? <span class="sub">(col. ${lab})</span>`,
      rq:it=>`<span class="sub">${name} · col. ${lab}</span><br>“${esc(it.v.t)}” belongs to…`,
      items:ROWKEYS.map(k=>{const t=cell(lab,k);return t?{key:k,row:k,s:rowS(k,{hint}),v:side(t,{cat:lab})}:null;})});
  });

  /* 9 · Gematria */
  rel({id:'gm.lv',deck:'gematria',name:'Glyph → number',dirs:['f'],sim:alike,
    fq:it=>`Value of this letter?${glyphBig(it.s.t)}`,
    items:LET.map(p=>({key:p.key,row:p.key,s:glyphS(p.glyph),v:numS(p.value)}))});
  const W=[],seenW=new Set();
  const addW=(h,t,m,row)=>{if(seenW.has(h))return;seenW.add(h);W.push({h,t,m,row});};
  SEPH.forEach(s=>addW(SEPH_HEB[s.n],s.name,'Sephirah '+s.n,s.key));
  SEPH.forEach(s=>addW(GOD_NAMES[s.n][0],GOD_NAMES[s.n][1],'God-name of '+s.name,s.key));
  WORDS.forEach(w=>addW(w[0],w[1],w[2],null));
  const breakdown=w=>[...w].filter(ch=>GLYPH_VAL[ch]).map(ch=>`${he(ch)}&nbsp;${GLYPH_VAL[ch]}`).join(' + ');
  rel({id:'gm.word',deck:'gematria',name:'Hebrew word → value',dirs:['f'],
    synth:it=>{const n=+it.v.t,big=gemVal(it.w.h,true);return[big!==n?big:0,n+1,n-1,n+10,n-10,n>150?n+100:0,n>150?n-100:0].filter(x=>x>0&&x!==n);},
    fq:it=>`Gematria value of<span class="word">${he(it.w.h)}${T?`<span class="tl">${esc(it.w.t)} · ${esc(it.w.m)}</span>`:''}</span>`,
    items:W.map(w=>{const n=gemVal(w.h),big=gemVal(w.h,true);
      return{key:w.h,row:w.row,w,s:side(w.h,{h:`${he(w.h)}${tl(w.t)}`,cat:'word',typ:false}),v:numS(n),
        note:()=>`${esc(w.t)} (${esc(w.m)}): ${breakdown(w.h)} = <b>${n}</b>`+(big!==n?` <span class="sub">— finals counted large: ${big}</span>`:'')};})});

  /* 10 · Goetia */
  if(G&&Array.isArray(G.spirits)){
    const prim=spPrim;
    // a spirit as the subject or the answer; alt: the bracketed variant and the other spellings; hf: seal, number and rank for feedback
    const spS=s=>side(prim(s.name),{h:`<b>${esc(s.name)}</b>`,hf:`${sealIc(s)}<b>${esc(s.name)}</b> <span class="sub">· no. ${s.n} · ${esc(s.rank)}</span>`,
      cat:'spirit',alt:spIds(s).slice(1),rank:s.rank,dn:s.dayNight,sign:String(s.decan).split(' ')[0]});
    const SP=G.spirits;
    rel({id:'go.num',deck:'goetia',name:'Spirit ↔ number',
      synth:it=>{const n=+it.v.t;return[n+36,n-36,n+1,n-1].filter(x=>x>=1&&x<=72);},
      fq:it=>`What is the number of ${it.s.h} in the Goetia?`,rq:it=>`Which spirit is number <b>${it.v.t}</b>?`,
      items:SP.map(s=>({key:String(s.n),row:'g'+s.n,s:spS(s),v:numS(s.n)}))});
    // parts: a spirit's ranks ("President / Earl" is one answer, in either order); distractors and matching never offer a rank
    // that shares a part with the answer. Reverse cards exist only for a rank (or pair) held by one spirit alone
    rel({id:'go.rank',deck:'goetia',name:'Spirit ↔ rank',
      fq:it=>`What rank is ${it.s.h}?`,
      rq:it=>it.v.parts.length>1?`Which spirit is both <b>${esc(it.v.parts[0])}</b> and <b>${esc(it.v.parts[1])}</b>?`:`Which spirit is the Goetia's only <b>${esc(it.v.t)}</b>?`,
      items:SP.map(s=>{const parts=spRanks(s);
        return{key:String(s.n),row:'g'+s.n,s:spS(s),v:side(s.rank,{cat:'rank',parts,ck:parts.map(norm).sort().join('/'),
          match:parts.length>1?(x=>allParts(x,parts)):undefined,hf:`<b>${esc(s.rank)}</b>`+(s.rankText?` <span class="sub">· “${esc(s.rankText)}”</span>`:'')})};})});
    rel({id:'go.decan',deck:'goetia',name:'Spirit ↔ decan',
      sim:(a,b)=>(a.s.sign===b.s.sign?1.5:0)+(a.s.dn===b.s.dn?.5:0),
      // in Learn a card the question names the card, not its decan (the decan is the answer of another question there)
      fq:it=>`Which decan does ${it.s.h} rule?`,
      rq:it=>BARE&&it.tc&&TC[it.tc]?`Which Goetic spirit rules the decan of the <b>${esc(TC[it.tc].name)}</b> by <b>${it.s.dn==='Day'?'day':'night'}</b>?`:`Who rules <b>${esc(it.v.t)}</b>?`,
      // tc: the decan's small card (the decan is the value side: "Who rules Aries I by day?" asks from the card's side).
      // This is the one card for "small card → its Goetic spirit": the Tarot deck does not repeat it
      items:SP.map(s=>{const d=DECAN.find(x=>`${x.sign} ${x.rn}`===s.decan);
        return Object.assign({key:String(s.n),row:'g'+s.n,s:spS(s),v:side(`${s.decan} by ${s.dayNight==='Day'?'day':'night'}`,{cat:'decan',typ:false})},d?{tc:d.key,tcSide:'v'}:{});})});
    // 1904 texts: the spirit's own name is taken out (Asmoday's office quotes it); options show a shortened text, feedback the whole.
    // near: two nearly identical descriptions (Halphas and Shax, "a stock-dove … hoarse voice") are never offered against each other
    const near=(a,b)=>jacc(a.v.t,b.v.t)>.5;
    // (asked back without the spirit's rank: a rank held by one spirit alone — Furcas the only Knight, Zagan the only King /
    // President — would name it among the options)
    rel({id:'go.office',deck:'goetia',name:'Spirit ↔ office',
      sim:(a,b)=>a.s.rank===b.s.rank?1:0,near,
      fq:it=>`What is the office of ${it.s.h}?`,
      rq:it=>`Which spirit is this?<br>“${esc(it.v.t)}”`,
      items:SP.map(s=>{const t=redact(s.office,s).trim();
        return t?{key:String(s.n),row:'g'+s.n,s:spS(s),v:side(t,{h:esc(brief(t,160)),hf:esc(t),cat:'office',typ:false})}:null;})});
    rel({id:'go.appear',deck:'goetia',name:'Spirit ↔ appearance',near,
      fq:it=>`How does ${it.s.h} appear?`,
      rq:it=>`Which spirit appears like this?<br>“${esc(it.v.t)}”`,
      items:SP.map(s=>{const t=redact(s.appearance,s).trim();   // Vassago's form is not described
        return t?{key:String(s.n),row:'g'+s.n,s:spS(s),v:side(t,{h:esc(brief(t,150)),hf:esc(t),cat:'appear',typ:false})}:null;})});
    // legions: the figure printed in 1904 (Belial 80, Osé 3, Bifrons 6). The rest of the entry is either the 1904 phrase itself
    // ("Legions of Infernal Spirits": shown with the answer) or an editor's note (shown as a note); the numbers the rest names instead,
    // in figures or in words (Focalor: "several codices give three instead of 30"), are never offered as distractors
    const NUMW_V={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,
      sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
    const numsIn=t=>{const out=(String(t).match(/\d+/g)||[]).map(Number),ws=String(t).toLowerCase().match(/[a-z]+/g)||[];
      ws.forEach((w,i)=>{const v=NUMW_V[w];if(v==null)return;const u=v>=20&&v%10===0?NUMW_V[ws[i+1]]:null;out.push(u&&u<10?v+u:v);});return out;};
    const EDIT_RE=/\b(notes?|footnote|suggests?|should|codices|probably|reads)\b/i;
    const legV=s=>{const m=String(s.legions||'').match(/^\s*(\d+)\s*([\s\S]*)$/);if(!m)return null;
      const n=+m[1],rest=m[2].trim().replace(/^\(([^()]*)\)$/,'$1'),ed=EDIT_RE.test(rest),phrase=rest.replace(/^"([^"]*)"$/,'“$1”');
      return{n,rest,ed,v:side(String(n),{num:true,cat:'legions',hf:`<b>${n}</b> legions`+(rest&&!ed?` <span class="sub">· ${esc(phrase)}</span>`:''),
        avoid:numsIn(rest).filter(x=>x!==n&&x<1000)})};};
    // near: nor, asked the other way round, the spirit whose notes give the answer's figure ("which spirit rules 3 legions?" is Osé;
    // Focalor's codices give three), nor the two in one matching
    const legAlt=(a,b)=>(b.v.avoid||[]).includes(+a.v.t);
    rel({id:'go.legions',deck:'goetia',name:'Spirit ↔ legions',near:(a,b)=>legAlt(a,b)||legAlt(b,a),
      fq:it=>`How many legions of spirits does ${it.s.h} rule?`,rq:it=>`Which spirit rules <b>${it.v.t}</b> legions?`,
      items:SP.map(s=>{const L=legV(s);if(!L)return null;
        return{key:String(s.n),row:'g'+s.n,s:spS(s),v:L.v,
          note:L.rest&&L.ed?()=>`The 1904 text gives <b>${L.n}</b> legions — ${esc(L.rest)}${/[.!?'"”)]$/.test(L.rest)?'':'.'}`:undefined};})});
    // seals: the rim's letters spell the spirit's name, so every question crops it — "which seal is X's?" shows four cropped seals
    // (the right one would otherwise read B-A-E-L), "whose seal is this?" one; feedback and the study card show them whole.
    // A spirit with two seals (Paimon, Beleth…) is shown with either, picked afresh for each question (pre, and makeCardQ for the
    // options, which labels them "seal option A…D" and, once answered, shows them whole with their spirits' names: q.opts[i].hd)
    const sealV=s=>{const f=sealFigs(s);if(!f.length)return null;
      return side('seal fig. '+f.join(' & '),{cat:'seal',typ:false,img:true,figs:f,parts:f.map(x=>'fig'+x),ck:'seal:'+f.join('+'),sp:{n:s.n,name:prim(s.name)},
        h:sealImg(f[0],{cls:'os',rim:false,label:'seal option'}),
        hf:`<span class="sealfb">${f.map(x=>sealImg(x,{label:'seal, fig. '+x})).join('')}</span> <span class="sub">fig. ${f.join(' &amp; ')}</span>`,
        // hl: the answer in a Learn session, without the figure numbers (Bune's figs. 30 and 31 would answer his 30 legions)
        hl:`<span class="sealfb">${f.map(x=>sealImg(x,{label:'the right seal'})).join('')}</span>`});};
    Object.assign(RB,{spS,sealV});
    rel({id:'go.seal',deck:'goetia',name:'Spirit ↔ seal',nomatch:true,
      sim:(a,b)=>a.s.rank===b.s.rank?.5:0,
      pre:it=>{it.fig=pick(it.v.figs);},
      fq:it=>`Which seal belongs to ${it.s.h}?`,
      rq:it=>`Whose seal is this? <span class="sub">(the name lettered around the rim is hidden)</span>${sealImg(it.fig||it.v.figs[0],{cls:'sealq',rim:false,label:'the seal in question'})}`,
      // the same question for the list of mistakes, with the seal whole (the session is over)
      rs:it=>`Whose seal is this?${sealImg(it.fig||it.v.figs[0],{cls:'sealq',label:'the seal that was asked, fig. '+(it.fig||it.v.figs[0])})}`,
      items:SP.map(s=>{const v=sealV(s);if(!v)return null;
        return{key:String(s.n),row:'g'+s.n,s:spS(s),v,
          // (its figure numbers could name another answer of a Learn session: there the study page says it instead)
          note:v.figs.length>1?Object.assign(()=>`${esc(prim(s.name))} has two seals in the 1904 plates (figs. ${v.figs.join(' and ')}); either one counts as the spirit's seal.`,{spoils:true}):undefined};})});
    const RK=Object.keys(G.ranks||{}), PL=PL_SOL;
    // Earl → Mars is Mathers' note after the Classified List (the Observations give Earls copper and silver, Venus and Luna, as
    // go.rmetal asks): not asked as a fact, nor offered (as the Goetia path does)
    rel({id:'go.rplanet',deck:'goetia',name:'Rank ↔ planet',
      fq:it=>`Which planet rules the Goetic rank of <b>${esc(it.s.t)}</b>?`,rq:it=>`Which Goetic rank belongs to <b>${it.v.h}</b>?`,
      items:RK.filter(r=>r!=='Earl').map(r=>{const p=G.ranks[r].planet;return{key:r,row:'k'+r,s:side(r,{cat:'rank'}),v:side(p,{h:esc(symOf(PL[p]||p))+esc(p),cat:'planet',alt:PL[p]?[PL[p]]:[]})};})});
    rel({id:'go.rmetal',deck:'goetia',name:'Rank ↔ metal',
      fq:it=>`Which metal belongs to the Goetic rank of <b>${esc(it.s.t)}</b>?`,rq:it=>`Which Goetic rank's seal is made in <b>${esc(it.v.t)}</b>?`,
      // parts: "Copper + silver" (Earl) shares its metals with Duke and Marquis, so those are never offered against it
      items:RK.map(r=>{const m=G.ranks[r].metal;return{key:r,row:'k'+r,s:side(r,{cat:'rank'}),
        v:side(m,{cat:'metal',parts:m.split('+').map(y=>y.trim().toLowerCase()),alt:/\(/.test(m)?[m.replace(/\s*\(.*$/,''),m.replace(/^.*\(|\).*$/g,'')]:[],match:/\+/.test(m)?(x=>allParts(x,m.split('+').map(y=>y.trim()))):undefined})};})});
  }

  /* 11 · Tarot — the 78 cards of the Thoth deck. it.tc: the card a fact is about (tcSide 's': the card is the subject side) */
  if(TC_ORDER.length){
    const TL=TC_ORDER.map(k=>TC[k]),MAJ=TL.filter(c=>c.kind==='major'),SMALL=TL.filter(c=>c.kind==='minor'),ACES=TL.filter(c=>c.kind==='ace'),
      COURT=TL.filter(c=>c.kind==='court'),KQP=COURT.filter(c=>c.span),PRS=COURT.filter(c=>c.quad);
    // a card as the subject (or the answer) of a question; sk / nn / rk (suit, number, rank) steer the distractors
    const tcS=c=>side(c.name,{h:c.kind==='major'?`Atu <b>${c.num}</b> ${esc(c.title)}`:`<b>${esc(c.name)}</b>`,h0:c.kind==='major'?`Atu <b>${c.num}</b>`:undefined,
      cat:c.kind==='major'?'tmajor':c.kind==='court'?'tcourt':'tsmall',alt:c.alt,sk:c.suit&&c.suit.k,nn:c.kind==='court'?0:c.n,rk:c.rank&&c.rank.k});
    const tsim=(a,b)=>(a.s.sk&&a.s.sk===b.s.sk?1:0)+(a.s.nn&&a.s.nn===b.s.nn?1:0)+(a.s.rk&&a.s.rk===b.s.rk?1:0);
    // leak: the answer repeats the trump's own title ("The Magus of Power" for I The Magus): ask with the numeral alone
    const tItem=(c,v,o)=>v&&v.t?Object.assign({key:c.key,row:c.row,tc:c.key,tcSide:'s',s:tcS(c),v,
      leak:c.kind==='major'&&namesAny([v.t,...(v.alt||[])],[c.title,...(c.gd?[c.gd]:[])])},o||{}):null;
    const subj=it=>it.leak&&it.s.h0?it.s.h0:it.s.h;
    const sg=s=>esc(symOf(s))+esc(s);
    Object.assign(RB,{tcS,tsim,tItem,subj});

    /* the trumps */
    rel({id:'ta.atu.title',deck:'tarot',name:'Atu ↔ Thoth title',
      fq:it=>`What is the Thoth title of ${it.s.h}?`,rq:it=>`Which Atu is <b>${esc(it.v.t)}</b>?`,
      items:MAJ.map(c=>({key:c.key,row:c.row,tc:c.key,tcSide:'s',
        s:side(c.num,{h:`Atu <b>${c.num}</b>`,cat:'atunum',alt:[String(c.n),'Atu '+c.num,'Atu '+c.n]}),
        v:side(c.title,{cat:'atutitle',alt:c.gd?[c.gd]:[],hf:`<b>${esc(c.title)}</b>`+(c.gd?` <span class="sub">· Golden Dawn: ${esc(c.gd)}</span>`:'')})}))});
    const SWAP_ATU=new Set(TRUMP_CARDS.filter(c=>c.thoth_letter).map(c=>'atu-'+c.n));   // The Emperor and The Star (Thoth letters)
    // Atu ↔ letter, Atu ↔ path and Atu ↔ attribution are the Paths & Thoth trumps deck's (tr.letter, tr.path, tr.attr): one schedule
    // per fact. Their cards carry the trump's key (tc), so Learn a card asks them from there.
    const w1=t=>wordsN(t)[0]||'';   // "Daughter", "Lord", "Child"…: titles of the same kind make the best distractors
    rel({id:'ta.atu.t777',deck:'tarot',name:'Atu ↔ title in Liber 777 (col. CLXXX)',sim:(a,b)=>w1(a.v.t)===w1(b.v.t)?1.5:0,
      fq:it=>`Title of ${subj(it)} in Liber 777? <span class="sub">(col. CLXXX)</span>`,rq:it=>`Which Atu is “${esc(it.v.t)}”?`,
      items:MAJ.map(c=>{const t=title777(c.n);return t?tItem(c,side(t,{cat:'t777',typ:false})):null;})});
    // the trump's colour in each of the four scales (777 cols. XV–XVIII, its own row); the King Scale keeps its old id
    [['XV','King','ta.atu.colour'],['XVI','Queen','ta.atu.colour.queen'],['XVII','Emperor','ta.atu.colour.emperor'],['XVIII','Empress','ta.atu.colour.empress']]
      .forEach(([lab,scale,id])=>rel({id,deck:'tarot',name:`Atu → ${scale} Scale colour`,short:`${scale} Scale`,dirs:['f'],
        fq:it=>`${scale} Scale colour of ${subj(it)}? <span class="sub">(col. ${lab})</span>`,
        items:MAJ.map(c=>{const r=ATU_ROW[c.n],t=cell(lab,r),hx=hexes(lab,r);return t?tItem(c,side(t,{h:swatch(hx)+esc(t),hx,cat:'colour'})):null;})}));
    // the meaning and value of the trump's letter (by the current attribution: under Thoth, Atu IV is Tzaddi and Atu XVII Hé)
    const atuLet=c=>{const p=atuPath(c.n);return ROW[p]&&ROW[p].kind==='path'?ROW[p]:null;};
    const swN=c=>{const p=atuPath(c.n);return SWAP_PATHS.has(p)?sw(p):undefined;};
    rel({id:'ta.atu.mean',deck:'tarot',name:'Atu → meaning of its letter',dirs:['f'],
      fq:it=>`What does the Hebrew letter of ${subj(it)} mean?`,
      items:MAJ.map(c=>{const P=atuLet(c);return P?tItem(c,side(P.meaning,{cat:'meaning',alt:MEAN_ALT[P.meaning]||[]}),
        {key:sysKey(c.key,SWAP_ATU),note:swN(c)}):null;})});
    rel({id:'ta.atu.value',deck:'tarot',name:'Atu → value of its letter',dirs:['f'],
      fq:it=>`Numerical value of the Hebrew letter of ${subj(it)}?`,
      items:MAJ.map(c=>{const P=atuLet(c);return P?tItem(c,numS(P.value),{key:sysKey(c.key,SWAP_ATU),note:swN(c)}):null;})});
    rel({id:'ta.atu.conn',deck:'tarot',name:'Atu → the Sephiroth its path joins',dirs:['f'],
      fq:it=>`Which two Sephiroth does the path of ${it.s.h} join?`,
      items:MAJ.map(c=>{const p=atuPath(c.n),P=ROW[p];if(!P||!P.ends)return null;const a=sephName(P.ends[0]),b=sephName(P.ends[1]);
        return tItem(c,side(`${a} – ${b}`,{cat:'conn',a,b,match:x=>bothNames(x,a,b)}),{key:sysKey(c.key,SWAP_ATU)});})});

    /* the small cards 2–10 */
    rel({id:'ta.title',deck:'tarot',name:'Small card ↔ Thoth title',sim:tsim,
      fq:it=>`What is the Thoth title of the ${it.s.h}?`,rq:it=>`Which small card is titled <b>${esc(it.v.t)}</b>?`,
      items:SMALL.map(c=>tItem(c,side(c.title,{cat:'ttitle',alt:norm(c.bookT)===norm(c.title)?['Lord of '+c.title]:[c.bookT,'Lord of '+c.bookT],
        hf:`<b>${esc(c.title)}</b> <span class="sub">· Book T: Lord of ${esc(c.bookT)}</span>`})))});
    const decV=d=>side(`${d.sign} ${d.rn}`,{h:`<b>${d.sign} ${d.rn}</b> <span class="sub">· ${d.deg} ${esc(symOf(d.sign).trim())}</span>`,cat:'decan',sgn:d.sign,
      alt:[`${d.deg} ${d.sign}`,`${d.sign} ${d.d+1}`]});
    // decan and planet-in-sign share the sign: the options of both come mostly from the same sign, so the sign one of them shows
    // (in the answer or in the options) never answers the other
    const sgnSim=(a,b)=>tsim(a,b)+(a.v.sgn&&a.v.sgn===b.v.sgn?2.5:0);
    rel({id:'ta.decan',deck:'tarot',name:'Small card ↔ decan',sim:sgnSim,
      fq:it=>`Which decan of the zodiac is the ${it.s.h}?`,rq:it=>`Which small card is the decan ${it.v.h}?`,
      items:SMALL.map(c=>tItem(c,decV(c.dec)))});
    const pisV=d=>{const pl=d.ruler,P=PL_SOL[pl];
      return side(`${pl} in ${d.sign}`,{h:`${esc(symOf(P||pl))}<b>${pl}</b> in ${esc(symOf(d.sign))}<b>${d.sign}</b>`,cat:'pis',sgn:d.sign,
        alt:[`${pl} ${d.sign}`,...(P?[`${P} in ${d.sign}`]:[])]});};
    rel({id:'ta.planet',deck:'tarot',name:'Small card ↔ planet in sign',sim:sgnSim,
      fq:it=>`Which planet in which sign is the ${it.s.h}?`,rq:it=>`Which small card is ${it.v.h}?`,
      items:SMALL.map(c=>tItem(c,pisV(c.dec)))});
    const sephV=(n,extra)=>{const s=SEPH[n-1];if(!s)return null;
      return side(s.name,{h:`<b>${esc(s.name)}</b> ${he(SEPH_HEB[n])}`,hf:`<b>${esc(s.name)}</b> ${he(SEPH_HEB[n])} <span class="sub">· ${n} · ${esc(s.meaning)} · ${esc(extra)}</span>`,
        cat:'seph',alt:SEPH_ALT[s.name]||[]});};
    rel({id:'ta.seph',deck:'tarot',name:'Card → Sephirah',dirs:['f'],sim:(a,b)=>(a.s.cat===b.s.cat?2:0)+tsim(a,b)*.3,
      fq:it=>`Which Sephirah is the ${it.s.h} attributed to?`,
      items:[...ACES,...SMALL,...COURT].map(c=>tItem(c,sephV(c.seph,c.kind==='court'?`the four ${c.rank.pl}`:`in ${c.suit.world}, the world of ${c.suit.el}`)))});
    // the small cards are painted in their Sephirah's colour: Wands in the King Scale, Cups Queen, Swords Emperor, Disks Empress
    const colV=c=>{const {t,hx}=suitColour(c);
      return t?side(t,{h:swatch(hx)+esc(t),hf:swatch(hx)+esc(t)+` <span class="sub">· ${c.suit.scaleN} Scale of ${esc(sephName(c.seph))}</span>`,hx,cat:'colour'}):null;};
    rel({id:'ta.colour',deck:'tarot',name:'Ace & small card → colour',dirs:['f'],sim:(a,b)=>(a.s.sk===b.s.sk?2:0)+(a.s.nn===b.s.nn?.5:0),
      fq:it=>`Which colour belongs to the ${it.s.h}? <span class="sub">(${esc(it.scale)} Scale)</span>`,
      items:[...ACES,...SMALL].map(c=>tItem(c,colV(c),{scale:c.suit.scaleN}))});
    // (small card → its Goetic spirits by day and by night is the Goetia deck's "Who rules Aries I by day?" (go.decan), tagged with
    //  the card: one schedule per fact; Learn a card asks it naming the card)
    // The Shem angels by Book T and Liber 777, which begin at Leo I. Counted from Aries I (the Nightside workbook numbering) a decan
    // gets another pair, and the Goetia pairs each spirit with the angel of its own number: that Aries I pair is never offered as a distractor (avoid)
    const angNames=t=>String(t||'').split('·').map(x=>x.replace(/^\s*\d+\s*/,'').trim()).filter(Boolean);
    const shemV=d=>{const ns=angNames(d.shem),g=angNames(d.shemG);
      return ns.length===2?side(ns.join(' · '),{cat:'shem',typ:false,avoid:g.length===2?[norm(g.join(' · '))]:[],
        hf:`${esc(ns.join(' · '))} <span class="sub">· nos. ${esc((String(d.shem).match(/\d+/g)||[]).join(' & '))} of the 72</span>`}):null;};
    // (it names the decan: a spoiler in Learn a card, where the study page carries the same explanation)
    const shemNote=d=>Object.assign(()=>`Book T and Liber 777 begin the 72 angels at Leo I (the 5 of Wands: 1 Vehuiah, 2 Yeliel), two to a decan, one for each half.`
      +(d.shemG?` Other tables give ${esc(d.shemG)} for ${esc(d.sign)} ${d.rn} (Nightside workbook numbering, from Aries I); the Goetia pairs each spirit with the angel of its own number.`:''),{spoils:true});
    rel({id:'ta.shem',deck:'tarot',name:'Small card → Shem ha-Mephorash angels',dirs:['f'],sim:tsim,
      fq:it=>`Which two angels of the Shem ha-Mephorash rule the ${it.s.h}? <span class="sub">(Book T · one for each half of its decan)</span>`,
      items:SMALL.map(c=>tItem(c,shemV(c.dec),{note:shemNote(c.dec)}))});
    rel({id:'ta.court',deck:'tarot',name:'Small card → court card of its decan',dirs:['f'],
      sim:(a,b)=>(b.v.sk===a.s.sk?1.5:0)+(b.v.rk===a.v.rk?.5:0),
      fq:it=>`In which court card's part of the zodiac does the ${it.s.h} fall?`,
      items:SMALL.map(c=>{const ct=c.dec.court;return ct?tItem(c,Object.assign(tcS(ct),{hf:`<b>${esc(ct.name)}</b> <span class="sub">· ${esc(ct.span.t)}</span>`})):null;})});

    /* the aces */
    rel({id:'ta.ace.el',deck:'tarot',name:'Ace ↔ element',
      fq:it=>`Element of the ${it.s.h}?`,rq:it=>`Which Ace is the root of the element <b>${esc(it.v.t)}</b>?`,
      items:ACES.map(c=>tItem(c,side(c.suit.el,{cat:'element'})))});
    rel({id:'ta.ace.root',deck:'tarot',name:'Ace ↔ “Root of the Powers”',
      fq:it=>`Title of the ${it.s.h}?`,rq:it=>`Which card is <b>${esc(it.v.t)}</b>?`,
      items:ACES.map(c=>tItem(c,side(c.title,{cat:'root',alt:['Root of '+c.suit.el]})))});
    rel({id:'ta.ace.world',deck:'tarot',name:'Ace ↔ Qabalistic world',
      fq:it=>`Which of the four worlds is the ${it.s.h}?`,rq:it=>`Which Ace belongs to <b>${esc(it.v.t)}</b>?`,
      items:ACES.map(c=>tItem(c,side(c.suit.world,{cat:'world',alt:WORLD_ALT[c.suit.world]||[]})))});
    // Book T: each Ace stands at the North Pole on the throne of its Princess's quadrant; the suits are the letters of the Name
    // (Wands Yod, Cups Hé, Swords Vau, Disks Hé final)
    rel({id:'ta.ace.throne',deck:'tarot',name:'Ace → the quadrant of its throne',dirs:['f'],
      fq:it=>`On which quadrant of the heavens (about the North Pole) is the ${it.s.h} throned?`,
      items:ACES.map(c=>{const pr=TC[c.suit.k+'-princess'];return pr&&pr.quad?tItem(c,side(pr.quad.join(', '),{h:pr.quad.map(sg).join(', '),cat:'quad',typ:false,
        hf:`${pr.quad.map(sg).join(', ')} <span class="sub">· the quadrant of the ${esc(pr.name)}</span>`})):null;})});
    rel({id:'ta.ace.letter',deck:'tarot',name:'Ace → letter of the Name',dirs:['f'],
      fq:it=>`Which letter of the Name ${he('יהוה')} do the ${it.s.h} and its suit belong to?`,
      items:ACES.map(c=>{const rk=TCOURTS.find(r=>r.el===c.suit.el);return rk?tItem(c,side(rk.hl,{h:`${esc(rk.hl)} ${he(rk.he)}`,cat:'hl',alt:HL_ALT[rk.hl]||[]})):null;})});

    /* the court cards */
    rel({id:'ta.court.el',deck:'tarot',name:'Court card ↔ element',sim:tsim,
      fq:it=>`Elemental attribution of the ${it.s.h}?`,rq:it=>`Which court card is <b>${esc(it.v.t)}</b>?`,
      items:COURT.map(c=>tItem(c,side(`${c.rank.el} of ${c.suit.el}`,{cat:'cel'})))});
    rel({id:'ta.court.span',deck:'tarot',name:'Knight / Queen / Prince ↔ span of the zodiac',sim:tsim,
      fq:it=>`Which part of the zodiac does the ${it.s.h} rule?`,rq:it=>`Which court card rules <b>${it.v.h}</b>?`,
      items:KQP.map(c=>tItem(c,side(c.span.t,{h:`20° ${sg(c.span.a)} – 20° ${sg(c.span.b)}`,cat:'span',alt:[`${c.span.a} – ${c.span.b}`,`${c.span.a} to ${c.span.b}`]})))});
    rel({id:'ta.court.letter',deck:'tarot',name:'Court card → letter of the Name',dirs:['f'],sim:tsim,
      fq:it=>`Which letter of the Name ${he('יהוה')} is the ${it.s.h}?`,
      items:COURT.map(c=>tItem(c,side(c.rank.hl,{h:`${esc(c.rank.hl)} ${he(c.rank.he)}`,cat:'hl',alt:HL_ALT[c.rank.hl]||[]})))});
    // the court's titles in 777 cols. LXXI–LXXIV; the options are the same rank's titles in the other suits
    rel({id:'ta.court.t777',deck:'tarot',name:'Court card → title in Liber 777',dirs:['f'],sim:(a,b)=>a.s.rk===b.s.rk?3:0,
      fq:it=>`Title of the ${it.s.h} in Liber 777? <span class="sub">(col. ${it.col})</span>`,
      items:COURT.map(c=>c.t777?tItem(c,side(c.t777,{cat:'t777c',typ:false}),{col:c.suit.col}):null)});
    rel({id:'ta.court.quad',deck:'tarot',name:'Princess ↔ quadrant of the heavens',
      fq:it=>`Which quadrant of the heavens (about the North Pole) does the ${it.s.h} rule?`,rq:it=>`Which Princess rules the quadrant of <b>${it.v.h}</b>?`,
      items:PRS.map(c=>tItem(c,side(c.quad.join(', '),{h:c.quad.map(sg).join(', '),cat:'quad',
        hf:`${c.quad.map(sg).join(', ')} <span class="sub">· she is the throne of the Ace of ${esc(c.suit.n)}</span>`})))});
    rel({id:'ta.court.decans',deck:'tarot',name:'Knight / Queen / Prince → its three small cards',dirs:['f'],sim:tsim,
      fq:it=>`Which three small cards lie in the part of the zodiac ruled by the ${it.s.h}?`,
      items:KQP.map(c=>tItem(c,side(c.decans.map(d=>`${d.n} of ${d.suit.n}`).join(' · '),{cat:'dcards',typ:false,
        hf:c.decans.map(d=>`${d.n} of ${esc(d.suit.n)} <span class="sub">(${esc(d.sign)} ${d.rn})</span>`).join(' · ')})))});

    /* 12 · Divination — what each card means in a reading (../lib/divination.js): Book T (Equinox I:8, 1912, built in),
       the app's keywords / "In brief", and the user's own meanings (their bundled or imported document, and any edits).
       Mostly asked "meaning → which card?"; the passage shown never names its own card: card names, "Lord of …"
       titles and the card's own title words are blanked out. The divination path module (../lib/paths/divination.js) then cleans
       these items as its stages show them (Book T's closing "Chokmah of Yod" line, "If ill dignified, he is …", the short items
       holding a blank) and restricts the directions (it.dirs) of any whose text would still give its card away — a number, its
       suit, a form of its title, "he" among the courts — so Practice and the daily review ask them as the path does. */
    if(window.Div){
      const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const NUMW='(?:Ace|One|Two|Three|Four|Five|Six|Seven|Eight|Nine|Ten|\\d{1,2})',SUITW='(?:Wands?|Cups?|Swords?|Disks?|Discs?|Pentacles?|Coins?)';
      const generic=t=>String(t||'').replace(new RegExp(`${NUMW}\\s+of\\s+${SUITW}`,'gi'),'[a card]')
        .replace(new RegExp(`(?:Knight|Queen|Prince|Princess|King|Page)\\s+of\\s+${SUITW}`,'gi'),'[a card]')
        .replace(/[“"]?Lords? of (?:the )?[A-Z][a-z]+(?: [A-Z][a-z]+)*[”"]?/g,'[a title]');
      const ownNames=c=>[c.title,c.gd,...(c.alt||[])].filter(Boolean).map(n=>String(n).replace(/^(?:Atu\s+)?[0IVXL]+\s+/,'').replace(/^The\s+/i,''))
        .filter(n=>n.length>=3);
      // the card's own name and its word forms ("foolish", "foolishness", "stars", "successful") — but not "start"
      const mask=(c,t)=>ownNames(c).reduce((s,n)=>s.replace(new RegExp(`\\b(?:the\\s+)?${reEsc(n)}(?:s|es|ish|ishly|ishness|ness|ful|fully|ly|y|ry|er|ers|ed|ing)?\\b`,'gi'),'[…]'),generic(t));
      const clip=(t,n)=>t.length>n?t.slice(0,n).replace(/\s+\S*$/,'')+' …':t;
      const DV=TL.map(c=>({c,d:Div.card(c.key)}));
      const dvSide=(t,cat)=>side(t,{cat,typ:false});
      Object.assign(RB,{mask,clip,dvSide});
      rel({id:'dv.kw',deck:'divination',name:'Card ↔ keywords',sim:tsim,
        fq:it=>`What does ${subj(it)} signify in a reading?`,rq:it=>`Which card is <b>${esc(it.v.t)}</b>?`,
        items:DV.map(({c,d})=>d.eff.keywords?tItem(c,dvSide(mask(c,d.eff.keywords),'dvkw')):null)});
      rel({id:'dv.bookT',deck:'divination',name:'Book T meaning → card',dirs:['r'],sim:tsim,
        rq:it=>`<span class="sub">Book T (1912):</span> “${esc(it.v.t)}” <br>Which card?`,
        items:DV.map(({c,d})=>d.orig.meaning?tItem(c,dvSide(clip(mask(c,d.orig.meaning),260),'dvbookt')):null)});
      rel({id:'dv.ill',deck:'divination',name:'Ill dignified → card',dirs:['r'],sim:tsim,
        rq:it=>`<span class="sub">Ill dignified (Book T):</span> “${esc(it.v.t)}” <br>Which card?`,
        items:DV.map(({c,d})=>d.orig.illDignified?tItem(c,dvSide(clip(mask(c,d.orig.illDignified),200),'dvill')):null)});
      rel({id:'dv.brief',deck:'divination',name:'In brief → card',dirs:['r'],sim:tsim,
        rq:it=>`“${esc(it.v.t)}” <br>Which card is this?`,
        items:DV.map(({c,d})=>d.eff.brief?tItem(c,dvSide(mask(c,d.eff.brief),'dvbrief')):null)});
      // the user's own meanings (their document / edits): only cards that have one
      rel({id:'dv.mine',deck:'divination',name:'Your meaning → card',dirs:['r'],sim:tsim,
        rq:it=>`<span class="sub">Your meanings:</span> “${esc(it.v.t)}” <br>Which card?`,
        items:DV.map(({c,d})=>d.eff.meaning?tItem(c,dvSide(clip(mask(c,d.eff.meaning),260),'dvmine')):null)});
    }
  }

  /* 13 · Planetary dignities (see digRels) */
  digRels();
  /* and the relations of the learning-path modules (QuizPaths.addRelations) */
  buildXRels();
}

/* ---------- 13 · Planetary dignities: ../../data/dignities.json, the learner's own sheet "Thoth Tarot – Planetary Dignities & Properties" ----------
   The file is optional: without it the deck has no cards and is hidden. Every answer is a cell of the sheet, or (planet in a sign, the
   spread cross-reference, the decans) the sheet's four columns Ruler / Exalted / Detriment / Fall read for that pair. Items also carry
     fx     the facts a question asks ('rul:Aries' = the ruler of Aries, 'pis:Mars:Libra' = Mars in Libra…): a Learn session never asks
            one fact twice, e.g. "where is Saturn exalted?" and "who is exalted in Libra?" (digPick, and pathQueue for the path);
     pside  where the planet stands in the item: 's' subject, 'v' value, 'x' neither (its elemental Atu) — for Learn a planet;
     noteL  the explanation shown in a Learn session: the fact just asked and the sheet's general rule, nothing that answers another
            question of the session (the full note, shown elsewhere, may spell out the planet's other dignities). */
let DG=null,DGP={},DGS={},DGPL=[],DGCL=[];   // the file; planets by name; signs by name; all 12 bodies in the sheet's order; the seven
function prepDig(){
  DGP={};DGS={};DGPL=[];DGCL=[];
  if(!DG||!Array.isArray(DG.planets)||!Array.isArray(DG.signs)){DG=null;return;}
  DG.planets.forEach(p=>{if(p&&p.planet&&/^[a-z]+$/.test(p.id||'')&&!DGP[p.planet]){DGP[p.planet]=p;DGPL.push(p);}});
  DG.signs.forEach(s=>{if(s&&SIGNS.includes(s.sign))DGS[s.sign]=s;});
  DGCL=DGPL.filter(p=>p.kind==='classical');
  if(DGCL.length!==7||SIGNS.some(s=>!DGS[s]))DG=null;   // not the sheet this page was written for: no deck
}
const dgG=g=>g?esc(g)+'︎':'';   // a glyph in text (not emoji) presentation
const dgPl=p=>p?`${dgG(p.glyph)} <b>${esc(p.planet)}</b>`:'';
const dgPn=n=>DGP[n]?dgPl(DGP[n]):esc(n||'');
const dgSg=s=>DGS[s]?`${dgG(DGS[s].glyph)} ${esc(s)}`:esc(s||'');
const dgAtu=o=>o&&o.atu!=null&&o.card?`${o.atu} ${o.card}`:'';
const dgAtuH=o=>o&&o.card?`Atu <b>${esc(o.atu)}</b> ${esc(o.card)}`:'';
const dgPlanet=id=>DGPL.find(p=>p.id===id)||null;
const dgQL=(p,f)=>{const q=((DG&&DG.quickLookup)||[]).find(x=>x&&x.planet===p.planet)||{};return Array.isArray(q[f])?q[f].join(', '):'';};
const dgRule=re=>((DG&&DG.rules)||[]).find(r=>re.test(r))||'';
// the sheet's rules: "Fall = exalted planet of the opposite sign; detriment = ruler of the opposite sign." and the notes beside them
function dgRules(){
  const rr=dgRule(/detriment\s*=/i).split(/;\s*/).map(x=>x.trim().replace(/\.$/,'')),cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
  return{det:cap(rr.find(x=>/^detriment/i.test(x))||'detriment = ruler of the opposite sign'),fall:cap(rr.find(x=>/^fall/i.test(x))||'fall = exalted planet of the opposite sign'),
    noEx:dgRule(/no classical exaltation/i),modern:dgRule(/modern rulers/i),nodes:dgRule(/^nodes/i)};
}
// the four essential dignities (tab Dignity kinds), by ID: their names are also the quiz's keys (digIn: ['Domicile', 'Exaltation'])
const DKINDS=DB.rows('dignity_kinds'),DKN=Object.fromEntries(DKINDS.map(k=>[k.id,k.name]));
// the reading key's line for a dignity ("Fall: Humiliated – what the card cannot hold on to."; Domicile is the key's Ruler)
const dgKeyL=k=>{const n=(DKINDS.find(x=>x.name===k)||{}).key_label||k,t=((DG&&DG.readingKey)||{})[n];return t?`<b>${esc(n)}</b>${n==='Ruler'?' (domicile)':''}: ${esc(t)}`:'';};
// A planet's dignities in a sign, read from the sheet's sign table (section 1): Mercury in Virgo → ['Domicile','Exaltation']
function digIn(pn,sn){const s=DGS[sn];if(!s)return[];return [s.ruler===pn&&DKN.domicile,s.exalted===pn&&DKN.exaltation,s.detriment===pn&&DKN.detriment,s.fall===pn&&DKN.fall].filter(Boolean);}
const digLabel=d=>!d.length?'Peregrine':d[0]+d.slice(1).map(x=>' and '+x.toLowerCase()).join('');
// a dignity that strengthens (domicile, exaltation) or weakens (detriment, fall): tab Dignity kinds, column effect
const digStrong=d=>DKINDS.some(k=>k.effect==='strengthens'&&d.includes(k.name));
const digWeak=d=>DKINDS.some(k=>k.effect==='weakens'&&d.includes(k.name));
const DABBR=Object.fromEntries(DKINDS.map(k=>[k.name,k.abbr]));   // R, E, D, F
const listAnd=a=>a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
// typed sign lists ("capricorn and aquarius"): the set of signs named, each forgiving a letter or two
function signsIn(x){const out=new Set();words(x).forEach(w=>{const n=norm(w);if(n.length<3)return;
  const s=SIGNS.find(z=>{const b=norm(z);return n===b||lev(n,b)<=tolerance(b.length);});if(s)out.add(s);});return out;}
const sameSigns=(x,a)=>{const g=signsIn(x);return g.size===a.length&&a.every(s=>g.has(s));};
const letP=t=>{const m=String(t||'').match(/^(\S+)\s+([֐-׿])$/);return m?{n:m[1],g:m[2]}:null;};   // "Tau ת"

function digRels(){
  if(!DG)return;
  const D='dignities',PL=DGPL,CL=DGCL,SG=SIGNS.map(s=>DGS[s]),EX=PL.filter(p=>p.exaltation&&DGS[p.exaltation]),R=dgRules();
  const P=p=>'dp-'+p.id,S=s=>'ds-'+s;   // study-card rows: a planet, a sign
  const spo=f=>Object.assign(f,{spoils:true});   // a note naming other facts: shown outside Learn only
  const pIds=p=>uniq([p.planet,p.also,PL_SOL[p.planet],p.kind==='node'?(p.id==='nnode'?'North Node':'South Node'):''].filter(Boolean));
  const plS=p=>side(p.planet,{h:dgPl(p),cat:'dplanet',alt:pIds(p).slice(1)});
  const noneS=what=>{const t=`<b>None</b> — no planet is ${what} here in this scheme`;
    return side('None',{h:`<b>None</b><small>no planet is ${what} here in this scheme</small>`,hf:t,hl:t,cat:'dplanet',ck:'none',alt:['No planet','No one','Nobody','Nothing']});};
  const sgS=s=>side(s,{h:dgSg(s),cat:'dsign'});
  // two signs (Saturn rules Capricorn, Aquarius) are one answer: typed, both must be named; never offered beside a set sharing a sign
  const setS=a=>side(a.join(', '),{h:a.map(dgSg).join(', '),cat:'dsigns',parts:a.map(norm),ck:'signs:'+a.map(norm).sort().join('+'),match:x=>sameSigns(x,a),n:a.length});
  const atuS=o=>side(dgAtu(o),{h:dgAtuH(o),h0:`Atu <b>${esc(o.atu)}</b>`,cat:'datu',alt:uniq([o.card,'Atu '+o.atu,String(o.atu),String(roman(String(o.atu)))])});
  const txt=(t,cat,o)=>t==null||t===''?null:side(String(t),Object.assign({cat,typ:false},o||{}));
  // a value that names its own planet ("Saturday", "Saturnine") would answer "which planet…?" at sight: such an item is left out
  // (the planet's words: tab Planets, column adjectives)
  const ADJ=Object.fromEntries(DB.rows('planets').filter(p=>p.adjectives).map(p=>[p.name,DB.items(p.adjectives)]));
  const namesP=(t,p)=>{const ws=words(t).map(norm);return namesAny([t],pIds(p))||(ADJ[p.planet]||[]).some(a=>ws.includes(a));};
  // noteL of a planet's cell (sections 4–6): the one fact just asked and where the sheet gives it. The notes of these items (s4, s5, s6,
  // kwNote) list the planet's other cells, which a Learn session asks too, so without this it would show no explanation at all.
  // (v.h, not v.hf: Jupiter's keywords are shown there without "Fortune", its Atu)
  // FL: the item's fact → [the sheet's column as a sentence names it, its section] (tabs Dignity sheet sections and columns)
  const FL=(()=>{const F={nature:'nature',temperament:'temperament',sect:'sect',principle:'principle',kwd:'dignified',kwi:'ill',seph:'sephira',
      let:'letter',metal:'metal',arch:'archangel',day:'day',cyc:'cycle',body:'body',age:'age',trade:'trades'};   // fact → field of dignities.json
    const cols=DB.rows('dignity_section_columns').filter(c=>DB.ref(c,'section').data==='planets');
    return Object.fromEntries(Object.entries(F).map(([k,f])=>{const c=cols.find(x=>x.field===f);return c?[k,[c.quiz_label||c.label.toLowerCase(),DB.ref(c,'section').n]]:null;}).filter(Boolean));})();
  const fact=(p,[lab,sec],v)=>()=>`${dgPl(p)} · ${esc(lab)}: <b>${v.h}</b> <span class="sub">(sheet, section ${sec})</span>`;
  const pItem=(p,v,f,x)=>v&&v.t&&![v.t,...(v.alt||[])].some(t=>namesP(t,p))?Object.assign({key:p.id,row:P(p),pside:'s',pk:p.kind,sp:p.planet,fx:[f+':'+p.id],s:plS(p),v,
    noteL:FL[f]?fact(p,FL[f],v):undefined},x||{}):null;
  Object.assign(RB,{plS,noneS,sgS,setS,atuS,txt,pItem});
  const kind=(a,b)=>a.pk&&a.pk===b.pk?1.5:0;
  // "Like Jupiter" (the Dragon's Head's temperament) is never offered about Jupiter, nor Jupiter for "Like Jupiter"
  const nearName=(a,b)=>!!(DGP[a.sp]&&DGP[b.sp])&&(namesAny([b.v.t],pIds(DGP[a.sp]))||namesAny([a.v.t],pIds(DGP[b.sp])));
  const s4=p=>spo(()=>`${dgPl(p)} · ${[p.nature,p.temperament,p.sect,p.principle].filter(Boolean).map(esc).join(' · ')} <span class="sub">(sheet, section 4)</span>`);
  const s5=p=>spo(()=>`${dgPl(p)} · ${[p.sephira,p.letter,dgAtu(p),p.kamea,p.colourName,p.metal,p.archangel].filter(Boolean).map(esc).join(' · ')} <span class="sub">(sheet, section 5)</span>`);
  const s6=p=>spo(()=>`${dgPl(p)} · ${[p.day,p.cycle,p.body,p.age,Array.isArray(p.trades)?p.trades.join(', '):''].filter(Boolean).map(esc).join(' · ')} <span class="sub">(sheet, section 6)</span>`);
  const KEY=dgKeyL;
  const opp=s=>(DGS[s]||{}).opposite;
  const signNote=s=>`<br><span class="sub">Reading note (ruler + exaltation): “${esc(s.note)}”</span>`;

  /* rulership (domicile) */
  rel({id:'dg.dom',deck:D,name:'Planet → its domicile sign(s)',dirs:['f'],sim:(a,b)=>a.v.n===b.v.n?1.5:0,
    fq:it=>`Which sign or signs does ${it.s.h} rule?`,
    items:CL.map(p=>Array.isArray(p.domicile)&&p.domicile.length?pItem(p,setS(p.domicile),'dom',{fx:p.domicile.map(s=>'rul:'+s),
      note:()=>`${dgPl(p)} rules ${esc(dgQL(p,'rules'))}. ${KEY('Domicile')}`,noteL:()=>KEY('Domicile')}):null)});
  rel({id:'dg.ruler',deck:D,name:'Sign → its ruler',dirs:['f'],
    fq:it=>`Which planet rules ${it.s.h}?`,
    items:SG.map(s=>DGP[s.ruler]?{key:s.sign,row:S(s.sign),sg:s.sign,fx:['rul:'+s.sign],s:sgS(s.sign),v:plS(DGP[s.ruler]),
      note:()=>`${dgSg(s.sign)} (${dgAtuH(s)}) is ruled by ${dgPn(s.ruler)}. ${KEY('Domicile')}${signNote(s)}`,noteL:()=>KEY('Domicile')}:null)});

  /* exaltation: the seven and the nodes; Leo, Scorpio and Aquarius have none ("None" is an answer, and a distractor elsewhere) */
  rel({id:'dg.exa',deck:D,name:'Planet → its exaltation',dirs:['f'],
    fq:it=>`In which sign is ${it.s.h} exalted?`,
    items:EX.map(p=>pItem(p,sgS(p.exaltation),'exa',{fx:['exa:'+p.exaltation],
      note:()=>`${dgPl(p)} is exalted in ${esc(dgQL(p,'exaltedIn'))}.${p.kind==='node'&&R.nodes?' '+esc(R.nodes):''} ${KEY('Exaltation')}`,noteL:()=>KEY('Exaltation')}))});
  rel({id:'dg.exs',deck:D,name:'Sign → the planet exalted there',dirs:['f'],
    fq:it=>`Which planet is exalted in ${it.s.h}?`,
    items:SG.map(s=>{const p=s.exalted&&DGP[s.exalted];
      return{key:s.sign,row:S(s.sign),sg:s.sign,fx:['exa:'+s.sign],s:sgS(s.sign),v:p?plS(p):noneS('exalted'),
        note:p?()=>`${dgPl(p)} is exalted in ${dgSg(s.sign)} (${dgAtuH(s)}). ${KEY('Exaltation')}${signNote(s)}`:()=>`${esc(R.noEx)}${signNote(s)}`,
        noteL:p?()=>KEY('Exaltation'):()=>`No planet is exalted in ${dgSg(s.sign)} in this scheme (later astrologers give it an outer planet; Crowley does not).`};})});

  /* detriment = the ruler of the opposite sign */
  rel({id:'dg.det',deck:D,name:'Planet → its detriment sign(s)',dirs:['f'],sim:(a,b)=>a.v.n===b.v.n?1.5:0,
    fq:it=>`In which sign or signs is ${it.s.h} in detriment?`,
    items:CL.map(p=>Array.isArray(p.detriment)&&p.detriment.length?pItem(p,setS(p.detriment),'det',{fx:p.detriment.map(s=>'det:'+s),
      note:()=>`${esc(R.det)}: ${dgPl(p)} rules ${listAnd(p.domicile.map(dgSg))}; opposite ${p.domicile.length>1?'them lie':'it lies'} ${listAnd(p.domicile.map(s=>dgSg(opp(s))))}. ${KEY('Detriment')}`,
      noteL:()=>`${esc(R.det)}. ${KEY('Detriment')}`}):null)});
  rel({id:'dg.dets',deck:D,name:'Sign → the planet in detriment there',dirs:['f'],
    fq:it=>`Which planet is in detriment in ${it.s.h}?`,
    items:SG.map(s=>DGP[s.detriment]&&DGS[s.opposite]?{key:s.sign,row:S(s.sign),sg:s.sign,fx:['det:'+s.sign],s:sgS(s.sign),v:plS(DGP[s.detriment]),
      note:()=>`${esc(R.det)}: opposite ${dgSg(s.sign)} lies ${dgSg(s.opposite)}, ruled by ${dgPn(DGS[s.opposite].ruler)}. ${KEY('Detriment')}`,
      noteL:()=>`${esc(R.det)}. ${KEY('Detriment')}`}:null)});

  /* fall = the exalted planet of the opposite sign */
  rel({id:'dg.fal',deck:D,name:'Planet → its fall',dirs:['f'],
    fq:it=>`In which sign is ${it.s.h} in its fall?`,
    items:EX.filter(p=>p.fall&&DGS[p.fall]).map(p=>pItem(p,sgS(p.fall),'fal',{fx:['fal:'+p.fall],
      note:()=>`${esc(R.fall)}: ${dgPl(p)} is exalted in ${dgSg(p.exaltation)}; opposite it lies ${dgSg(opp(p.exaltation))}. ${KEY('Fall')}`,
      noteL:()=>`${esc(R.fall)}. ${KEY('Fall')}`}))});
  rel({id:'dg.fals',deck:D,name:'Sign → the planet in its fall there',dirs:['f'],
    fq:it=>`Which planet is in its fall in ${it.s.h}?`,
    items:SG.map(s=>{const p=s.fall&&DGP[s.fall];if(!DGS[s.opposite])return null;
      return{key:s.sign,row:S(s.sign),sg:s.sign,fx:['fal:'+s.sign],s:sgS(s.sign),v:p?plS(p):noneS('in its fall'),
        note:p?()=>`${esc(R.fall)}: opposite ${dgSg(s.sign)} lies ${dgSg(s.opposite)}, where ${dgPl(p)} is exalted. ${KEY('Fall')}`
          :()=>`${esc(R.fall)}: opposite ${dgSg(s.sign)} lies ${dgSg(s.opposite)}, which has no exaltation — so nothing falls in ${esc(s.sign)}.`,
        noteL:p?()=>`${esc(R.fall)}. ${KEY('Fall')}`:()=>`${esc(R.fall)}; the sign opposite ${dgSg(s.sign)} has no exaltation, so nothing falls here.`};})});
  rel({id:'dg.opp',deck:D,name:'Sign → the opposite sign',dirs:['f'],near:(a,b)=>b.v.t===a.s.t,   // (never the sign itself as an option)
    fq:it=>`Which sign is opposite ${it.s.h}?`,
    items:SG.map(s=>DGS[s.opposite]?{key:s.sign,row:S(s.sign),sg:s.sign,fx:['opp:'+[s.sign,s.opposite].sort().join('|')],s:sgS(s.sign),v:sgS(s.opposite),
      note:()=>`Opposite signs lie six signs apart. ${esc(R.det)}; ${esc(R.fall.charAt(0).toLowerCase()+R.fall.slice(1))}.`}:null)});

  /* planet in sign → its dignity (all seven in all twelve; the nodes where the sheet gives them one) */
  // the kinds of answer: each dignity alone, peregrine (none), and the two doubles (both that strengthen, both that weaken: Mercury in
  // Virgo, in Pisces)
  const DIGC=[...DKINDS.map(k=>[k.name]),[],...['strengthens','weakens'].map(e=>DKINDS.filter(k=>k.effect===e).map(k=>k.name))];
  const dparts=d=>d.length?d.map(x=>x.toLowerCase()):['peregrine'];
  const catS=d=>{const t=digLabel(d),hf=d.length?`<b>${esc(t)}</b>`:'<b>Peregrine</b> — none of the four';
    return side(t,{cat:'dcat',typ:false,parts:dparts(d),ck:'dig:'+norm(t),h:d.length?`<b>${esc(t)}</b>`:'<b>Peregrine</b><small>none of the four</small>',hf,hl:hf});};
  RB.catS=catS;
  // the options: the other kinds of dignity (never one that shares a part with the answer: "Domicile" beside "Domicile and exaltation").
  // A double answer (Mercury in Virgo, in Pisces) always has the other double beside it, so that it is not the one odd-looking option
  const catSynth=(mk,peregrine)=>it=>{const own=new Set(it.v.parts),dbl=it.v.parts.length>1;
    return DIGC.filter(d=>(peregrine||d.length)&&!dparts(d).some(x=>own.has(x))).map(d=>({sd:mk(d),sc:(d.length>1?(dbl?6:2.6):4)+Math.random()}));};
  const ruleOf=d=>[d.includes('Detriment')?esc(R.det)+'.':'',d.includes('Fall')?esc(R.fall)+'.':'',d.length?'':'Peregrine: it neither rules nor is exalted, in detriment nor in fall here.'].filter(Boolean).join(' ');
  const keyOf=d=>d.map(KEY).join(' ');
  // the sheet's columns read for the pair (outside Learn: it names the planet's other signs)
  const why=(p,sn,d)=>{
    if(!d.length){const f=[['rules',p.domicile],['is exalted in',p.exaltation],['is in detriment in',p.detriment],['is in its fall in',p.fall]]
      .filter(x=>x[1]&&(!Array.isArray(x[1])||x[1].length)).map(([w,v])=>`${w} ${listAnd([].concat(v).map(esc))}`);
      return `${dgPl(p)} ${listAnd(f)}; ${esc(sn)} is none of these.`;}
    return d.map(k=>k==='Domicile'?`${dgPl(p)} rules ${dgSg(sn)}.`:k==='Exaltation'?`${dgPl(p)} is exalted in ${dgSg(sn)}.`
      :k==='Detriment'?`${esc(R.det)}: ${dgPl(p)} rules ${dgSg(opp(sn))}, opposite ${esc(sn)}.`
      :`${esc(R.fall)}: ${dgPl(p)} is exalted in ${dgSg(opp(sn))}, opposite ${esc(sn)}.`).join(' ');
  };
  const PIS=[];CL.concat(PL.filter(p=>p.kind==='node')).forEach(p=>SIGNS.forEach(sn=>{const d=digIn(p.planet,sn);if(p.kind!=='node'||d.length)PIS.push({p,sn,d});}));
  // the facts a pair's dignity states: "Mercury in Pisces: detriment and fall" answers "who is in its fall in Pisces?" too
  const FXK=Object.fromEntries(DKINDS.map(k=>[k.name,{domicile:'rul:',exaltation:'exa:',detriment:'det:',fall:'fal:'}[k.id]]));   // (the facts' keys)
  const pisFx=(pn,sn,d)=>['pis:'+pn+':'+sn,...d.map(k=>FXK[k]+sn)];
  rel({id:'dg.pis',deck:D,name:'Planet in sign → its dignity',dirs:['f'],noLP:true,synth:catSynth(catS,true),
    fq:it=>`${it.s.h} is in its…?`,
    items:PIS.map(({p,sn,d})=>({key:p.id+'@'+sn,row:P(p),pk:p.kind,sp:p.planet,sg:sn,fx:pisFx(p.planet,sn,d),
      s:side(`${p.planet} in ${sn}`,{h:`${dgPl(p)} in ${dgSg(sn)}`,cat:'dpis',typ:false}),v:catS(d),
      note:()=>why(p,sn,d)+' '+keyOf(d),noteL:()=>(ruleOf(d)+' '+keyOf(d)).trim()}))});

  /* reading the cards: a planetary Atu beside a zodiacal Atu (only pairs where the sheet's rule gives an answer), and the decans */
  const XRT=Object.fromEntries(DKINDS.map(k=>[k.name,k.phrase]));   // "it rules the sign" … (tab Dignity kinds, column phrase)
  const xS=d=>{const st=digStrong(d),w=st?'Strengthened':'Weakened',why=d.length>1?(st?'it rules and is exalted there':'it is in detriment and in its fall there'):XRT[d[0]],hf=`<b>${w}</b> — ${esc(why)}`;
    return side(`${w} — ${why}`,{h:`<b>${w}</b><small>${esc(why)}</small>`,hf,hl:hf,cat:'dxref',typ:false,parts:dparts(d),ck:'x:'+dparts(d).join('+')});};
  const CR=(DG.crossRef&&Array.isArray(DG.crossRef.sentences))?DG.crossRef.sentences:[];
  // in a Learn session the sheet's rule is quoted without its example pairs: "(Tower + Adjustment = Mars in Libra)" would answer
  // that very pair, which the same stage quiz may ask a few questions later
  const CRL=CR.map(t=>String(t).replace(/\s*\([^()]*\)/g,'').trim());
  const xNote=(p,s,d,cr)=>`${dgAtuH(p)} is ${dgPl(p)}; ${dgAtuH(s)} is ${dgSg(s.sign)}: ${esc(p.planet)} in ${esc(s.sign)} = <b>${esc(digLabel(d).toLowerCase())}</b>.`
    +(cr[digStrong(d)?0:1]?` <span class="sub">Sheet: “${esc(cr[digStrong(d)?0:1])}”</span>`:'');
  const XR=[];CL.forEach(p=>{if(p.card)SG.forEach(s=>{const d=digIn(p.planet,s.sign);if(d.length&&!(digStrong(d)&&digWeak(d)))XR.push({p,s,d});});});
  rel({id:'dg.xref',deck:D,name:'Planetary Atu beside zodiacal Atu → strengthened or weakened',dirs:['f'],noLP:true,synth:catSynth(xS,false),
    // (the options also name the dignity, so the question asks for it: "Weakened — in detriment" is wrong for Saturn in Aries, its fall)
    fq:it=>`In a spread, ${it.s.h}. Is <b>${esc(it.pc)}</b> strengthened or weakened by it — and by which dignity?`,
    items:XR.map(({p,s,d})=>({key:p.id+'@'+s.sign,row:P(p),pk:p.kind,sp:p.planet,sg:s.sign,pc:dgAtu(p),fx:pisFx(p.planet,s.sign,d),
      s:side(`${dgAtu(p)} beside ${dgAtu(s)}`,{h:`${dgAtuH(p)} lies beside ${dgAtuH(s)}`,cat:'dpair',typ:false}),v:xS(d),
      note:()=>xNote(p,s,d,CR),noteL:()=>xNote(p,s,d,CRL)}))});
  if(DECAN.length===36)rel({id:'dg.decan',deck:D,name:'Small card (its decan) → the dignity of its planet',dirs:['f'],noLP:true,synth:catSynth(catS,true),
    fq:it=>`The <b>${esc(it.cn)}</b> is ${it.pis}. Which dignity is it in?`,
    items:DECAN.map(d=>{const p=DGP[d.ruler];if(!p||!DGS[d.sign]||!d.suit)return null;const dd=digIn(d.ruler,d.sign),cn=`${NUMW[d.n]} of ${d.suit.n}`,pis=`${dgPl(p)} in ${dgSg(d.sign)}`;
      return{key:d.key,row:S(d.sign),pk:p.kind,sp:p.planet,sg:d.sign,cn,pis,fx:pisFx(p.planet,d.sign,dd),
        s:side(cn,{h:`<b>${esc(cn)}</b> <span class="sub">· ${pis}</span>`,cat:'dcard',typ:false}),v:catS(dd),
        note:()=>`${esc(cn)} = ${pis} (${esc(d.sign)} ${d.rn}). ${why(p,d.sign,dd)} ${keyOf(dd)}`+(CR[2]?` <span class="sub">Sheet: “${esc(CR[2])}”</span>`:''),
        noteL:()=>`${esc(cn)} = ${pis}: <b>${esc(digLabel(dd).toLowerCase())}</b>. ${ruleOf(dd)} ${keyOf(dd)}`};})});

  /* the Atus */
  rel({id:'dg.satu',deck:D,name:'Sign ↔ zodiacal Atu',
    fq:it=>`Which Atu is the sign ${it.s.h}?`,rq:it=>`Which sign does ${it.v.h} carry?`,
    items:SG.filter(s=>s.card).map(s=>({key:s.sign,row:S(s.sign),sg:s.sign,fx:['atu:'+s.sign],s:sgS(s.sign),v:atuS(s),
      note:spo(()=>`${dgSg(s.sign)} = ${dgAtuH(s)}.${signNote(s)}`),noteL:()=>`${dgSg(s.sign)} = ${dgAtuH(s)} <span class="sub">(sheet, section 1)</span>`}))});
  // Atu XIX Sun names its own planet: either way round the question would answer itself, so the Sun is left out here
  rel({id:'dg.patu',deck:D,name:'Planetary Atu ↔ planet',
    fq:it=>`Which planet is ${it.s.h}?`,rq:it=>`Which Atu is the planet ${it.v.h}?`,
    items:CL.filter(p=>p.card).map(p=>{const s=atuS(p),v=plS(p);if(namesAny([v.t,...v.alt],[p.card]))return null;
      return{key:p.id,row:P(p),pside:'v',pk:p.kind,sp:p.planet,fx:['patu:'+p.id],s,v,
        note:spo(()=>`${dgAtuH(p)} = ${dgPl(p)}: rules ${esc(dgQL(p,'rules'))}; exalted in ${esc(dgQL(p,'exaltedIn'))}; detriment ${esc(dgQL(p,'detrimentIn'))}; fall ${esc(dgQL(p,'fallIn'))}.`),
        noteL:()=>`${dgAtuH(p)} = ${dgPl(p)} <span class="sub">(sheet, section 2)</span>`};})});
  const EL=(Array.isArray(DG.elemental)?DG.elemental:[]).filter(e=>e&&e.card&&e.element&&DGP[e.outer]);
  const eNote=e=>spo(()=>`${dgAtuH(e)} · ${esc(e.element)} · ${dgPn(e.outer)} · ${esc(e.letter||'')} <span class="sub">(Crowley's outer-planet pairing, sheet section 3)</span>`);
  // Learn: the Atu's element, or its outer planet — not both (a session may ask the other one about the same Atu)
  const eNoteL=(e,w)=>()=>`${dgAtuH(e)} · ${w} <span class="sub">(sheet, section 3)</span>`;
  const elS=t=>side(t,{cat:'delem'});
  rel({id:'dg.eatu.el',deck:D,name:'Elemental Atu ↔ element',synth:()=>[{sd:elS('Earth'),sc:3}],
    fq:it=>`Which element is ${it.s.h}?`,rq:it=>`Which elemental Atu is <b>${esc(it.v.t)}</b>?`,
    items:EL.map(e=>({key:String(e.atu),row:P(DGP[e.outer]),pside:'x',pk:'outer',sp:e.outer,fx:['e1:'+e.atu],s:atuS(e),v:elS(e.element),note:eNote(e),noteL:eNoteL(e,esc(e.element))}))});
  rel({id:'dg.eatu.pl',deck:D,name:'Elemental Atu ↔ outer planet',
    fq:it=>`Which outer planet does Crowley pair with ${it.s.h}?`,rq:it=>`Which Atu does Crowley pair with ${it.v.h}?`,
    items:EL.map(e=>({key:String(e.atu),row:P(DGP[e.outer]),pside:'v',pk:'outer',sp:e.outer,fx:['e2:'+e.atu],s:atuS(e),v:plS(DGP[e.outer]),note:eNote(e),noteL:eNoteL(e,dgPn(e.outer))}))});
  rel({id:'dg.elpl',deck:D,name:'Element ↔ outer planet',
    fq:it=>`Through its elemental Atu, which outer planet goes with <b>${esc(it.s.t)}</b>?`,rq:it=>`Through its elemental Atu, which element goes with ${it.v.h}?`,
    items:EL.map(e=>({key:e.element,row:P(DGP[e.outer]),pside:'v',pk:'outer',sp:e.outer,fx:['e1:'+e.atu,'e2:'+e.atu],s:elS(e.element),v:plS(DGP[e.outer]),note:eNote(e),
      noteL:eNoteL(e,`${esc(e.element)} · ${dgPn(e.outer)}`)}))});

  /* planetary nature (section 4). A reverse card exists only where one planet has the value (buildCards) */
  // The nodes' "Benefic (by tradition)" / "Malefic (by tradition)" read as true of every benefic / malefic (Jupiter is a benefic by
  // tradition): never offered against Jupiter, Venus, the Sun, the Moon / Saturn, Mars, nor they against it
  const byTrad=(a,b)=>{const T=/\(by tradition\)/i,B=t=>(String(t).match(/\b(benefic|malefic)\b/i)||[])[1];
    return (T.test(a.v.t)||T.test(b.v.t))&&!!B(a.v.t)&&norm(B(a.v.t))===norm(B(b.v.t));};
  [['dg.nat','nature','Planet ↔ nature',h=>`What is the nature of ${h}?`,v=>`Which planet is <b>${v}</b> by nature?`,byTrad],
   ['dg.temp','temperament','Planet ↔ temperament',h=>`What is the temperament of ${h}?`,v=>`Which planet's temperament is <b>${v}</b>?`],
   ['dg.sect','sect','Planet ↔ sect / gender',h=>`Sect / gender of ${h}?`,v=>`Which planet is <b>${v}</b> (sect / gender)?`],
   ['dg.prin','principle','Planet ↔ core principle',h=>`What is the core principle of ${h}?`,v=>`Which planet's core principle is <b>${v}</b>?`]
  ].forEach(([id,f,name,fq,rq,nr])=>rel({id,deck:D,name,sim:kind,near:(a,b)=>nearName(a,b)||!!(nr&&nr(a,b)),fq:it=>fq(it.s.h),rq:it=>rq(esc(it.v.t)),
    items:PL.map(p=>pItem(p,txt(p[f],'d'+f),f,{note:s4(p)}))}));
  // keyword lists. Shown without what names a card: the outer planets' "(Fool's air)"… and Jupiter's "Fortune" (its Atu is X Fortune)
  const kwBare=k=>String(k).replace(/\s*\([^)]*\)/g,'').trim();
  // (capitalised like the other lists once "Fortune" is gone: a lower-case "generosity, …" would stand out as the odd option)
  const kwS=(p,a,cat)=>{const sh=a.map(kwBare).filter(k=>k&&!(p.card&&norm(k)===norm(p.card))).join(', ');
    return side(a.join(', '),{h:esc(sh.charAt(0).toUpperCase()+sh.slice(1)),hf:esc(a.join(', ')),cat,typ:false,parts:a.map(k=>norm(kwBare(k))).filter(Boolean)});};
  const kwNote=p=>spo(()=>`${dgPl(p)} — dignified: ${esc((p.dignified||[]).join(', '))}; ill-dignified: ${esc((p.ill||[]).join(', '))}.`);
  rel({id:'dg.dig',deck:D,name:'Planet ↔ dignified keywords',sim:kind,
    fq:it=>`Which keywords describe ${it.s.h} <b>dignified</b>?`,rq:it=>`Which planet, dignified, shows as: <b>${it.v.h}</b>?`,
    items:PL.map(p=>Array.isArray(p.dignified)&&p.dignified.length?pItem(p,kwS(p,p.dignified,'dkwd'),'kwd',{note:kwNote(p)}):null)});
  rel({id:'dg.ill',deck:D,name:'Planet ↔ ill-dignified keywords',sim:kind,
    fq:it=>`Which keywords describe ${it.s.h} <b>ill-dignified</b>?`,rq:it=>`Which planet, ill-dignified, shows as: <b>${it.v.h}</b>?`,
    items:PL.map(p=>Array.isArray(p.ill)&&p.ill.length?pItem(p,kwS(p,p.ill,'dkwi'),'kwi',{note:kwNote(p)}):null)});
  const KWQ=[];PL.filter(p=>p.kind!=='outer').forEach(p=>[['dignified','Dignified'],['ill','Ill-dignified']].forEach(([f,lab])=>
    (Array.isArray(p[f])?p[f]:[]).forEach(k=>KWQ.push({p,k,lab}))));
  rel({id:'dg.kwq',deck:D,name:'Keyword → dignified or ill-dignified',dirs:['f'],
    fq:it=>`Is “${esc(it.kw)}” a dignified or an ill-dignified keyword of ${it.s.h}?`,
    items:KWQ.map(({p,k,lab})=>({key:p.id+':'+norm(k),row:P(p),pside:'s',pk:p.kind,sp:p.planet,kw:k,fx:['kwd:'+p.id,'kwi:'+p.id],s:plS(p),
      v:side(lab,{cat:'dkq',typ:false,ck:'kq:'+lab}),note:kwNote(p),noteL:()=>`“${esc(k)}” is one of ${dgPl(p)}'s ${lab.toLowerCase()} keywords.`}))});
  const RK=DG.readingKey||{};
  // a key's label also typed as its dignity's name, short label or other spellings (Ruler: Domicile, Rulership…; tab Dignity kinds)
  const keyAlt=k=>{const x=DKINDS.find(y=>y.key_label===k);return x?uniq([x.name,...DB.items(x.spellings),x.short_label].filter(a=>a&&a!==k)):[];};
  rel({id:'dg.key',deck:D,name:'Dignity ↔ its meaning (reading key)',
    fq:it=>`In the reading key, what does ${it.s.h} mean for a card?`,rq:it=>`Reading key: “${esc(it.v.t)}” — which dignity is this?`,
    items:Object.keys(RK).map(k=>({key:k,row:'dk',fx:['key:'+k],
      s:side(k,{cat:'dkey',h:`<b>${esc(k)}</b>${k==='Ruler'?' (domicile)':''}`,alt:keyAlt(k)}),
      v:side(RK[k],{cat:'dmean',typ:false}),note:spo(()=>Object.keys(RK).map(dgKeyL).join('<br>')),noteL:()=>dgKeyL(k)+' <span class="sub">(sheet, section 3)</span>'}))});

  /* correspondences (section 5) */
  // the Sephiroth a sheet cell may name (tab Sephiroth), and Da'ath, which is no Sephirah of the ten (Pluto: "Da'ath / Kether")
  const SEPHN=[...SEPHS.map(s=>s.name),"Da'ath"];
  rel({id:'dg.seph',deck:D,name:'Planet ↔ sephira',sim:kind,
    fq:it=>`Which sephira belongs to ${it.s.h}?`,rq:it=>`Which planet is given the sephira <b>${esc(it.v.t)}</b>?`,
    // parts: Neptune "Kether (later use)" and Pluto "Da'ath / Kether (unsettled)" both name Kether, so neither is offered against the other
    items:PL.map(p=>{if(!p.sephira)return null;const m=String(p.sephira).match(/^(\d+)\s+([A-Za-z']+)$/);
      return pItem(p,side(p.sephira,{cat:'dseph',typ:!!m,parts:SEPHN.filter(n=>namesAny([p.sephira],[n])).map(norm),alt:m?[m[2],...(SEPH_ALT[m[2]]||[])]:[]}),'seph',
        {fx:['seph:'+p.id,'n:'+p.id],note:s5(p)});})});
  const letAlt=n=>uniq(Object.keys(LETTER_ALT).filter(k=>k===n||LETTER_ALT[k].includes(n)).flatMap(k=>[k,...LETTER_ALT[k]])).filter(x=>x!==n);
  rel({id:'dg.letter',deck:D,name:'Planet ↔ Hebrew letter',sim:kind,
    fq:it=>`Which Hebrew letter belongs to ${it.s.h}?`,rq:it=>`Which planet has the letter ${it.v.h}?`,
    items:PL.map(p=>{const L=letP(p.letter);return L?pItem(p,side(L.n,{h:`${esc(L.n)} ${he(L.g)}`,cat:'dlet',alt:letAlt(L.n)}),'let',{note:s5(p)}):null;})});
  // the kamea's size is the sephira's number (3 Binah, 3×3): one fact ('n:'), asked once in a Learn session
  const KA=CL.filter(p=>Number.isInteger(p.kameaSize)&&Number.isInteger(p.kameaSum));
  const kNote=p=>spo(()=>`${dgPl(p)}: kamea ${esc(p.kamea)}, sephira ${esc(p.sephira)}. A planet's kamea has as many rows as its sephira's number, and every row, column and diagonal adds up to n(n²+1)/2.`);
  rel({id:'dg.ksize',deck:D,name:'Planet → size of its kamea',dirs:['f'],
    fq:it=>`How large is the kamea (magic square) of ${it.s.h}?`,
    items:KA.map(p=>pItem(p,side(String(p.kameaSize),{num:true,cat:'dksize',h:`${p.kameaSize}×${p.kameaSize}`}),'ksize',{fx:['n:'+p.id],note:kNote(p),
      noteL:()=>`${dgPl(p)} · kamea <b>${p.kameaSize}×${p.kameaSize}</b>: a planet's kamea has as many rows as its sephira's number. <span class="sub">(sheet, section 5)</span>`}))});
  rel({id:'dg.ksum',deck:D,name:'Planet ↔ row sum of its kamea',
    fq:it=>`Each row of the kamea of ${it.s.h} adds up to…?`,rq:it=>`Which planet's kamea has rows adding up to <b>${esc(it.v.t)}</b>?`,
    // (noteL without the square's size: "How large is the kamea…?" may be asked in the same Learn session)
    items:KA.map(p=>pItem(p,side(String(p.kameaSum),{num:true,cat:'dksum'}),'ksum',{note:kNote(p),
      noteL:()=>`${dgPl(p)} · every row, column and diagonal of its kamea adds up to <b>${p.kameaSum}</b>. <span class="sub">(sheet, section 5)</span>`}))});
  // near: colours sharing a word (Blue / Deep blue, Orange / Glowing orange-scarlet) are never offered against each other
  const shareW=(a,b)=>{const A=wset(a);return [...wset(b)].some(w=>A.has(w));};
  const cNote=p=>()=>`${swatch([p.hex])}${esc(p.colour||'')}. <span class="sub">${esc(((DG.correspondenceNotes||[])[0])||'')}${p.kind==='outer'&&(DG.correspondenceNotes||[])[1]?' '+esc(DG.correspondenceNotes[1]):''}</span>`;
  rel({id:'dg.colour',deck:D,name:'Planet ↔ King-scale colour',sim:kind,near:(a,b)=>shareW(a.v.t,b.v.t),
    fq:it=>`King-scale colour of ${it.s.h}?`,rq:it=>`Which planet has the King-scale colour <b>${esc(it.v.t)}</b>?${swatch(it.v.hx,'lg')}`,
    items:PL.map(p=>p.colourName&&HEX6.test(p.hex||'')?pItem(p,side(p.colourName,{h:swatch([p.hex])+esc(p.colourName),hf:swatch([p.hex])+esc(p.colourName)+` <span class="sub">${esc(p.hex)}</span>`,hx:[p.hex],cat:'colour',typ:false}),'col',{note:cNote(p)}):null)});
  rel({id:'dg.metal',deck:D,name:'Planet ↔ metal',
    fq:it=>`Which metal belongs to ${it.s.h}?`,rq:it=>`Which planet's metal is <b>${esc(it.v.t)}</b>?`,
    // (quicksilver is the metal mercury: "Which metal belongs to Mercury?" would answer itself, so pItem leaves it out like Saturday)
    items:CL.map(p=>pItem(p,txt(p.metal,'dmetal',{typ:true,alt:/^quicksilver$/i.test(p.metal||'')?['Mercury']:[]}),'metal',{note:s5(p)}))});
  const two=CL.filter(p=>/\//.test(p.archangel||''));
  const archNote=spo(()=>`The sheet gives ${two.map(p=>`${dgPl(p)} ${esc(p.archangel)}`).join(' and ')}. ${ARCH_NOTE}`);
  rel({id:'dg.arch',deck:D,name:'Planet ↔ archangel',
    fq:it=>`Which archangel belongs to ${it.s.h}?`,rq:it=>`Which planet's archangel is <b>${esc(it.v.t)}</b>?`,
    items:CL.map(p=>p.archangel?pItem(p,side(p.archangel,{cat:'darch',typ:!/[\/(]/.test(p.archangel),alt:NAME_ALT[p.archangel]||[]}),'arch',
      {note:/\//.test(p.archangel)?archNote:s5(p)}):null)});

  /* physical & temporal properties (section 6) */
  rel({id:'dg.day',deck:D,name:'Planet ↔ day',   // (Saturday, Sunday and Monday name their planets: left out by pItem)
    fq:it=>`Which day belongs to ${it.s.h}?`,rq:it=>`Which planet rules <b>${esc(it.v.t)}</b>?`,
    items:CL.map(p=>pItem(p,txt(p.day,'dday',{typ:true}),'day',{note:s6(p)}))});
  // near: cycles sharing a figure ("1 yr" / "~1 yr (synodic 584 d)"; Saturn's 29.5 yr / the Moon's 29.5 d) are never offered against each other
  const figs=t=>new Set(String(t).match(/\d+(?:\.\d+)?/g)||[]);
  rel({id:'dg.cycle',deck:D,name:'Planet ↔ cycle',sim:kind,near:(a,b)=>{const A=figs(a.v.t);return [...figs(b.v.t)].some(x=>A.has(x));},
    fq:it=>`What is the cycle (approx.) of ${it.s.h}?`,rq:it=>`Which planet's cycle is <b>${esc(it.v.t)}</b>?`,
    items:PL.map(p=>pItem(p,txt(p.cycle,'dcycle'),'cyc',{note:s6(p)}))});
  // near: the outer planets' modern cells re-assign organs the seven already hold (Uranus "Nervous system" / Mercury "Nerves", Pluto
  // "Reproduction" / Venus "reproductive organs", the Moon's womb), so an outer planet and a classical one are never offered against each other
  rel({id:'dg.body',deck:D,name:'Planet ↔ body / physiology',sim:kind,near:(a,b)=>a.pk!=='node'&&b.pk!=='node'&&(a.pk==='outer')!==(b.pk==='outer'),
    fq:it=>`Which parts of the body belong to ${it.s.h}?`,rq:it=>`Which planet governs <b>${esc(it.v.t)}</b>?`,

/* ---------- cards ---------- */
function buildCards(){
  CARDS=[];CARD={};ROWCARDS={};TCARDS={};
  RELS.forEach((r,ri)=>{
    const vc={}; r.items.forEach(it=>{const k=ckey(it.v);vc[k]=(vc[k]||0)+1;});
    r.byRow={}; r.items.forEach(it=>{if(it.row&&!r.byRow[it.row])r.byRow[it.row]=it;});
    // items short enough for a matching exercise; each exercise draws its own non-overlapping five (see pickMatch). Not an item
    // whose own directions are restricted (it.dirs: its text gives its subject away one way round, e.g. a card's keywords naming
    // its suit): a matching shows both sides at once
    r.matchPool=r.items.filter(it=>!it.dirs&&it.v.t.length<=60&&it.s.t.length<=60);
    r.matchN=new Set(r.matchPool.map(it=>ckey(it.v))).size;
    r.items.forEach((it,ii)=>r.dirs.forEach(dir=>{
      if(it.dirs&&!it.dirs.includes(dir))return;   // an item asked one way round only, or not at all (it stays an option)
      if(dir==='r'&&vc[ckey(it.v)]>1)return;   // a reverse card only when the value points to one item
      const c={id:`${r.id}|${it.key}|${dir}`,rel:r,it,dir,deck:r.deck,row:it.row||null,ri,ii};
      CARDS.push(c);CARD[c.id]=c;
      if(c.row)(ROWCARDS[c.row]=ROWCARDS[c.row]||[]).push(c);
      if(it.tc)(TCARDS[it.tc]=TCARDS[it.tc]||[]).push(c);   // every card of any deck that touches this Tarot card
    }));
  });
}

/* ---------- scheduler (Leitner boxes) & statistics ---------- */
const today=()=>dayNum();
function newLeft(){const t=today();const used=ST.newDay.d===t?ST.newDay.n:0;return Math.max(0,ST.set.newPerDay-used);}
// The box and due day a card gets after an answer (s: its stored state, or null for a new card).
// Only a new or due card moves up: extra right answers before the due day leave the schedule alone.
// A miss always sends the card back to box 1. opt.lapsed: missed earlier in this session; opt.easy: jump two boxes.
function schedule(s,ok,opt,t){
  if(!ok)return{b:1,d:t+INTERVAL[1]};
  if(s&&s.d>t)return{b:s.b,d:s.d};
  const b0=s?s.b:0,b=opt.lapsed?Math.max(1,b0):Math.min(5,b0+(opt.easy?2:1));
  return{b,d:t+INTERVAL[b]};
}
// Practice, Today's review and Flashcards share the new-cards-per-day allowance: a new card joins the schedule only while some is
// left. Past the limit it can still be practised, but it is not scheduled (returns false). opt.free (a Learn quiz or a learning
// path's stage, see settle): what was just taught joins the schedule whatever is left, and does not use the allowance up.
function grade(id,ok,opt){
  opt=opt||{}; const t=today(); let s=ST.cards[id];
  if(!s&&!opt.free){if(newLeft()<=0)return false;if(ST.newDay.d!==t)ST.newDay={d:t,n:0};ST.newDay.n++;}
  const nx=schedule(s||null,ok,opt,t);
  if(!s)s=ST.cards[id]={b:0,d:t,n:0,k:0};
  s.n++;if(ok)s.k++;s.b=nx.b;s.d=nx.d;
  return true;
}
function record(ok){const t=today();ST.stats.total++;if(ok)ST.stats.correct++;const d=ST.stats.days[t]||(ST.stats.days[t]=[0,0]);d[0]++;if(ok)d[1]++;}
function dayStreak(){const t=today(),has=d=>ST.stats.days[d]&&ST.stats.days[d][0]>0;let d=has(t)?t:t-1,n=0;while(has(d)){n++;d--;}return n;}
function mastery(cards){let m=0,l=0;cards.forEach(c=>{const s=ST.cards[c.id];if(s){if(s.b>=3)m++;else l++;}});const n=cards.length||1;return{m:m/n,l:l/n,mc:m,n:cards.length};}
function boxMastery(cs){if(!cs||!cs.length)return 0;let sum=0;cs.forEach(c=>{const s=ST.cards[c.id];if(s)sum+=s.b/5;});return sum/cs.length;}
const rowMastery=row=>boxMastery(ROWCARDS[row]);
// a Tarot card's or a spirit's mastery counts the questions its Learn quiz asks (not the reverse and duplicate cards it never asks)
const cardPool=key=>LPOOL['t'+key]||(LPOOL['t'+key]=learnCardPool(key));
const spiritPool=n=>LPOOL['g'+n]||(LPOOL['g'+n]=learnSpiritPool(n));
