*{box-sizing:border-box}
:root{--bg:#faf7f0;--card:#fff;--ink:#1a1712;--sub:#6b6357;--acc:#7a5c2e;--line:#e3ddd0;--chip:#f0ebe0}
@media(prefers-color-scheme:dark){:root{--bg:#14120e;--card:#1e1b15;--ink:#ece5d8;--sub:#9a9184;--acc:#d0a85c;--line:#33302a;--chip:#2a261e}}
html,body{margin:0}
body{font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
header{padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0}h1 small{color:var(--sub);font-weight:400}
main{max-width:640px;margin:0 auto;padding:14px}
.intro{color:var(--sub);font-size:13.5px;line-height:1.5;margin:2px 2px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tt{font-family:Georgia,'Times New Roman',serif;font-size:21px;font-weight:600;margin:0}
.ts{color:var(--sub);font-size:13.5px;line-height:1.45;margin:3px 0 12px}
.art{display:flex;justify-content:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px}
.art svg{width:100%;height:auto;max-width:460px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:4px 10px;font-size:12px;color:var(--sub)}
.corr{font-size:13.5px;line-height:1.55;color:var(--ink);background:var(--chip);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.corr b{color:var(--acc)}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--acc);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'▸ ';font-size:12px}
details[open] summary::before{content:'▾ '}
ol{margin:10px 0 4px;padding-left:20px}
ol li{margin:0 0 8px;line-height:1.5;font-size:14px}
.save{display:inline-block;margin-top:10px;font-size:13px;color:var(--acc);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:7px 12px;background:var(--card)}
.foot{color:var(--sub);font-size:12px;text-align:center;margin:6px 0 20px;line-height:1.5}
</style></head><body>

<script>
/* The talismans' texts are content tables (data/db: talismans and the tool texts, edited in the content workbook),
   read through lib/db.js. Each seal's picture stays in this page, in the card with the talisman's ID; the {names} in
   its texts are filled from the tables (tools/content/schema.py: talismans), the magic square's sums and the planet's
   Intelligence and Spirit from tab Kameas. */
const fill=(s,v)=>String(s||'').replace(/\{(\w+)\}/g,(m,k)=>v[k]!=null?String(v[k]):m);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.querySelector('.intro').innerHTML=DB.text('talis.intro');
document.querySelector('.foot').innerHTML=DB.text('talis.foot');
function talismanVars(t){
  const p=DB.get('planets',t.planet), s=DB.ref(p,'sephira'), wd=DB.rev('weekdays','planet',p.id)[0], k=DB.get('kameas',p.id)||{};
  return {planet:p.name, day:wd.name, metal:(p.metal||'').toLowerCase(), sephira:s.name, heaven:s.heaven,
    god_name:s.god_name, god_name_hebrew:s.god_name_hebrew, archangel:t.archangel||s.archangel,
    line_sum:k.line_sum, square_sum:k.square_sum, intelligence:k.intelligence&&esc(k.intelligence), spirit:k.spirit&&esc(k.spirit)};
}
DB.load('talismans','kameas').then(()=>{
  for(const t of DB.rows('talismans')){
    const card=document.getElementById(t.id); if(!card)continue;
    const v=talismanVars(t), q=s=>card.querySelector(s);
    q('.tt').innerHTML=fill(t.title,v);
    q('.ts').innerHTML=fill(t.subtitle,v);
    q('.chips').innerHTML=[v.day,'Hour of '+v.planet,t.moon,'Metal: '+v.metal,t.incense&&'Incense: '+t.incense].filter(Boolean)
      .map(c=>'<span class="chip">'+esc(c)+'</span>').join('');
    q('.corr').innerHTML=fill(t.correspondences,v);
    q('details ol').innerHTML=DB.items(t.steps).map(s=>'<li>'+fill(s,v)+'</li>').join('');
  }
}).catch(e=>{ document.querySelector('.intro').insertAdjacentHTML('afterend','<p class="intro">The talismans could not be loaded: '+esc(e.message||e)+'</p>'); });
</script></body></html>
