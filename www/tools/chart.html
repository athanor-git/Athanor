<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Athanor — Sign Chart Calculator</title>
<style>
:root{--bg:#faf7f0;--card:#fff;--ink:#1a1712;--sub:#6b6357;--acc:#7a5c2e;--line:#e3ddd0;--hit:#fff3c9;--warn:#a5542c;--on-acc:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#14120e;--card:#1e1b15;--ink:#ece5d8;--sub:#9a9184;--acc:#d0a85c;--line:#33302a;--hit:#4a3f1e;--warn:#e0936a;--on-acc:#14120e}}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px;z-index:5}
h1{font-size:17px;margin:0;letter-spacing:.04em;overflow-wrap:anywhere} h1 small{color:var(--sub);font-weight:400}
main{max-width:880px;margin:0 auto;padding:12px}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.frm label{font-size:12px;color:var(--sub);display:block}
.frm input,.frm select{width:100%;font-size:15px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
button{border:1px solid var(--acc);background:var(--acc);color:var(--on-acc);border-radius:8px;padding:9px 16px;font-size:15px;cursor:pointer}
button.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.bh{font-size:19px;font-weight:700}.bh .sub{color:var(--sub);font-size:13.5px;font-weight:400}
.sec{margin-top:8px}.sec .st{font-size:12px;letter-spacing:.08em;color:var(--acc);font-weight:700;text-transform:uppercase}
.kv{font-size:14px;margin:2px 0}.kv b{color:var(--acc);font-weight:600}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px;border:1px solid var(--line);vertical-align:-2px;margin-right:3px}
a.full{color:var(--acc);font-size:13px;cursor:pointer;text-decoration:underline}
.note{color:var(--sub);font-size:12.5px;margin-top:10px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;overflow:auto;padding:20px 10px}
#ovc{max-width:760px;margin:0 auto;background:var(--card);border-radius:12px;padding:14px}
table{border-collapse:collapse;width:100%}td{border-top:1px solid var(--line);padding:5px 7px;font-size:14px;vertical-align:top}
td.n{white-space:nowrap;color:var(--acc);font-weight:600;width:1%}td.t{color:var(--sub);width:34%}
@media(max-width:380px){td{padding:5px 4px}}
.close{float:right}
.saved{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2 input{flex:1 1 200px;min-width:0;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
.sc{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.slh+.sc{border-top:none;margin-top:6px}
.sc .nm{flex:1;min-width:0;cursor:pointer}.sc .nm b{display:block;color:var(--acc)}
.sc .nm span{display:block;color:var(--sub);font-size:12.5px}
.sc .nm b,.sc .nm span{overflow-wrap:anywhere}
.sc .nm span.sm{color:var(--ink)}
.sc button{padding:8px 12px;font-size:13px;min-height:44px;min-width:44px}
.hint{color:var(--sub);font-size:13px}
.slh{font-size:12px;letter-spacing:.08em;color:var(--acc);font-weight:700;text-transform:uppercase;margin-top:12px}
.sempty{font-size:12.5px;color:var(--sub);margin-top:6px}
.smsg{font-size:13px;color:var(--acc);margin-top:8px}

.smsg.err{color:var(--warn)}
.rmsg{background:var(--hit);border-radius:8px;padding:8px 10px;font-size:13px;margin:10px 0}
a.allc{display:inline-block;margin-top:8px;padding:6px 0;font-size:14px;font-weight:600;text-decoration:none}
.sumline{font-size:13.5px;color:var(--acc);margin-top:3px}

<header><h1>ATHANOR · SIGN CHART CALCULATOR <small>· positions → signs, decans, court &amp; minor cards → correspondences</small></h1></header>
<main>
<div class="card">
<div style="position:relative;margin-bottom:8px">
<label style="font-size:12px;color:var(--sub)">City (type to search — fills location &amp; UTC offset for the date)</label>

<div><label>Longitude °E (− for W)</label><input type="number" step="0.0001" id="lo" value="-74.0"></div>
</div>
<button onclick="go()">Calculate chart</button>
<button class="ghost" onclick="setNow()">Now</button>
<button class="ghost" onclick="geo()">Use my location</button>
<div class="saved">
 <div class="row2"><input id="sname" placeholder="Name this chart (e.g. My natal chart)" aria-label="Chart name" maxlength="120" autocomplete="off"><button onclick="saveChart()">Save chart</button><button class="ghost" id="exportBtn" onclick="exportChart()">Save as file</button></div>
 <div id="smsg" class="smsg" role="status" aria-live="polite"></div>

</div>
<div class="note"></div>
</div>
<div id="res"></div>
</main>

function helio(p, T){
  const e0=EL[p], a=e0[0]+e0[6]*T, ec=e0[1]+e0[7]*T, I=(e0[2]+e0[8]*T)*D2R,
        L=e0[3]+e0[9]*T, vp=e0[4]+e0[10]*T, Om=(e0[5]+e0[11]*T);
  let M=(L-vp)%360; if(M>180)M-=360; if(M<-180)M+=360;
  const w=(vp-Om)*D2R, OmR=Om*D2R;
  let E=M*D2R + ec*Math.sin(M*D2R);
  for(let i=0;i<8;i++){ const dE=(E-ec*Math.sin(E)-M*D2R)/(1-ec*Math.cos(E)); E-=dE; }
  const xp=a*(Math.cos(E)-ec), yp=a*Math.sqrt(1-ec*ec)*Math.sin(E);
  const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(OmR),sO=Math.sin(OmR),ci=Math.cos(I),si=Math.sin(I);
  return [ (cw*cO-sw*sO*ci)*xp + (-sw*cO-cw*sO*ci)*yp,
           (cw*sO+sw*cO*ci)*xp + (-sw*sO+cw*cO*ci)*yp,
           (sw*si)*xp + (cw*si)*yp ];
}
function lon(x,y){ let l=Math.atan2(y,x)/D2R; return (l%360+360)%360; }
function positions(JD){
  const T=(JD-2451545)/36525, E=helio('earth',T), out={};
  out.sun = lon(-E[0],-E[1]);
  for(const p of ['mercury','venus','mars','jupiter','saturn','uranus','neptune','pluto']){
    const P=helio(p,T); out[p]=lon(P[0]-E[0],P[1]-E[1]);
  }
  // Moon (Meeus ch.47, principal terms)
  const Lp=218.3164477+481267.88123421*T-0.0015786*T*T,
        D=297.8501921+445267.1114034*T-0.0018819*T*T,
        M=357.5291092+35999.0502909*T-0.0001536*T*T,
        Mp=134.9633964+477198.8675055*T+0.0087414*T*T,
        F=93.2720950+483202.0175233*T-0.0036539*T*T;
  const t=[[6288774,0,0,1,0],[1274027,2,0,-1,0],[658314,2,0,0,0],[213618,0,0,2,0],
    [-185116,0,1,0,0],[-114332,0,0,0,2],[58793,2,0,-2,0],[57066,2,-1,-1,0],
    [53322,2,0,1,0],[45758,2,-1,0,0],[-40923,0,1,-1,0],[-34720,1,0,0,0],

    [-6766,2,1,0,0],[-5163,1,0,-1,0],[4987,1,1,0,0],[4036,2,-1,1,0]];
  let s=0;
  for(const [c,d1,m1,mp1,f1] of t){
    let arg=(d1*D+m1*M+mp1*Mp+f1*F)*D2R, coef=c;
    if(m1) coef*= (1-0.002516*T-0.0000074*T*T)**Math.abs(m1);
    s+=coef*Math.sin(arg);
  }
  out.moon=((Lp+s/1e6)%360+360)%360;
  const _pr=(5029.0966*T+1.11161*T*T)/3600;
  for(const _k in out){ if(_k!=='moon'){ out[_k]=((out[_k]+_pr)%360+360)%360; } }
  out.sun=((out.sun-20.4955/3600)%360+360)%360;
  return out;
}
function ascmc(JD, lat, lonE){
  const T=(JD-2451545)/36525;
  let th=280.46061837+360.98564736629*(JD-2451545)+0.000387933*T*T + lonE;
  th=((th%360)+360)%360;
  const eps=(23.4392911-0.0130042*T)*D2R, thR=th*D2R, phi=lat*D2R;
  let asc=Math.atan2(Math.cos(thR), -(Math.sin(thR)*Math.cos(eps)+Math.tan(phi)*Math.sin(eps)))/D2R;
  asc=((asc%360)+360)%360;
  let mc=Math.atan2(Math.sin(thR), Math.cos(thR)*Math.cos(eps))/D2R;
  mc=((mc%360)+360)%360;
  return {asc, mc, lst:th};
}

const COL = {}; for(const c of D.cols) COL[c.label] = c;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// The facts come from the content tables (data/db, edited in the content workbook) through lib/db.js
const SIGNS = DB.rows('signs').map(s=>s.name);
const SGLYPH = DB.rows('signs').map(s=>s.glyph+'︎');   // U+FE0E: drawn as a text glyph, not an emoji
// the 777 row of each sign: the path whose sign it is
const SIGNKEY = DB.rows('signs').map(s=>DB.where('keyscale',{sign:s.id})[0].id);
// [id, glyph and name, 777 row]: the bodies the ephemeris gives, in the usual order. A planet's row is its own path;
// an outer planet's, the path of its element (planets.element: Uranus Air → 11 …)
const BODIES = ['sun','moon','mercury','venus','mars','jupiter','saturn','uranus','neptune','pluto'].map(k=>{
  const p=DB.get('planets',k), row=DB.where('keyscale',{planet:k})[0]||DB.where('keyscale',{element:p.element})[0];
  return [k,p.glyph+' '+p.name,row.id]; });
// The court card ruling each 30° from 20° Pisces (20° of the sign before + the first 20° of the sign): the rank whose
// quality is the sign's (court_ranks.quality), of the suit of the sign's element; named Book T / Thoth ("King / Knight")
const SUITOF = Object.fromEntries(DB.rows('suits').map(s=>[s.element,s]));
const RANKNAME = r=>r.gd_name&&r.gd_name!==r.name?r.gd_name+' / '+r.name:r.name;
const COURT = DB.rows('signs').map(s=>[RANKNAME(DB.where('court_ranks',{quality:s.quality})[0]),SUITOF[s.element].name]);
const SUITCOL = Object.fromEntries(DB.rows('suits').map(s=>[s.name,s.court_column]));   // 777 column of a suit's courts
// the 777 row of a rank's court cards: the path of the rank's element (Queen: Water → 23 …)
const COURTKEY = Object.fromEntries(DB.where('court_ranks',r=>r.quality).map(r=>[RANKNAME(r),DB.where('keyscale',{element:r.element})[0].id]));
// the small cards of each sign's three decans (cards.decan) and their 777 title columns
const MINSUIT = DB.rows('signs').map(s=>SUITOF[s.element].name);
const MINRANK = DB.rows('signs').map(s=>DB.where('decans',{sign:s.id}).sort((a,b)=>a.n-b.n).map(d=>DB.rev('cards','decan',d.id)[0].n));
const MINCOL = Object.fromEntries(DB.rows('suits').map(s=>[s.name,s.title_column]));
const DECANCOLS = [['CXLVI','CXLIX','CLII'],['CXLVII','CL','CLIII'],['CXLVIII','CLI','CLIV']];
// 777's name for the 1st, 2nd and 3rd decan: the bracket of its angels' column title ("Angels of the Decantes (Ascendant).")
const DECANWORD = DECANCOLS.map(([c])=>(/\(([^()]+)\)[.\s]*$/.exec(COL[c].title)||[])[1]||'');
// 'ATU' is not a 777 column: it is the Thoth trump of the row (ATU below)
const SIGNCOLS = [['II','Hebrew letter'],['III','Meaning'],['ATU','Tarot trump'],['CLXXX','Trump title'],['VI','Heaven of Assiah'],
 ['XIX','Egyptian god'],['XXXIV','Greek god'],['XXXV','Roman god'],['XXXVIII','Animal'],['XXXIX','Plant'],
 ['XL','Stone'],['XLI','Magical weapon'],['XLII','Perfume'],['CXLI','Tribe'],['CXLII','Angel of house']];
const PLANCOLS = [['II','Hebrew letter'],['ATU','Tarot trump'],['CLXXX','Trump title'],['LXXVII','Number'],['LXXVIII','Intelligence'],
 ['LXXIX','Spirit'],['LXXX','Olympic spirit'],['LXXXI','Metal'],['XXXVIII','Animal'],['XXXIX','Plant'],
 ['XL','Stone'],['XLI','Magical weapon'],['XLII','Perfume']];
// Thoth numbering and names of the trump on each path (cards.keyscale: Keys 11–32)
const ROMAN = ['0','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI'];
const ATU = Object.fromEntries(DB.where('cards',c=>c.keyscale).map(c=>[c.keyscale,ROMAN[c.n]+' '+c.name]));
// Where Crowley's Thoth attributions differ from the Golden Dawn ones that 777's columns keep (keyscale.thoth_note)
const THOTH_NOTE = Object.fromEntries(DB.where('keyscale',k=>k.thoth_note).map(k=>[k.id,k.thoth_note]));
// Tidy editorial marks for display: footnote stars, [[later additions]] → [ ], ligatures split by a
// space ("Æ olus") and line-break hyphens ("Volup- tuous"; "flame- coloured" keeps its hyphen).
function clean(s){
  return String(s).replace(/^\s*\*\s*|\s*\*\s*$/g,'').replace(/\[\[(.*?)\]\]/g,'[$1]')
    .replace(/([æœÆŒ]) (?=\w)/g,'$1').replace(/(\w)- (coloured)\b/g,'$1-$2').replace(/(\w)- (?=\w)/g,'$1')
    .replace(/\s{2,}/g,' ').trim();
}
const DITTO=/^[”″〃]\s*/;
// Display text of one cell: ditto mark expanded from the row above, marks cleaned
function cellText(c, k){
  let v=c.cells[k];
  if(!v) return '';
  if(DITTO.test(v)){ // e.g. XII: "” 1 – 3" under "Path joins 1 – 2"
    for(let j=D.keys.indexOf(k)-1;j>=0;j--){
      const p=c.cells[D.keys[j]];
      if(p&&!DITTO.test(p)){ v=/^\D*/.exec(p)[0]+v.replace(DITTO,''); break; }
    }
  }
  return clean(v);
}
function cv(label, k){ if(label==='ATU') return ATU[k]||''; const c=COL[label]; return c ? cellText(c,k) : ''; }
function swatch(label,k){ const c=COL[label]; if(!c||!c.colors||!c.colors[k]) return '';
  return c.colors[k].map(h=>`<span class="sw" style="background:${h}"></span>`).join(''); }
function fmt(l){ const s=Math.floor(l/30), d=l%30, dd=Math.floor(d), mm=Math.floor((d-dd)*60);
  return {s, txt:`${dd}°${String(mm).padStart(2,'0')}′ ${SGLYPH[s]} ${SIGNS[s]}`}; }
function chips(pairs, k){
  let h='';
  for(const [label,nice] of pairs){
    const v=cv(label,k); if(!v) continue;
    h+=`<div class="kv"><b>${nice}</b> (${label==='ATU'?'Thoth':label}): ${swatch(label,k)}${esc(v)}</div>`;
  }
  for(const [label,nice] of DB.rows('suits').map(s=>[s.scale,s.scale_name+' scale'])){   // the four colour scales
    const v=cv(label,k); if(!v) continue;
    h+=`<div class="kv"><b>${nice}</b>: ${swatch(label,k)}${esc(v)}</div>`;
  }
  return h;
}
function rowView(k){
  let h=`<button class="ghost close" onclick="ov.style.display='none'">✕ close</button>
  <div class="bh">Key Scale ${k} — every correspondence</div><table>`;
  for(const c of D.cols){ const v=cellText(c,k); if(!v) continue;
    h+=`<tr><td class="n">${c.label}</td><td class="t">${esc(c.title)}</td><td>${swatch(c.label,k)}${esc(v)}</td></tr>`; }
  h+='</table>';
  $('#ovc').innerHTML=h; $('#ov').style.display='block'; $('#ov').scrollTop=0;
}
function bodyCard(name, l, pkey, isAngle){
  const f=fmt(l), sk=SIGNKEY[f.s], dec=Math.floor((l%30)/10);
  const ci=Math.floor((((l-350)%360)+360)%360/30), [crank,csuit]=COURT[ci];
  const rank=MINRANK[f.s][dec], msuit=MINSUIT[f.s];
  const mtitle=cv(MINCOL[msuit], String(rank)); // suit columns: row "1" is the Ace, "2" the Two … "10" the Ten (as in Liber 777)
  const courttxt=cv(SUITCOL[csuit], COURTKEY[crank]);
  let h=`<div class="card"><div class="bh">${name} <span class="sub">${f.txt} · ${['1st','2nd','3rd'][dec]} decan (777: “${DECANWORD[dec]}”)</span></div>`;
  const tn=THOTH_NOTE[sk]?`<div class="kv hint">${esc(THOTH_NOTE[sk])}</div>`:'';
  h+=`<div class="sec"><div class="st">As ${SIGNS[f.s]} — Key ${sk} <a class="full" onclick="rowView('${sk}')">full row →</a></div>${chips(SIGNCOLS, sk)}${tn}</div>`;
  h+=`<div class="sec"><div class="st">Decan ${dec+1} of ${SIGNS[f.s]}</div>
    <div class="kv"><b>Angel of decan</b> (${DECANCOLS[dec][0]}): ${esc(cv(DECANCOLS[dec][0],sk)||'—')}</div>
    <div class="kv"><b>Magical image</b> (${DECANCOLS[dec][1]}): ${esc(cv(DECANCOLS[dec][1],sk)||'—')}</div>
    <div class="kv"><b>Perfume</b> (${DECANCOLS[dec][2]}): ${esc(cv(DECANCOLS[dec][2],sk)||'—')}</div>
    <div class="kv"><b>Minor card</b>: ${rank} of ${msuit}${mtitle?' — '+esc(mtitle):''}</div>
    <div class="kv"><b>Court card of this degree</b>: ${crank} of ${csuit}${courttxt?' — '+esc(courttxt):''}</div></div>`;
  if(pkey){
    h+=`<div class="sec"><div class="st">As planet — Key ${pkey} <a class="full" onclick="rowView('${pkey}')">full row →</a></div>${chips(PLANCOLS, pkey)}</div>`;
  }
  h+='</div>';
  return h;
}

// ---- dignities: the dignities table (the traditional rulers, as on the dignity sheet). Like Crowley, the app gives
// the outer planets no rulerships, so they take no dignity (signs.modern_ruler is not used)
const PNAME=Object.fromEntries(BODIES.map(([k])=>[k,DB.get('planets',k).name]));
const DIGLABEL=k=>{const r=DB.get('dignity_kinds',k);return r.short_label||r.name;};   // Domicile, Exalted …
function dignity(pname, sign){
  const p=DB.where('planets',{name:pname})[0], s=DB.where('signs',{name:sign})[0];
  const is=k=>DB.where('dignities',{planet:p.id,sign:s.id,kind:k}).length>0;
  if(is('domicile')) return [DIGLABEL('domicile'),DB.text('chart.dignity-domicile')];
  if(is('exaltation')) return [DIGLABEL('exaltation'),DB.text('chart.dignity-exaltation')];
  if(is('detriment')) return [DIGLABEL('detriment'),DB.text('chart.dignity-detriment')];
  if(is('fall')) return [DIGLABEL('fall'),DB.text('chart.dignity-fall')];
  if(p.kind==='outer') return ['None',DB.text('chart.dignity-outer')];
  return ['Peregrine',DB.text('chart.dignity-peregrine')];
}
// ---- aspects: [angle, name, glyph, orb, meaning, soft] from the aspects table; the orbs are this page's own
const ORB={conjunction:8,sextile:5,square:7,trine:7,opposition:8};
const ASPECTS=DB.rows('aspects').filter(a=>ORB[a.id]).map(a=>[a.angle,a.name,a.glyph,ORB[a.id],a.meaning||'',!!a.soft]);
function findAspects(pl){
  const out=[];
  for(let i=0;i<pl.length;i++)for(let j=i+1;j<pl.length;j++){
    let d=Math.abs(pl[i].lon-pl[j].lon); if(d>180)d=360-d;
    for(const [ang,nm,gl,orb,mean,soft] of ASPECTS){
      const off=Math.abs(d-ang);
      if(off<=orb){ out.push({a:pl[i],b:pl[j],nm,gl,mean,soft,orb:off,exact:ang}); break; }
    }
  }
  return out.sort((x,y)=>x.orb-y.orb);
}
// ---- chart wheel
// Ecliptic longitude L → SVG point. The zodiac runs counter-clockwise and longitude `rot` sits at
// 9 o'clock (rot = Ascendant, as on a standard chart; the MC then falls toward the top).
function wheelPtAt(cx,cy,r,L,rot){ const a=(180+L-(rot||0))*Math.PI/180; return [cx+r*Math.cos(a),cy-r*Math.sin(a)]; }
function drawWheel(pl,rot){
  const cx=200,cy=200,R=185,Rp=150,Ri=118;
  const wheelPt=(cx,cy,r,L)=>wheelPtAt(cx,cy,r,L,rot);
  let h=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="var(--card)" stroke="var(--acc)" stroke-width="1.5"/>
   <circle cx="${cx}" cy="${cy}" r="${Rp}" fill="none" stroke="var(--line)"/>
   <circle cx="${cx}" cy="${cy}" r="${Ri}" fill="none" stroke="var(--line)"/>`;
  for(let s=0;s<12;s++){
    const [x1,y1]=wheelPt(cx,cy,Ri,s*30),[x2,y2]=wheelPt(cx,cy,R,s*30);
    h+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--line)"/>`;
    const [gx,gy]=wheelPt(cx,cy,(R+Rp)/2,s*30+15);
    h+=`<text x="${gx}" y="${gy+5}" font-size="15" text-anchor="middle" fill="var(--sub)">${SGLYPH[s]}</text>`;
  }
  // aspect lines (dash pattern = type; colour-blind safe)
  const asp=findAspects(pl);
  for(const a of asp){
    if(a.exact===0)continue;   // conjunction: no line
    const [x1,y1]=wheelPt(cx,cy,Ri,a.a.lon),[x2,y2]=wheelPt(cx,cy,Ri,a.b.lon);
    const dash=a.soft?'2 4':(a.exact===180?'':'6 4');   // opposition solid, square dashed
    h+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--acc)" stroke-width="1" stroke-dasharray="${dash}" opacity=".55"/>`;
  }
  // planets
  for(const p of pl){
    const [x,y]=wheelPt(cx,cy,Rp+18,p.lon);
    const [tx,ty]=wheelPt(cx,cy,Ri-12,p.lon);
    h+=`<line x1="${wheelPt(cx,cy,Rp,p.lon)[0]}" y1="${wheelPt(cx,cy,Rp,p.lon)[1]}" x2="${tx}" y2="${ty}" stroke="var(--sub)" stroke-width=".5"/>`;
    h+=`<text x="${x}" y="${y+6}" font-size="16" text-anchor="middle" fill="var(--ink)">${p.glyph}</text>`;
  }
  return `<svg viewBox="0 0 400 400" style="width:100%;max-width:400px;display:block;margin:6px auto;background:var(--card);border:1px solid var(--line);border-radius:12px">${h}</svg>`;
}

let lastCalc=null; // {P, A, noTime} of the most recent go() — used for saved-chart summaries
// Calculates and renders the chart for the form; returns true on success.
function go(){
  const noTime=!$('#t').value; // no time entered: calculated for noon
  const dv=$('#d').value, tv=$('#t').value||'12:00';
  if(!dv){ alert('Pick a date'); return false; }
  const [y,mo,dd]=dv.split('-').map(Number), [hh,mi]=tv.split(':').map(Number);
  const tz=parseFloat($('#tz').value)||0, la=parseFloat($('#la').value)||0, lo=parseFloat($('#lo').value)||0;
  const JD=jd(y,mo,dd,hh+mi/60-tz);
  const P=positions(JD), A=ascmc(JD,la,lo);
  lastCalc={P,A,noTime};
  const PGL=Object.fromEntries(BODIES.map(([k])=>[k,DB.get('planets',k).glyph]));
  const pl=[{name:'Ascendant',lon:A.asc,glyph:'Asc',pkey:null},{name:'Midheaven',lon:A.mc,glyph:'MC',pkey:null}];
  for(const [key,nice,pk] of BODIES) pl.push({name:PNAME[key],lon:P[key],glyph:PGL[key],pkey:pk,pn:PNAME[key]});
  const ascSignIdx=Math.floor(A.asc/30);
  let h='';
  if(noTime) h+='<div class="rmsg">No time entered — calculated for 12:00 noon. The Ascendant, MC, houses and the wheel’s orientation are unreliable, and the Moon may be several degrees off.</div>';
  // wheel + house/dignity summary
  h+='<div class="card"><div class="bh">Chart wheel</div>'+drawWheel(pl.filter(p=>p.pkey!==null||['Ascendant','Midheaven'].includes(p.name)), A.asc);
  h+='<div class="hint" style="margin-top:4px">'+DB.text('chart.wheel')+'</div></div>';
  h+='<div class="card"><div class="bh">Placements</div><table>';
  h+='<tr><td class="n">Body</td><td class="n">Position</td><td class="n">House</td><td>Dignity</td></tr>';
  for(const p of pl){
    const f=fmt(p.lon), house=((f.s-ascSignIdx+12)%12)+1;
    let dig='';
    if(p.pn){ const [d,why]=dignity(p.pn,SIGNS[f.s]); dig=`<b>${d}</b> — <span class="hint">${why}</span>`; }
    h+=`<tr><td class="n">${p.glyph} ${p.name}</td><td>${f.txt}</td><td class="n">${['Ascendant','Midheaven'].includes(p.name)?'—':house}</td><td>${dig}</td></tr>`;
  }
  h+='</table><div class="hint" style="margin-top:4px">'+DB.text('chart.dignities',{domicile:DIGLABEL('domicile'),exaltation:DIGLABEL('exaltation'),detriment:DIGLABEL('detriment'),fall:DIGLABEL('fall')})+'</div></div>';
  // aspects
  const asp=findAspects(pl);
  h+='<div class="card"><div class="bh">Aspects</div>';
  if(asp.length){ h+='<table>';
    for(const a of asp) h+=`<tr><td class="n">${a.a.glyph} ${a.gl} ${a.b.glyph}</td><td class="n">${a.nm}</td><td>${a.orb.toFixed(1)}° orb · <span class="hint">${a.mean}</span></td></tr>`;
    h+='</table>'; }
  else h+='<div class="hint">No aspects within orb.</div>';
  h+='<div class="hint" style="margin-top:4px">'+DB.text('chart.aspects',Object.fromEntries(DB.rows('aspects').map(a=>[a.id,a.glyph])))+'</div></div>';
  // detailed correspondence cards
  h+='<div class="card"><div class="bh">777 correspondences of each placement</div><div class="hint">Full sign / decan / card / column detail follows below.</div></div>';
  h+=bodyCard('Ascendant', A.asc, null, true);
  for(const [key,nice,pk] of BODIES) h+=bodyCard(nice, P[key], pk);
  h+=bodyCard('Midheaven (MC)', A.mc, null, true);
  $('#res').innerHTML=h;
  return true;
}
function setNow(){ const n=new Date();
  $('#d').value=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
  $('#t').value=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  $('#tz').value=(-n.getTimezoneOffset()/60); }
// in a web browser (no Android bridge) a refused or missing location says so instead of doing nothing
const NO_BRIDGE=(()=>{try{return !((window.parent&&window.parent.Android)||window.Android);}catch(e){return !window.Android;}})();
const geoFail=()=>alert('Your location is not available here — type the latitude and longitude instead.');
function geo(){ if(!navigator.geolocation){ if(NO_BRIDGE)geoFail(); return; }
  navigator.geolocation.getCurrentPosition(p=>{
  $('#la').value=p.coords.latitude.toFixed(4); $('#lo').value=p.coords.longitude.toFixed(4); },NO_BRIDGE?geoFail:undefined); }

let selTZ = null;
function tzOffset(tz, y, mo, d, hh, mi){
  let guess = 0;
  for(let i=0;i<3;i++){
    const utcMs = Date.UTC(y, mo-1, d, hh, mi) - guess*3600e3;
    let parts;
    try{ parts = new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'longOffset'}).formatToParts(new Date(utcMs)); }
    catch(e){ parts = new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'short'}).formatToParts(new Date(utcMs)); }
    const nm = (parts.find(p=>p.type==='timeZoneName')||{}).value||'GMT';
    const m = nm.match(/GMT([+-])(\d{1,2})(?::(\d{2}))?/);
    const off = m ? (m[1]==='-'?-1:1) * (parseInt(m[2]) + (m[3]?parseInt(m[3])/60:0)) : 0;
    if(Math.abs(off-guess) < 1e-9) return off;
    guess = off;
  }
  return guess;
}
function cityMatches(q){
  q = q.toLowerCase();
  const pre = [], sub = [];
  for(const r of CITY.rows){
    const n = r[0].toLowerCase();
    if(n.startsWith(q)) pre.push(r);
    else if(q.length > 2 && n.includes(q)) sub.push(r);
    if(pre.length > 400) break;
  }
  return pre.sort((a,b)=>b[5]-a[5]).concat(sub.sort((a,b)=>b[5]-a[5])).slice(0,12);
}
function pickCity(i){
  const r = window._cm[i];
  $('#la').value = r[2]; $('#lo').value = r[3];
  selTZ = CITY.tzs[r[4]];
  $('#city').value = r[0] + ', ' + CITY.cos[r[1]];
  $('#citydd').style.display = 'none';
  updOffset();
}
function updOffset(){
  if(!selTZ) return;
  const dv = $('#d').value; if(!dv) return;
  const [y,mo,dd] = dv.split('-').map(Number);
  const [hh,mi] = ($('#t').value||'12:00').split(':').map(Number);
  const off = tzOffset(selTZ, y, mo, dd, hh, mi);
  $('#tz').value = off;
  $('#cityinfo').textContent = selTZ + ' · UTC' + (off>=0?'+':'') + off + ' on that date (auto; DST handled — edit the offset box to override)';
}
$('#city').addEventListener('input', () => {
  const q = $('#city').value.trim();
  const dd = $('#citydd');
  if(q.length < 2){ dd.style.display='none'; return; }
  const m = cityMatches(q);
  window._cm = m;
  if(!m.length){ dd.style.display='none'; return; }
  dd.innerHTML = m.map((r,i) =>
    `<div style="padding:8px 12px;cursor:pointer;border-top:1px solid var(--line);font-size:14.5px" onclick="pickCity(${i})">`+
    `<b>${r[0]}</b>${r[6]?', '+r[6]:''}, ${CITY.cos[r[1]]} <span style="color:var(--sub);font-size:12px">· ${CITY.tzs[r[4]]}</span></div>`).join('');
  dd.style.display = 'block';
});
document.addEventListener('click', e => { if(!e.target.closest('#city') && !e.target.closest('#citydd')) $('#citydd').style.display='none'; });
$('#d').addEventListener('change', updOffset);
$('#t').addEventListener('change', updOffset);

/* ---- Saved charts ----
   Kept through Store (../lib/store.js): in the app each chart is stored natively and a readable
   copy (the standalone page from buildChartHtml) lands in Documents/Athanor/Charts on the phone;
   in a desktop browser Store falls back to localStorage. */
const OLDKEY='l777charts'; // where earlier versions kept charts; migrated once by migrateOld()
const escH=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const INLINE_MAX=5;        // saved charts listed under the form; the rest live on the Saved Charts page
let curId=null, curName=''; // the saved chart currently loaded into the form, if any
let msgTimer=0;

function currentInputs(){
  return {d:$('#d').value,t:$('#t').value,tz:$('#tz').value,la:$('#la').value,lo:$('#lo').value,city:$('#city').value,selTZ};
}
function applyInputs(c){
  $('#d').value=c.d||''; $('#t').value=c.t||''; $('#tz').value=c.tz??''; $('#la').value=c.la??''; $('#lo').value=c.lo??'';
  $('#city').value=c.city||''; selTZ=c.selTZ||null;
  $('#cityinfo').textContent=c.selTZ?c.selTZ+' · '+utcText(c.tz):'';
}
const utcText=tz=>{ const n=Number(tz)||0; return 'UTC'+(n>=0?'+':'')+n; };
const hasVal=v=>String(v??'').trim()!=='';
const placeText=c=>c.city?c.city:(hasVal(c.la)&&hasVal(c.lo)?c.la+'°, '+c.lo+'°':'');
const defaultName=c=>(c.city?c.city.split(',')[0]+' · ':'')+c.d+(c.t?' '+c.t:'');
const degSign=l=>Math.floor(l%30)+'° '+SIGNS[Math.floor(l/30)];
// Same wording as the Saved Charts page: "28 Sep 2026 · 14:05 · UTC+1"
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function birthText(c){
  const p=/^(\d{4})-(\d{2})-(\d{2})$/.exec(c.d||'');
  let s=p?(+p[3])+' '+MONTHS[p[2]-1]+' '+p[1]:(c.d||'');
  if(c.t) s+=' · '+c.t;
  if(hasVal(c.tz)&&!isNaN(Number(c.tz))) s+=' · '+utcText(c.tz);
  return s;
}
// Sun / Moon / Ascendant of the last calculation, e.g. {sun:"☉ 19° Libra", ...}
function chartSummary(){
  if(!lastCalc) return {};
  const {P,A,noTime}=lastCalc;
  return {sun:'☉ '+degSign(P.sun), moon:'☽ '+degSign(P.moon), asc:noTime?'Asc ? (no time)':'Asc '+degSign(A.asc)};
}
// Where the phone copy of a stored record is, or '' when none was written (the app leaves out
// "mirror" if the copy in Documents failed). On Android 8–9 the copy goes to the app's own folder,
// and the mirror handle is then that file's path.
function phoneFolder(rec){
  const m=Store.native&&rec&&rec.mirror; if(!m) return '';
  if(m.charAt(0)!=='/') return Store.folder('charts');
  const dir=m.slice(0,m.lastIndexOf('/')), i=dir.indexOf('/Android/data/');
  return i>=0?dir.slice(i+1):dir;
}
// Compare form values loosely ("40.70" = "40.7"), for noticing that an opened chart was changed
const sameVal=(a,b)=>{ const f=v=>{ const s=String(v??'').trim(), n=Number(s); return s!==''&&isFinite(n)?String(n):s; }; return f(a)===f(b); };
function safeList(){ try{ return Store.list('charts')||[]; }catch(e){ return []; } }
function msg(text, isErr, keep){
  const m=$('#smsg'); m.textContent=text||''; m.className='smsg'+(isErr?' err':'');
  clearTimeout(msgTimer);
  if(text&&!isErr&&!keep) msgTimer=setTimeout(()=>{ m.textContent=''; },10000);
}
// Switch tools through the app shell; in a plain browser tab just navigate there.
// The shell's function is run as the parent's own timer callback so that the shell (not this page)
// is the calling document — its relative "tools/<key>.html" URL then resolves against index.html.
function toTool(k,q){
  try{
    const P=window.parent;
    if(P!==window&&typeof P.openTool==='function'){ P.setTimeout(P.openTool,0,k,q||''); return; }
  }catch(e){}
  location.href=k+'.html'+(q?'?'+q:'');
}

// A standalone page of the calculated chart: inline CSS, no scripts (opens in any browser, prints to PDF).
// Saved charts.html's Rename rewrites the <title> and <h1> written here, so keep their shape in step.
// Printing uses the light palette even when the device is in dark mode (backgrounds are not printed)
const PRINT_CSS='@media print{:root{--bg:#fff;--card:#fff;--ink:#000;--sub:#444;--acc:#7a5c2e;--line:#ccc;--hit:#f3ead2}'+
  'body{background:#fff}.card{break-inside:avoid}.sw{-webkit-print-color-adjust:exact;print-color-adjust:exact}}';
function buildChartHtml(name){
  const c=currentInputs(), s=chartSummary();
  const css=document.querySelector('style').textContent;
  const res=$('#res').cloneNode(true);
  res.querySelectorAll('a.full').forEach(a=>a.remove()); // "full row →" needs this page's script
  const sum=[s.sun,s.moon,s.asc].filter(Boolean).join(' · ');
  // header facts, leaving out whatever the chart does not have
  const parts=[[c.d,c.t].filter(Boolean).join(' '), hasVal(c.tz)?utcText(c.tz):'', c.city,
    hasVal(c.la)&&hasVal(c.lo)?c.la+'°, '+c.lo+'°':'',
    lastCalc&&lastCalc.noTime?'time unknown — noon used; Ascendant/MC unreliable':''].filter(Boolean);
  // keep "<h1>name <small>" as is: the Saved Charts page's Rename looks for it
  return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${escH(name)} — Athanor chart</title><style>${css} header{position:static}${PRINT_CSS}</style></head><body>
<header><h1>${escH(name)} <small>${parts.length?'· '+parts.map(escH).join(' · '):''}</small></h1>${sum?`<div class="sumline">${escH(sum)}</div>`:''}</header>
<main>${res.innerHTML}<p class="note">Made with Athanor — Sign Chart Calculator on ${escH(new Date().toLocaleString())}.</p></main></body></html>`;
}

function saveChart(){
  if(!go()) return; // calculate first so the saved page matches the form
  const c=currentInputs();
  const name=$('#sname').value.trim()||defaultName(c);
  const all=safeList(), lname=name.toLowerCase();
  let id=null;
  if(curId&&curName.toLowerCase()===lname&&all.some(r=>r.id===curId)){ // re-saving the opened chart
    // ask first if the date, time or place no longer match what was opened (e.g. after "Now")
    let old=null; try{ old=Store.get('charts',curId); }catch(e){}
    const od=(old&&old.data)||{};
    if(old&&['d','t','tz','la','lo'].some(k=>!sameVal(od[k],c[k]))&&
       !confirm('Update “'+curName+'” with the new date, time or place?\n\nCancel saves nothing — give the chart a new name to keep both.')){
      msg('Not saved. Give the chart a new name to keep both.',true); $('#sname').focus(); return;
    }
    id=curId;
  }else{
    const dup=all.find(r=>(r.name||'').toLowerCase()===lname);
    if(dup){ if(!confirm('Replace the saved chart “'+dup.name+'”?')) return; id=dup.id; }
  }
  let rec;
  try{
    rec=Store.put('charts',{id:id||Store.newId(),name,data:{...c,summary:chartSummary()},html:buildChartHtml(name)});
  }catch(e){ msg('Could not save this chart: '+(e.message||e),true); return; }
  curId=(rec&&rec.id)||id; curName=name; $('#sname').value=name;
  renderSaved();
  const where=phoneFolder(rec);
  msg('Saved “'+name+'”'+(where?' · also on your phone in '+where
    :Store.native?' in the app (the copy in Documents could not be written)':' on this device'));
}

// Loads a saved chart into the form and calculates it
function openChart(id, scroll){
  let r=null; try{ r=Store.get('charts',id); }catch(e){}
  if(!r){ msg('That saved chart could not be found — it may have been deleted.',true); renderSaved(); return false; }
  applyInputs(r.data||{});
  curId=r.id||id; curName=r.name||''; $('#sname').value=curName;
  if(!$('#d').value){ // e.g. a chart moved from an earlier version without a usable date
    $('#res').innerHTML=''; lastCalc=null;
    msg('Opened “'+curName+'” — it has no date yet. Enter one, then tap Save chart.',false,true);
    $('#d').focus(); return true;
  }
  const note='Opened “'+curName+'” — Save chart updates it; give it a new name to save a copy.';
  if(go()&&scroll){
    // the form's message is off-screen once the results scroll into view, so repeat it there
    // (go() rebuilds #res before anything is saved, so this never reaches a stored page)
    $('#res').insertAdjacentHTML('afterbegin','<div class="rmsg">'+escH(note)+'</div>');
    $('#res').scrollIntoView({behavior:'smooth'});
  }
  msg(note,false,true);
  return true;
}
function deleteChart(id){
  const r=safeList().find(x=>x.id===id); if(!r){ renderSaved(); return; }
  if(!confirm('Delete “'+r.name+'”?'+(Store.native?'\nIts copy on the phone is removed too.':''))) return;
  let ok=false;
  try{ ok=Store.remove('charts',id); }catch(e){ msg('Could not delete: '+(e.message||e),true); return; }
  if(!ok&&safeList().some(x=>x.id===id)){ msg('Could not delete “'+r.name+'”.',true); return; }
  if(curId===id){ curId=null; curName=''; }
  renderSaved();
}
function renderSaved(){
  const all=safeList();
  if(!all.length){ $('#slist').innerHTML='<div class="sempty">No saved charts yet. Fill in the details, name it, and tap Save chart.</div>'; return; }
  const rows=all.slice(0,INLINE_MAX).map(r=>{
    const c=r.data||{}, s=c.summary||{}, place=placeText(c);
    const sum=[s.sun,s.moon,s.asc].filter(Boolean).join(' · ');
    return `<div class="sc" data-id="${escH(r.id)}"><div class="nm" data-act="open"><b>${escH(r.name||'Untitled chart')}</b>
    <span>${escH(birthText(c))}${place?' · '+escH(place):''}</span>${sum?`<span class="sm">${escH(sum)}</span>`:''}</div>
    <button class="ghost" data-act="open">Open</button><button class="ghost" data-act="del" aria-label="Delete ${escH(r.name)}">✕</button></div>`;
  }).join('');
  const more=all.length>INLINE_MAX?'View all '+all.length+' saved charts →':'View all saved charts →';
  $('#slist').innerHTML='<div class="slh">Saved charts</div>'+rows+`<a class="full allc" href="charts.html" data-act="all">${more}</a>`;
}
$('#slist').addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  if(t.dataset.act==='all'){ e.preventDefault(); toTool('charts'); return; }
  const row=t.closest('.sc'); if(!row) return;
  if(t.dataset.act==='open') openChart(row.dataset.id,true);
  else if(t.dataset.act==='del') deleteChart(row.dataset.id);
});

// Save the calculated chart as a standalone HTML file (downloads, or the app's save dialog)
function exportChart(){
  if(!go()) return; // refresh so the file matches the form
  const name=$('#sname').value.trim()||defaultName(currentInputs());
  const html=buildChartHtml(name);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  a.download=name.replace(/[\\/:*?"<>|]+/g,'_').slice(0,60)+'.html';
  document.body.appendChild(a); a.click(); a.remove(); // attached so the app's download hook sees the click
  setTimeout(()=>URL.revokeObjectURL(a.href),60000);
}

// One-time move of charts saved by earlier versions (localStorage "l777charts") into Store.
// Each one is recalculated to get its summary and standalone page. Entries that fail stay in the old
// key for the next visit; ones already moved by an interrupted run are recognised and not duplicated.
// Entries without a usable date are kept as records with no page (a date can be added in the
// calculator), and the raw old value is backed up once under "l777charts.bak" before anything changes.
function migrateOld(){
  let raw=null, old=null;
  try{ raw=localStorage.getItem(OLDKEY); old=JSON.parse(raw); }catch(e){ return; }
  if(old==null) return;
  try{ if(localStorage.getItem(OLDKEY+'.bak')==null) localStorage.setItem(OLDKEY+'.bak',raw); }catch(e){}
  if(!Array.isArray(old)||!old.length){ try{ localStorage.removeItem(OLDKEY); }catch(e){} return; }
  const sig=(name,c)=>[String(name).toLowerCase(),c.d,c.t,c.la,c.lo].join('|');
  const have=new Set(safeList().map(r=>sig(r.name,r.data||{})));
  const snap=currentInputs(), left=[];
  let moved=0, undated=0, unread=0, where='';
  for(const c of old.slice().reverse()){ // oldest first, so the newest ends up on top
    if(!c||typeof c!=='object'){ unread++; continue; } // not a chart record (still in the backup)
    try{
      const dated=/^\d{4}-\d{2}-\d{2}$/.test(c.d||'');
      const name=String(c.name||(dated?defaultName(c):'')||'Untitled chart');
      if(!have.has(sig(name,c))){
        let rec;
        if(dated){
          applyInputs(c);
          if(!go()) throw new Error('calculation failed');
          rec=Store.put('charts',{id:Store.newId(),name,data:{...currentInputs(),summary:chartSummary()},html:buildChartHtml(name)});
        }else{ // nothing to recalculate: keep what there is, without a page
          const data={selTZ:c.selTZ||null,summary:{}};
          for(const k of ['d','t','tz','la','lo','city']) data[k]=c[k]==null?'':String(c[k]);
          rec=Store.put('charts',{id:Store.newId(),name,data});
        }
        if(!where) where=phoneFolder(rec);
        have.add(sig(name,c));
      }
      if(!dated) undated++;
      moved++;
    }catch(e){ left.unshift(c); }
  }
  try{ if(left.length) localStorage.setItem(OLDKEY,JSON.stringify(left)); else localStorage.removeItem(OLDKEY); }catch(e){}
  // put the form back the way it was before the recalculations
  applyInputs(snap); $('#res').innerHTML=''; lastCalc=null;
  const bits=[];
  if(moved) bits.push('Moved '+moved+' saved chart'+(moved>1?'s':'')+' to the new saved-charts store'+(where?' · also on your phone in '+where:''));
  if(undated) bits.push(undated+(undated>1?' of them have':' of them has')+' no usable date — open '+(undated>1?'them':'it')+' from Saved Charts and add one');
  if(left.length) bits.push(left.length+' could not be moved yet and will be tried again next time');
  if(unread) bits.push(unread+' old entr'+(unread>1?'ies':'y')+' could not be read');
  if(bits.length) msg(bits.join('. ')+'.', !!(left.length||unread), !!(undated||left.length||unread));
}

/* Android Back: the shell calls its own onBack(); let this page close its overlay or city list first */
function handleBack(){
  if($('#ov').style.display==='block'){ $('#ov').style.display='none'; return true; }
  if($('#citydd').style.display==='block'){ $('#citydd').style.display='none'; return true; }
  return false;
}
function hookBack(){
  let P; try{ P=window.parent; if(!P||P===window||typeof P.onBack!=='function') return; }catch(e){ return; }
  const orig=P.onBack;
  const mine=function(){
    try{ if(!P.document.body.classList.contains('open')&&handleBack()) return true; }catch(e){} // the shell's drawer closes first
    return orig.apply(this,arguments);
  };
  try{ P.onBack=mine; }catch(e){ return; }
  addEventListener('pagehide',()=>{ try{ if(P.onBack===mine) P.onBack=orig; }catch(e){} });
}
